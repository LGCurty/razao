/* =========================== APP =========================== */
function App(){
  const [session,setSession]=useState(null);
  const [authReady,setAuthReady]=useState(!sb); // sem supabase, pula auth
  const [recovery,setRecovery]=useState(false); // veio de um link de "esqueci minha senha"
  const [loadStatus,setLoadStatus]=useState("carregando"); // carregando|ok|erro
  const [loadError,setLoadError]=useState("");
  const [loadNonce,setLoadNonce]=useState(0); // incrementar força uma nova tentativa de carga
  const [data,setData]=useState(SEED);
  const { transactions:txs, accounts, budgets, budgetExceptions, goals, holdings, categoryMemory, patrimonyHistory, recaps, settings } = data;
  const theme = data.theme || "dark";
  const isDesktop = useIsDesktop();
  const loaded = loadStatus==="ok"; // compat: usado pelas abas como "dados prontos"

  const [view,setView]=useState(new Date());
  const [tab,setTab]=useState("balanco");
  const [helpTarget,setHelpTarget]=useState(null);
  // filtro pendente pra aplicar assim que a aba de destino abrir (ver goToTab) — ex: clicar numa
  // categoria no Panorama chega no Balanço já com aquela categoria filtrada na lista
  const [pendingFilter,setPendingFilter]=useState(null);
  useEffect(()=>{ helpListener=(sectionId)=>{ setHelpTarget(sectionId); setTab("ajuda"); }; return ()=>{ helpListener=null; }; },[]);
  useEffect(()=>{ tabListener=(t,filter)=>{ setTab(t); setMoreOpen(false); if(filter) setPendingFilter(filter); }; return ()=>{ tabListener=null; }; },[]);
  // popover do mês e menu "⋯" são mutuamente exclusivos por construção (só um valor guardado);
  // setMonthPicker/setMenu abaixo são compatíveis com o uso anterior (booleano ou função de toggle)
  const [activePopover,setActivePopover]=useState(null); // "month" | "menu" | null
  const monthPicker = activePopover==="month";
  const menu = activePopover==="menu";
  function setMonthPicker(v){ setActivePopover(p=>{ const next = typeof v==="function" ? v(p==="month") : v; return next?"month":(p==="month"?null:p); }); }
  function setMenu(v){ setActivePopover(p=>{ const next = typeof v==="function" ? v(p==="menu") : v; return next?"menu":(p==="menu"?null:p); }); }
  const monthTriggerRef=useRef(null);
  const monthPopRef=useRef(null);
  const menuTriggerRef=useRef(null);
  const menuPopRef=useRef(null);
  // fecha ao clicar fora, com Esc (devolvendo o foco ao botão que abriu), ou ao abrir o outro popover
  useEffect(()=>{
    if(!activePopover) return;
    const popRef = activePopover==="month"?monthPopRef:menuPopRef;
    const triggerRef = activePopover==="month"?monthTriggerRef:menuTriggerRef;
    function onDocMouseDown(e){
      if(popRef.current && popRef.current.contains(e.target)) return;
      if(triggerRef.current && triggerRef.current.contains(e.target)) return;
      setActivePopover(null);
    }
    function onKeyDown(e){
      if(e.key==="Escape"){ setActivePopover(null); triggerRef.current?.focus(); }
    }
    document.addEventListener("mousedown", onDocMouseDown);
    document.addEventListener("keydown", onKeyDown);
    return ()=>{
      document.removeEventListener("mousedown", onDocMouseDown);
      document.removeEventListener("keydown", onKeyDown);
    };
  },[activePopover]);
  const [moreOpen,setMoreOpen]=useState(false);
  const [settingsOpen,setSettingsOpen]=useState(false);
  // aviso de versão nova: quem chama é o registro do service worker (no fim do arquivo), assim que
  // termina de baixar um build mais recente. Nada recarrega sozinho — a decisão é de quem está usando,
  // pra não perder o que estiver sendo digitado no meio de um lançamento.
  const [novaVersao,setNovaVersao]=useState(false);
  useEffect(()=>{
    window.__razaoNovaVersao=()=>setNovaVersao(true);
    return ()=>{ delete window.__razaoNovaVersao; };
  },[]);
  const [pickerYear,setPickerYear]=useState(view.getFullYear());
  const [scrolled,setScrolled]=useState(false);
  const [saveState,setSaveState]=useState("idle"); // idle|saving|saved|erro
  const [conflict,setConflict]=useState(null); // {message} quando há dados mais novos no servidor

  // sheet do formulário de lançamento (mobile) — controlado aqui pra poder abrir a partir do FAB em qualquer aba
  const [sheetOpen,setSheetOpen]=useState(false);
  const [sheetEditTx,setSheetEditTx]=useState(null);
  const [sheetPropagateIds,setSheetPropagateIds]=useState([]);
  const fabRef=useRef(null);
  function openAdd(){ setSheetEditTx(null); setSheetPropagateIds([]); setSheetOpen(true); }
  function openEditMobile(t,propagateIds){ setSheetEditTx(t); setSheetPropagateIds(propagateIds||[]); setSheetOpen(true); }

  const fileRef=useRef(null);
  const saveTimer=useRef(null);
  const retryTimer=useRef(null);
  const lastKnownUpdatedAtRef=useRef(null);
  const dirtyRef=useRef(false); // há alteração ainda não confirmada como salva (para o aviso de beforeunload)
  const [offlineReadOnly,setOfflineReadOnly]=useState(false); // sem conexão: abre com o último estado salvo, sem gravar nada

  useEffect(()=>{
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme==="dark"?"#08090D":"#F6F7F9");
  },[theme]);
  useEffect(()=>{
    const onScroll=()=>setScrolled(window.scrollY>4);
    window.addEventListener("scroll",onScroll,{passive:true});
    return ()=>window.removeEventListener("scroll",onScroll);
  },[]);

  // auth — inclui o evento PASSWORD_RECOVERY (usuário clicou no link de "esqueci minha senha")
  useEffect(()=>{
    if(!sb) return;
    sb.auth.getSession().then(({data})=>{ setSession(data.session); setAuthReady(true); });
    const { data:sub } = sb.auth.onAuthStateChange((event,s)=>{
      setSession(s);
      if(event==="PASSWORD_RECOVERY") setRecovery(true);
    });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  // carregar — nunca cai em SEED por falha: erro vira tela dedicada (LoadErrorScreen), sem sobrescrever nada
  useEffect(()=>{
    if(!authReady) return;
    if(sb && !session){ setLoadStatus("carregando"); return; }
    const userId = session ? session.user.id : null;
    let cancelled=false;
    setLoadStatus("carregando"); setLoadError(""); setOfflineReadOnly(false);
    (async()=>{
      try{
        const { data: loadedData, updatedAt } = await loadData(userId);
        if(cancelled) return;
        setData(loadedData);
        lastKnownUpdatedAtRef.current = updatedAt;
        dirtyRef.current = false;
        setLoadStatus("ok");
        // espelha um instantâneo somente-leitura no aparelho: se a rede cair numa próxima abertura,
        // é isso que permite abrir com o último estado conhecido em vez de uma tela de erro
        if(sb && userId){ try{ localStorage.setItem("razao_offline_cache", JSON.stringify({ data:loadedData, cachedAt:Date.now() })); }catch(_){} }
      }catch(e){
        console.error(e);
        if(cancelled) return;
        // falha de rede específica (não um erro do servidor/permissão): se houver um instantâneo salvo
        // de uma sessão anterior, abre com ele em modo somente leitura em vez de mostrar erro — sem
        // gravar nada, pra não arriscar sobrescrever o servidor com dados desatualizados.
        const looksOffline = !navigator.onLine || /fetch|network|Failed to fetch/i.test(e?.message||"");
        if(looksOffline && sb && userId){
          try{
            const cached = JSON.parse(localStorage.getItem("razao_offline_cache")||"null");
            if(cached && cached.data){
              setData(migrate(cached.data));
              lastKnownUpdatedAtRef.current = null;
              dirtyRef.current = false;
              setOfflineReadOnly(true);
              setLoadStatus("ok");
              return;
            }
          }catch(_){}
        }
        setLoadError(e.message||"Falha desconhecida ao carregar os dados.");
        setLoadStatus("erro");
      }
    })();
    return ()=>{ cancelled=true; };
  },[authReady, session, loadNonce]);

  // ao voltar a conexão em modo somente leitura, tenta buscar os dados reais e sincronizar de verdade
  useEffect(()=>{
    function onOnline(){
      if(!offlineReadOnly) return;
      const userId = session ? session.user.id : null;
      loadData(userId).then(({ data: freshData, updatedAt })=>{
        setData(freshData);
        lastKnownUpdatedAtRef.current = updatedAt;
        dirtyRef.current = false;
        setOfflineReadOnly(false);
        toast("Conexão restabelecida — dados sincronizados.","success");
      }).catch(()=>{ /* ainda sem sorte; continua em somente leitura até a próxima tentativa */ });
    }
    window.addEventListener("online", onOnline);
    return ()=>window.removeEventListener("online", onOnline);
  },[offlineReadOnly, session]);

  // salvar (debounce) com detecção de conflito entre dispositivos e nova tentativa automática em caso de falha
  async function attemptSave(userId, dataToSave, retryDelay){
    try{
      const result = await saveData(userId, dataToSave, lastKnownUpdatedAtRef.current);
      if(result.conflict){
        setSaveState("idle");
        setConflict({ message:"Seus dados foram alterados em outro dispositivo depois da última vez que este aparelho salvou." });
        return;
      }
      if(result.updatedAt!==undefined) lastKnownUpdatedAtRef.current = result.updatedAt;
      dirtyRef.current = false;
      setSaveState("saved");
      setTimeout(()=>setSaveState(s=>s==="saved"?"idle":s),2000);
      // mantém o espelho offline sempre no que acabou de ser confirmado como salvo — não só no que
      // foi carregado na abertura — senão uma sessão longa cheia de edições ficaria com um espelho velho
      if(sb && userId){ try{ localStorage.setItem("razao_offline_cache", JSON.stringify({ data:dataToSave, cachedAt:Date.now() })); }catch(_){} }
    }catch(err){
      console.error(err);
      setSaveState("erro");
      const nextDelay = retryDelay>=15000?15000:retryDelay===5000?15000:retryDelay===2000?5000:2000;
      clearTimeout(retryTimer.current);
      retryTimer.current = setTimeout(()=>attemptSave(userId,dataToSave,nextDelay), retryDelay||2000);
    }
  }
  function retrySaveNow(){ clearTimeout(retryTimer.current); attemptSave(session?session.user.id:null, data, 2000); }
  useEffect(()=>{
    if(loadStatus!=="ok" || offlineReadOnly) return; // somente leitura offline: nunca tenta gravar
    dirtyRef.current = true;
    setSaveState("saving");
    clearTimeout(saveTimer.current);
    clearTimeout(retryTimer.current);
    const userId = session ? session.user.id : null;
    saveTimer.current = setTimeout(()=>attemptSave(userId, data, 2000), 600);
    return ()=>clearTimeout(saveTimer.current);
  },[data, loadStatus, offlineReadOnly]);

  // avisa antes de fechar/recarregar a aba se ainda houver algo não confirmado como salvo
  useEffect(()=>{
    function onBeforeUnload(e){
      if(dirtyRef.current || saveState==="saving" || saveState==="erro"){ e.preventDefault(); e.returnValue=""; }
    }
    window.addEventListener("beforeunload", onBeforeUnload);
    return ()=>window.removeEventListener("beforeunload", onBeforeUnload);
  },[saveState]);

  // ao voltar o foco na aba, verifica (checagem leve, só o carimbo de tempo) se há versão mais nova salva alhures
  useEffect(()=>{
    if(!sb) return;
    function onVisible(){
      if(document.visibilityState!=="visible" || !session || loadStatus!=="ok") return;
      fetchServerUpdatedAt(session.user.id).then(serverUpdatedAt=>{
        if(serverUpdatedAt && lastKnownUpdatedAtRef.current && !sameInstant(serverUpdatedAt, lastKnownUpdatedAtRef.current)){
          setConflict({ message:"Há uma versão mais nova dos seus dados salva em outro dispositivo." });
        }
      }).catch(()=>{});
    }
    document.addEventListener("visibilitychange", onVisible);
    return ()=>document.removeEventListener("visibilitychange", onVisible);
  },[session, loadStatus]);

  async function reloadFromServer(){
    const userId = session ? session.user.id : null;
    try{
      const { data: freshData, updatedAt } = await loadData(userId);
      setData(freshData);
      lastKnownUpdatedAtRef.current = updatedAt;
      dirtyRef.current = false;
      setConflict(null);
      toast("Dados recarregados.","success");
    }catch(e){ toast("Não foi possível recarregar agora.","error"); }
  }
  async function keepThisScreen(){
    const userId = session ? session.user.id : null;
    try{
      const result = await saveData(userId, data, null, true); // force: ignora o conflito e grava por cima
      if(result.updatedAt!==undefined) lastKnownUpdatedAtRef.current = result.updatedAt;
      dirtyRef.current = false;
      setConflict(null);
      toast("Dados desta tela salvos por cima.","success");
    }catch(e){ toast("Não foi possível salvar agora. Tente de novo.","error"); }
  }

  useEffect(()=>{ if(monthPicker) setPickerYear(view.getFullYear()); },[monthPicker]);
  // ponto único de mutação: bloquear aqui cobre todo formulário/botão do app de uma vez, sem precisar
  // desabilitar cada um individualmente enquanto estiver em modo somente leitura offline
  const update=(patch)=>{
    if(offlineReadOnly){ toast("Sem conexão — modo somente leitura. Esta alteração não foi salva.","error"); return; }
    setData(d=>({ ...d, ...(typeof patch==="function"?patch(d):patch) }));
  };

  const vKey=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,"0")}`;
  // índice único por mês (mês da fatura, respeitando txEffectiveMonth): uma única passada por todos os
  // lançamentos alimenta entradas/saídas/investido/proventos/categoria (só o realizado) de cada mês, mais
  // a lista bruta de itens daquele mês (previsto incluso, pra quem precisar mostrar tudo). Balanço, Panorama
  // e Investimentos leem daqui em O(1) por mês, em vez de re-varrer txs inteiro dentro de laços de 6/24 meses.
  const monthIndex=useMemo(()=>{
    const idx={};
    const bucket=(mk)=>idx[mk]||(idx[mk]={entradas:0,saidas:0,investido:0,proventos:0,porCategoria:{},itens:[]});
    txs.forEach(t=>{
      const b=bucket(txEffectiveMonth(t,accounts));
      b.itens.push(t);
      if(!isRealized(t)) return;
      if(t.type==="ganho"){ b.entradas+=t.cents; if(t.category==="Proventos") b.proventos+=t.cents; }
      else if(t.type==="gasto"){ b.saidas+=t.cents; b.porCategoria[t.category]=(b.porCategoria[t.category]||0)+t.cents; }
      else if(t.type==="investimento"){ b.investido+=t.cents; }
    });
    return idx;
  },[txs,accounts]);
  const EMPTY_BUCKET={entradas:0,saidas:0,investido:0,proventos:0,porCategoria:{},itens:[]};
  const monthBucket=(mk)=>monthIndex[mk]||EMPTY_BUCKET;
  const monthItens=monthBucket(vKey).itens; // itens brutos do mês exibido (inclui previsto) — usados por Contas/Investimentos

  // saldo do mês: o realizado é o que conta pra valer; o previsto (lançamentos futuros ainda não ocorridos)
  // aparece separado, nunca somado ao saldo principal — só entra de fato quando marcado como pago
  const totals=useMemo(()=>{
    const b=monthBucket(vKey);
    let previstoInc=0,previstoExp=0,previstoInv=0;
    b.itens.forEach(t=>{
      if(isRealized(t)) return;
      if(t.type==="ganho") previstoInc+=t.cents;
      else if(t.type==="gasto") previstoExp+=t.cents;
      else if(t.type==="investimento") previstoInv+=t.cents;
    });
    return { inc:b.entradas, exp:b.saidas, inv:b.investido, saldo:b.entradas-b.saidas-b.investido, previstoInc,previstoExp,previstoInv,previstoSaldo:previstoInc-previstoExp-previstoInv };
  },[monthIndex,vKey]);
  const prevTotals=useMemo(()=>{
    const d=new Date(view.getFullYear(),view.getMonth()-1,1);
    const pk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const b=monthBucket(pk);
    return { saldo:b.entradas-b.saidas-b.investido };
  },[monthIndex,view]);
  // a lista mostra tudo (inclusive previsto, atenuado) — só os totais/históricos/gráficos excluem o previsto
  const grouped=useMemo(()=>{
    const g={};
    [...monthBucket(vKey).itens].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id.localeCompare(a.id)).forEach(t=>{(g[t.date]=g[t.date]||[]).push(t);});
    return g;
  },[monthIndex,vKey]);
  // base única para o orçamento: gastos no mês da fatura (flow), não no mês-calendário — evita o total do topo
  // divergir da soma das categorias quando há cartão com fechamento/vencimento configurado. só o realizado
  // conta pro orçamento — um gasto previsto ainda não aconteceu, não deveria comprometer o limite ainda.
  const flowSpentByCat=useMemo(()=>monthBucket(vKey).porCategoria,[monthIndex,vKey]);
  // mesma régua do resto do orçamento (mês da fatura, não da compra) — senão o mín/média/máx não é comparável ao valor exibido acima
  const catHistory=useMemo(()=>{
    const pm={};
    Object.entries(monthIndex).forEach(([mk,b])=>{
      Object.entries(b.porCategoria).forEach(([cat,cents])=>{ (pm[cat]=pm[cat]||{})[mk]=cents; });
    });
    const o={};
    for(const c in pm){ const v=Object.values(pm[c]); o[c]={min:Math.min(...v),max:Math.max(...v),avg:Math.round(v.reduce((a,b)=>a+b,0)/v.length)}; }
    return o;
  },[monthIndex]);
  // orçamento variável: usa a exceção do mês exibido quando existir, senão o padrão da categoria
  const budgetRows=useMemo(()=>{
    const exceptionsThisMonth=budgetExceptions[vKey]||{};
    const cats=new Set([...Object.keys(budgets),...Object.keys(flowSpentByCat),...Object.keys(exceptionsThisMonth)]);
    return [...cats].map(c=>{
      const isException=Object.prototype.hasOwnProperty.call(exceptionsThisMonth,c);
      const limit=isException?exceptionsThisMonth[c]:(budgets[c]||0);
      const spent=flowSpentByCat[c]||0,pct=limit>0?spent/limit:0;
      const status=limit===0?"none":pct>=1?"over":pct>=0.8?"warn":"ok";
      return{cat:c,limit,spent,pct,status,hist:catHistory[c],isException};
    }).sort((a,b)=>b.spent-a.spent);
  },[budgets,budgetExceptions,vKey,flowSpentByCat,catHistory]);
  const plannedTotal=useMemo(()=>budgetRows.reduce((s,r)=>s+r.limit,0),[budgetRows]);
  const alerts=budgetRows.filter(r=>r.status==="over"||r.status==="warn");
  const byCatChart=useMemo(()=>Object.entries(flowSpentByCat).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value,color:CAT_COLOR[name]||"var(--text-mut)"})),[flowSpentByCat]);
  const acctName=(id)=>accounts.find(a=>a.id===id);
  const sparkline=useMemo(()=>{
    const arr=[];
    for(let i=5;i>=0;i--){
      const d=new Date(view.getFullYear(),view.getMonth()-i,1);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const b=monthBucket(mk);
      arr.push(b.entradas-b.saidas-b.investido);
    }
    return arr;
  },[monthIndex,view]);

  function moveMonth(d){setView(v=>new Date(v.getFullYear(),v.getMonth()+d,1));}
  function selectMonth(d){setView(new Date(d.getFullYear(),d.getMonth(),1));setMonthPicker(false);}
  function goToday(){const t=new Date();selectMonth(t);}

  function exportData(silent){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`razao-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(url);setMenu(false);if(!silent)toast("Backup exportado.","success");}

  // importação: nunca troca os dados na hora — mostra um resumo (mesclar x substituir) antes de qualquer coisa
  const [importPreview,setImportPreview]=useState(null); // {incoming:{...contagens},current:{...contagens},raw}
  const [importMode,setImportMode]=useState("merge"); // merge|replace
  const [replaceConfirmText,setReplaceConfirmText]=useState("");
  function importData(e){
    const f=e.target.files?.[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      let parsed;
      try{ parsed=JSON.parse(r.result); }
      catch(err){ toast("Arquivo inválido.","error"); return; }
      if(!parsed||typeof parsed!=="object"){ toast("Arquivo inválido.","error"); return; }
      setImportPreview({
        raw: parsed,
        incoming:{ transactions:(parsed.transactions||[]).length, accounts:(parsed.accounts||[]).length, goals:(parsed.goals||[]).length, holdings:(parsed.holdings||[]).length },
        current:{ transactions:txs.length, accounts:accounts.length, goals:goals.length, holdings:holdings.length },
      });
      setImportMode("merge"); setReplaceConfirmText("");
    };
    r.readAsText(f); setMenu(false); setMoreOpen(false);
    e.target.value="";
  }
  function applyImport(){
    if(!importPreview) return;
    // migrate() primeiro: um backup exportado antes do modelo atual (sem schemaVersion, sem status,
    // sem saldo inicial) precisa entrar já no formato certo, tanto ao substituir quanto ao mesclar.
    const raw = migrate(importPreview.raw);
    if(importMode==="replace"){
      if(replaceConfirmText.trim().toLowerCase()!=="substituir") return;
      exportData(true); // backup automático do estado atual antes de qualquer substituição
      setData(raw);
      toast("Dados substituídos. Um backup do estado anterior foi baixado.","success");
    } else {
      const mergeArr=(curr,inc)=>{ const ids=new Set(curr.map(x=>x.id)); return [...curr, ...inc.filter(x=>x&&x.id&&!ids.has(x.id))]; };
      setData(d=>({
        ...d,
        transactions: mergeArr(d.transactions, raw.transactions||[]),
        accounts: mergeArr(d.accounts, raw.accounts||[]),
        goals: mergeArr(d.goals, raw.goals||[]),
        holdings: mergeArr(d.holdings, raw.holdings||[]),
        budgets: { ...(raw.budgets||{}), ...d.budgets },
        budgetExceptions: { ...(raw.budgetExceptions||{}), ...d.budgetExceptions },
      }));
      toast("Dados mesclados.","success");
    }
    setImportPreview(null);
  }
  function exportCSV(){
    const esc=(v)=>{const s=String(v??"");return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
    const rows=[["ID","Data","Tipo","Categoria","Descricao","Conta","ContaDestino","Valor"]];
    txs.forEach(t=>{
      const acc=acctName(t.acctId);
      const toAcc=t.toAcctId?acctName(t.toAcctId):null;
      rows.push([t.id,t.date,TYPES[t.type].label,t.category||"",t.description||"",acc?acc.name:"",toAcc?toAcc.name:"",(t.cents/100).toFixed(2).replace(".",",")]);
    });
    const csv="﻿"+rows.map(r=>r.map(esc).join(";")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`razao-transacoes-${todayISO()}.csv`;a.click();URL.revokeObjectURL(url);
    setMenu(false);toast("CSV exportado.","success");
  }
  async function signOut(){ await sb.auth.signOut(); setMenu(false); }

  // gates
  if(recovery) return <RecoverySetPassword onDone={()=>setRecovery(false)}/>;

  const monthLabel=capFirst(view.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}));
  // cor de marca escolhida em Configurações > Personalização: sobrescreve --accent/--accent-deep
  // via style inline (maior especificidade que a regra .rz/.rz.dark do CSS), sem duplicar toda a
  // paleta — só o acento muda, o resto dos tokens do tema continua vindo do CSS normalmente
  const colorTheme = COLOR_THEME_MAP[settings?.colorTheme] || COLOR_THEME_MAP.aco;
  const themeVars = theme==="dark" ? colorTheme.dark : colorTheme.light;

  return (
    <div className={"rz "+theme} style={{"--accent":themeVars.accent,"--accent-deep":themeVars.deep}}>
      <div className={"topbar"+(scrolled?" scrolled":"")}>

            <button className="monthlabel" ref={monthTriggerRef} aria-expanded={monthPicker} onClick={()=>setMonthPicker(p=>!p)}>{monthLabel}<Icon name="chevron-baixo" size={12}/></button>
            <button className="mbtn" aria-label="Próximo mês" onClick={()=>moveMonth(1)}><Icon name="seta-direita" size={16}/></button>
            {monthPicker &&
              <div className="monthpop" ref={monthPopRef}>
                <div className="mpyear">
                  <button className="mbtn" aria-label="Ano anterior" onClick={()=>setPickerYear(y=>y-1)}><Icon name="seta-esquerda" size={14}/></button>
                  <b>{pickerYear}</b>
                  <button className="mbtn" aria-label="Próximo ano" onClick={()=>setPickerYear(y=>y+1)}><Icon name="seta-direita" size={14}/></button>
                </div>
                <div className="mpgrid">
                  {MONTH_NAMES.map((name,i)=>
                    <button key={name}
                      className={"mpm"+(pickerYear===view.getFullYear()&&i===view.getMonth()?" on":"")}
                      onClick={()=>selectMonth(new Date(pickerYear,i,1))}>{name}</button>)}
                </div>
                <button className="mptoday" onClick={goToday}>Ir para o mês atual</button>
              </div>}
          </div>
          <div className="topr">
            {saveState!=="idle" &&
              <span className={"saveind"+(saveState==="erro"?" err":"")}>
                <i/>
                <span>{saveState==="saving"?"Salvando…":saveState==="saved"?"Salvo":"Falha ao salvar"}</span>
                {saveState==="erro" && <button className="saveretry" onClick={retrySaveNow}>Tentar de novo</button>}
              </span>}
            <button className="iconbtn" aria-label="Alternar tema" onClick={()=>update(d=>({theme:d.theme==="dark"?"light":"dark"}))}><Icon name={theme==="dark"?"sol":"lua"} size={17}/></button>
            <div className="menu">
              <button className="iconbtn" ref={menuTriggerRef} aria-label="Menu" aria-expanded={menu} onClick={()=>setMenu(m=>!m)}><Icon name="mais" size={17}/></button>
              {menu &&
                <div className="menupop" ref={menuPopRef}>
                  {session && <div className="who">{session.user.email}</div>}
                  <button onClick={()=>{setSettingsOpen(true);setMenu(false);}}><Icon name="config" size={16}/> Configurações</button>
                  <button onClick={()=>exportData()}><Icon name="baixar" size={16}/> Exportar backup (.json)</button>
                  <button onClick={exportCSV}><Icon name="baixar" size={16}/> Exportar dados (.csv)</button>
                  <button onClick={()=>fileRef.current?.click()}><Icon name="enviar" size={16}/> Importar backup</button>
                  {sb && <button onClick={signOut}><Icon name="sair" size={16}/> Sair da conta</button>}
                </div>}
              <input ref={fileRef} type="file" accept="application/json" style={{display:"none"}} onChange={importData}/>
            </div>
          </div>
        </div>
      </div>

      <div className="wrap">
        <div className="shell">
          <nav className="sidebar" aria-label="Navegação principal">
            {TAB_GROUPS.map((g,gi)=>
              <div className="navgroup" key={gi}>
                <div className="navgrouplabel">{g.label}</div>
                {g.items.map(([k,l,ic])=>
                  <button key={k} className={"navitem"+(tab===k?" on":"")} data-tip={l} aria-current={tab===k?"page":undefined} onClick={()=>setTab(k)}>
                    <span className="navic"><Icon name={ic} size={18}/></span><span className="navlbl">{l}</span>
                  </button>)}
              </div>)}
            <div className="navfooter">
              <span className="navavatar">{session?session.user.email[0].toUpperCase():<Icon name="contas" size={14}/>}</span>
              <span className="navlbl2">
                <b>{session?session.user.email.split("@")[0]:"Modo local"}</b>
                <small>{session?"Conta conectada":"Somente neste aparelho"}</small>
                <small className="ver">versão {APP_VERSION}</small>
              </span>
            </div>
          </nav>

          <div className="tabcontent">
            {!sb && <div className="banner">Modo local: os dados ficam só neste aparelho. Configure o Supabase no início do arquivo para ter login e sincronização entre dispositivos.</div>}
            {offlineReadOnly && <div className="banner err">Sem conexão — mostrando a última versão salva. Alterações não serão gravadas até a conexão voltar.</div>}
            {novaVersao &&
              <div className="banner upd">
                <span>Uma versão mais nova do Razão já foi baixada. Recarregue quando quiser para usá-la.</span>
                <button className="sbtn" onClick={()=>window.location.reload()}><Icon name="brilho" size={14}/> Atualizar agora</button>
              </div>}
            {tab==="geral" && <Geral {...{txs,accounts,holdings,view,onSelectMonth:selectMonth,monthIndex,update,patrimonyHistory,recaps,aiModel:settings?.aiModel||"rapido"}}/>}
            {tab==="balanco" && <Balanco {...{grouped,monthLabel,totals,prevTotals,sparkline,plannedTotal,alerts,byCatChart,acctName,txs,view,accounts,onSelectMonth:selectMonth,update,isDesktop,onEditMobile:openEditMobile,monthIndex,categoryMemory,hourlyWageCents:settings?.hourlyWageCents||0,budgetRows,aiModel:settings?.aiModel||"rapido",pendingFilter,onConsumePendingFilter:()=>setPendingFilter(null)}}/>}
            {tab==="orcamento" && <Orcamento {...{budgetRows,budgets,budgetExceptions,update,plannedTotal,totalSpent:totals.exp,monthLabel,txs,view,accounts}}/>}
            {tab==="metas" && <Metas {...{goals,update,txs}}/>}
            {tab==="investimentos" && <Investimentos {...{holdings,update,monthIndex,monthLabel,txs,view,onSelectMonth:selectMonth}}/>}
            {tab==="extrato" && <Extrato {...{accounts,update,txs,aiModel:settings?.aiModel||"rapido"}}/>}
            {tab==="perguntar" && <Perguntar {...{txs,accounts}}/>}

          </div>
        </div>

      <nav className="bottomnav" aria-label="Navegação">

        <div className="sheetdivider"/>

      <Sheet open={!!importPreview} onClose={()=>setImportPreview(null)} title="Importar backup">
        {importPreview &&
          <React.Fragment>
            <p style={{fontSize:13,color:"var(--text-mut)",marginBottom:14,lineHeight:1.5}}>Compare o que tem no arquivo com o que já existe aqui antes de aplicar.</p>
            <div className="kv"><span className="kk">Lançamentos</span><span className="vv">{importPreview.current.transactions} atual · {importPreview.incoming.transactions} no arquivo</span></div>
            <div className="kv"><span className="kk">Contas</span><span className="vv">{importPreview.current.accounts} atual · {importPreview.incoming.accounts} no arquivo</span></div>
            <div className="kv"><span className="kk">Metas</span><span className="vv">{importPreview.current.goals} atual · {importPreview.incoming.goals} no arquivo</span></div>
            <div className="kv"><span className="kk">Ativos</span><span className="vv">{importPreview.current.holdings} atual · {importPreview.incoming.holdings} no arquivo</span></div>
            <div className="seg" style={{margin:"16px 0 12px"}}>
              <button className={importMode==="merge"?"on in":""} onClick={()=>setImportMode("merge")}>Mesclar</button>
              <button className={importMode==="replace"?"on out":""} onClick={()=>setImportMode("replace")}>Substituir tudo</button>
            </div>
            {importMode==="merge"
              ? <p className="hint">Mantém tudo o que já existe aqui e adiciona só os itens do arquivo que ainda não existem (comparando por id).</p>
              : <React.Fragment>
                  <p className="hint" style={{color:"var(--neg)"}}>Isso apaga os dados atuais e os troca pelos do arquivo. Um backup do estado atual é baixado automaticamente antes. Para confirmar, digite "substituir" abaixo.</p>
                  <input className="fld" value={replaceConfirmText} onChange={e=>setReplaceConfirmText(e.target.value)} placeholder='Digite "substituir"' style={{margin:"10px 0 4px"}}/>
                </React.Fragment>}
            <button className="submit" style={{marginTop:14}} onClick={applyImport} disabled={importMode==="replace"&&replaceConfirmText.trim().toLowerCase()!=="substituir"}>
              {importMode==="replace"?"Substituir tudo":"Mesclar dados"}
            </button>
          </React.Fragment>}
      </Sheet>

      <ToastHost/>
      <ConfirmHost/>
      <SeriesScopeHost/>
      <WelcomeTour/>
    </div>
  );
}

/* ---------- FORMULÁRIO DE LANÇAMENTO (usado inline no desktop e dentro do sheet no mobile) ---------- */
function TransactionForm({ accounts, txs, update, editTx, onDone, autoFocus, propagateIds, categoryMemory }){
  const [type,setType]=useState(editTx?editTx.type:"gasto");
  const [cents,setCents]=useState(editTx?editTx.cents:0);
  const [cat,setCat]=useState(editTx?(editTx.category||CATS.gasto[0][0]):"Alimentação");
  const [desc,setDesc]=useState(editTx?editTx.description:"");
  const [date,setDate]=useState(editTx?editTx.date:todayISO());
  const [acctId,setAcctId]=useState(editTx?(editTx.acctId||accounts[0]?.id||""):(accounts[0]?.id||""));
  const [toAcctId,setToAcctId]=useState(editTx?(editTx.toAcctId||accounts[1]?.id||accounts[0]?.id||""):(accounts[1]?.id||accounts[0]?.id||""));
  const [repeat,setRepeat]=useState(false);
  const [repeatMode,setRepeatMode]=useState("fixo"); // "fixo" (recorrente) | "parcelado"
  const [repeatTimes,setRepeatTimes]=useState(2);
  const [catManual,setCatManual]=useState(!!editTx);
  const [catSuggestBusy,setCatSuggestBusy]=useState(false);
  const formRef=useRef(null);
  const descTimer=useRef(null);
  const editId=editTx?editTx.id:null;

  // autocompletar #tag: sugere tags já usadas antes enquanto a pessoa digita "#" na descrição
  const knownTags=useMemo(()=>{ const set=new Set(); txs.forEach(t=>extractTags(t.description).forEach(tg=>set.add(tg))); return [...set].sort(); },[txs]);
  const tagFragmentMatch=desc.match(/#(\w*)$/);
  const tagFragment=tagFragmentMatch?tagFragmentMatch[1].toLowerCase():null;
  const tagSuggestions=tagFragment!=null?knownTags.filter(tg=>tg!==tagFragment&&tg.startsWith(tagFragment)).slice(0,5):[];
  const pickTagSuggestion=(tg)=>setDesc(d=>d.replace(/#(\w*)$/,"#"+tg+" "));

  useEffect(()=>{ if(!editTx && CATS[type]) setCat(CATS[type][0][0]); if(!editTx) setCatManual(false); },[type]);
  // sugestão de categoria enquanto o usuário digita a descrição (só se ele ainda não escolheu uma categoria na mão;
  // transferência não tem categoria). Primeiro consulta a memória local (descrição→categoria já escolhida antes) —
  // só cai pra IA se não achar nada ali, economizando uma chamada de rede no caso comum de descrição repetida.
  useEffect(()=>{
    clearTimeout(descTimer.current);
    if(editId || catManual || type==="transferencia" || desc.trim().length<3) return;
    const remembered=lookupCategoryMemory(categoryMemory, desc.trim());
    if(remembered && CATS[type].some(c=>c[0]===remembered)){ setCat(remembered); return; }
    descTimer.current=setTimeout(async()=>{
      setCatSuggestBusy(true);
      try{
        const suggested=await suggestCategoryWithAI(desc.trim(), type);
        if(suggested) setCat(suggested);
      }catch(_){ /* sugestão é só um bônus; sem IA a escolha manual de categoria continua normal */ }
      finally{ setCatSuggestBusy(false); }
    },800);
    return ()=>clearTimeout(descTimer.current);
  },[desc, type, catManual, editId, categoryMemory]);

  const isTransfer=type==="transferencia";
  const transferInvalid=isTransfer && (!toAcctId || acctId===toAcctId);

  function submit(){
    if(cents<=0)return;
    if(transferInvalid)return;
    const entryCat=isTransfer?"":cat;
    const entryToAcct=isTransfer?toAcctId:undefined;
    const today=todayISO();
    // memória de categorização: toda vez que um lançamento com descrição é salvo, guarda a categoria escolhida
    // pra essa descrição — próxima vez que ela aparecer, sugere direto sem precisar chamar a IA
    const rememberKey = (!isTransfer && desc.trim()) ? desc.trim().toLowerCase() : null;
    const withMemory = (d, patch)=> rememberKey ? {...patch, categoryMemory:{...(d.categoryMemory||{}), [rememberKey]:entryCat}} : patch;
    if(repeat && !editId){
      const n=Math.max(2,parseInt(repeatTimes,10)||2);
      const baseDesc=desc.trim()||(isTransfer?"Transferência":cat);
      const sId=uid(); // agrupa a série toda (recorrência/parcelamento) pra permitir editar/excluir em bloco depois
      const entries = repeatMode==="parcelado"
        ? splitCents(cents,n).map((c,i)=>{ const d=addMonthsISO(date,i); return { id:uid(), type, cents:c, category:entryCat, description:`${baseDesc} (${i+1}/${n})`, date:d, acctId, toAcctId:entryToAcct, status:d>today?"previsto":"realizado", seriesId:sId, seriesIndex:i, seriesTotal:n }; })
        : Array.from({length:n},(_,i)=>{ const d=addMonthsISO(date,i); return { id:uid(), type, cents, category:entryCat, description:desc.trim(), date:d, acctId, toAcctId:entryToAcct, status:d>today?"previsto":"realizado", seriesId:sId, seriesIndex:i, seriesTotal:n }; });
      update(d=>withMemory(d,{transactions:[...entries,...d.transactions]}));
      toast(`${n} lançamentos criados.`,"success");
      setCents(0);setDesc("");setRepeat(false);setRepeatTimes(2);setCatManual(false);
      formRef.current?.querySelector("input")?.focus();
      onDone && onDone();
      return;
    }
    const entry={
      id:editId||uid(), type, cents, category:entryCat, description:desc.trim(), date, acctId, toAcctId:entryToAcct,
      status: editId ? (editTx.status||"realizado") : (date>today?"previsto":"realizado"),
      ...(editId ? { seriesId:editTx.seriesId, seriesIndex:editTx.seriesIndex, seriesTotal:editTx.seriesTotal } : {}),
    };
    if(editId && propagateIds && propagateIds.length){
      // "este e os próximos" / "todos": propaga só os campos editáveis (não a data — cada ocorrência é a sua própria)
      update(d=>withMemory(d,{transactions: d.transactions.map(t=>{
        if(t.id===editId) return entry;
        // não propaga a descrição: no parcelado ela carrega o número da própria parcela "(2/4)" etc.,
        // então sobrescrever com a descrição do item editado apagaria a numeração dos outros.
        if(propagateIds.includes(t.id)) return {...t, type:entry.type, cents:entry.cents, category:entry.category, acctId:entry.acctId, toAcctId:entry.toAcctId};
        return t;
      })}));
    } else {
      update(d=>withMemory(d,{transactions:editId?d.transactions.map(t=>t.id===editId?entry:t):[entry,...d.transactions]}));
    }
    toast(editId?"Lançamento atualizado.":"Lançamento adicionado.","success");
    setCents(0);setDesc("");setCatManual(false);
    formRef.current?.querySelector("input")?.focus();
    onDone && onDone();
  }

  return (
    <div className="add" ref={formRef}>
      {editId && <div className="editing"><span>Editando lançamento</span><button onClick={onDone}>cancelar</button></div>}
      <div className="seg">
        {Object.entries(TYPES).map(([k,v])=><button key={k} className={(type===k?"on ":"")+v.cls} onClick={()=>setType(k)}>{v.label}</button>)}
      </div>
      <Money cents={cents} onChange={setCents} onEnter={submit} autoFocus={autoFocus}/>
      {!isTransfer &&
        <div className="chips">
          {CATS[type].map(([name,ic])=>
            <button key={name} className={"chip"+(cat===name?" on":"")} onClick={()=>{setCat(name);setCatManual(true);}}>
              <span className="swatch" style={{background:cat===name?"transparent":(CAT_COLOR[name]+"22")}}><Icon name={ic} size={12}/></span>{name}
            </button>)}
          {catSuggestBusy && <span className="aichip"><Icon name="brilho" size={12}/><span className="shimmer"/></span>}
        </div>}
      <div className="row2">
        <div style={{position:"relative"}}>
          <input className="fld" placeholder="Descrição (opcional) — use #tags" value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")submit();}}/>
          {tagSuggestions.length>0 &&
            <div className="tagsuggest">
              {tagSuggestions.map(tg=><button type="button" key={tg} onClick={()=>pickTagSuggestion(tg)}>#{tg}</button>)}
            </div>}
        </div>
        {isTransfer ? (
          <React.Fragment>
            <select className="fld" value={acctId} onChange={e=>setAcctId(e.target.value)} style={{flex:"0 0 auto",maxWidth:170}}>
              {accounts.map(a=><option key={a.id} value={a.id}>Origem: {a.name}</option>)}
            </select>
            <select className="fld" value={toAcctId} onChange={e=>setToAcctId(e.target.value)} style={{flex:"0 0 auto",maxWidth:170}}>
              {accounts.map(a=><option key={a.id} value={a.id}>Destino: {a.name}</option>)}
            </select>
          </React.Fragment>
        ) : (
          <select className="fld" value={acctId} onChange={e=>setAcctId(e.target.value)} style={{flex:"0 0 auto",maxWidth:170}}>
            {accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
        )}
        <input className="fld" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{flex:"0 0 auto",maxWidth:160}}/>
      </div>
      {isTransfer && transferInvalid && <p className="hint" style={{color:"var(--neg)"}}>A conta de origem e destino devem ser diferentes.</p>}
      {!editId &&
        <label className="toggle">
          <input type="checkbox" checked={repeat} onChange={e=>setRepeat(e.target.checked)}/>
          Repetir / Parcelar
        </label>}
      {!editId && repeat &&
        <div className="row2">
          <select className="fld" value={repeatMode} onChange={e=>setRepeatMode(e.target.value)}>
            <option value="fixo">Fixo / Recorrente</option>
            <option value="parcelado">Parcelado</option>
          </select>
          <input className="fld" type="number" min="2" placeholder="Vezes" value={repeatTimes}
            onChange={e=>setRepeatTimes(e.target.value)} style={{flex:"0 0 auto",maxWidth:120}}/>
        </div>}
      {!editId && repeat && cents>0 && (()=>{
        const n=Math.max(2,parseInt(repeatTimes,10)||2);
        return (
          <p className="hint" style={{marginTop:-6,marginBottom:14}}>
            {repeatMode==="parcelado"
              ? <>Serão criados {n} lançamentos de ~{brl(Math.round(cents/n))} cada, de {fmtDateBR(date)} até {fmtDateBR(addMonthsISO(date,n-1))}.</>
              : <>Serão criados {n} lançamentos de {brl(cents)} cada, de {fmtDateBR(date)} até {fmtDateBR(addMonthsISO(date,n-1))}.</>}
          </p>);
      })()}
      <button className="submit" onClick={submit} disabled={cents<=0||transferInvalid}>{editId?"Salvar alterações":repeat?`Criar ${Math.max(2,parseInt(repeatTimes,10)||2)} lançamentos`:"Salvar lançamento"}</button>
    </div>
  );
}

/* ---------- BALANÇO ---------- */
/* =======================================================================
   BRIEFING PARA A IA — o resumo do mês só fica bom se a IA receber mais do
   que quatro totais. Esta função monta o dossiê completo do mês (comparação
   com o mês anterior e com a média recente, categorias com variação, maiores
   gastos, cartões, orçamentos, recorrentes, previstos ainda não pagos) para
   que o texto gerado possa citar fato, número e causa em vez de generalidade.
   ======================================================================= */
/* formatação leve do texto que a IA devolve: "## título", "- item" e **negrito**. Não é markdown
   completo — é só o suficiente para o resumo elaborado ficar legível em vez de virar um bloco só. */
function aiInline(text, kp){
  return String(text).split(/(\*\*[^*]+\*\*)/g).filter(Boolean).map((part,i)=>
    part.startsWith("**")&&part.endsWith("**")
      ? <b key={kp+i}>{part.slice(2,-2)}</b>
      : <React.Fragment key={kp+i}>{part}</React.Fragment>);
}
function RichAI({ text }){
  const blocks=[];
  String(text||"").split("\n").forEach(raw=>{
    const line=raw.trim();
    if(!line) return;
    if(/^#{1,4}\s/.test(line)) blocks.push({k:"h",t:line.replace(/^#{1,4}\s*/,"").replace(/\*\*/g,"")});
    else if(/^[-*•]\s+/.test(line)) blocks.push({k:"li",t:line.replace(/^[-*•]\s+/,"")});
    else if(/^\d+[.)]\s+/.test(line)) blocks.push({k:"li",t:line.replace(/^\d+[.)]\s*/,"")});
    else blocks.push({k:"p",t:line});
  });
  const out=[]; let bucket=null;
  blocks.forEach(b=>{
    if(b.k==="li"){ if(!bucket){ bucket=[]; out.push({k:"ul",items:bucket}); } bucket.push(b.t); }
    else { bucket=null; out.push(b); }
  });
  return (
    <div className="airich">
      {out.map((b,i)=>
        b.k==="h" ? <h4 key={i}>{b.t}</h4>
        : b.k==="ul" ? <ul key={i}>{b.items.map((t,j)=><li key={j}>{aiInline(t,i+"-"+j+"-")}</li>)}</ul>
        : <p key={i}>{aiInline(b.t,i+"-")}</p>)}
    </div>
  );
}

const toReal = (c)=>Number((c/100).toFixed(2));
const pctDiff = (atual, anterior)=> anterior>0 ? Math.round(((atual-anterior)/anterior)*100) : null;

function buildMonthlyBriefing({ txs, accounts, monthDate, monthIndex, budgetRows }){
  const mkOf=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  const mk=mkOf(monthDate);
  const prevDate=new Date(monthDate.getFullYear(),monthDate.getMonth()-1,1);
  const prevMk=mkOf(prevDate);
  const nameOf=(id)=>accounts.find(a=>a.id===id)?.name||"—";
  // mesmo critério do resto do app: gasto no cartão pesa no mês em que a fatura vence
  const ofMonth=(key)=>txs.filter(t=>isRealized(t)&&txEffectiveMonth(t,accounts)===key);
  const cur=ofMonth(mk), prv=ofMonth(prevMk);
  const sumType=(arr,type)=>arr.filter(t=>t.type===type).reduce((s,t)=>s+t.cents,0);
  const curIn=sumType(cur,"ganho"), curOut=sumType(cur,"gasto"), curInv=sumType(cur,"investimento");
  const prvIn=sumType(prv,"ganho"), prvOut=sumType(prv,"gasto"), prvInv=sumType(prv,"investimento");

  const catSum=(arr)=>{ const m={}; arr.filter(t=>t.type==="gasto").forEach(t=>{ m[t.category]=(m[t.category]||0)+t.cents; }); return m; };
  const curCat=catSum(cur), prvCat=catSum(prv);
  const categorias=Object.entries(curCat).sort((a,b)=>b[1]-a[1]).map(([nome,c])=>({
    nome, valor:toReal(c),
    pctDoTotalDeGastos: curOut>0?Math.round((c/curOut)*100):0,
    mesAnterior: toReal(prvCat[nome]||0),
    variacaoPct: pctDiff(c, prvCat[nome]||0),
  }));
  // categoria que existia no mês passado e sumiu agora também é informação útil
  const categoriasQueSumiram=Object.entries(prvCat)
    .filter(([nome])=>!curCat[nome]).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([nome,c])=>({ nome, valorNoMesAnterior: toReal(c) }));

  const maioresGastos=cur.filter(t=>t.type==="gasto").sort((a,b)=>b.cents-a.cents).slice(0,8).map(t=>({
    data:t.date, descricao:(t.description||"").trim()||t.category, categoria:t.category, valor:toReal(t.cents), conta:nameOf(t.acctId),
  }));

  const cartoes=accounts.filter(a=>a.kind==="cartao").map(a=>{
    const inv=cardInvoiceNet(cur,a.id);
    return {
      nome:a.name, gastosNaFatura:toReal(inv.gasto), pagamentosRecebidos:toReal(inv.paid), emAberto:toReal(inv.net),
      limite:toReal(a.limit||0), pctDoLimiteUsado: a.limit>0?Math.round((inv.net/a.limit)*100):null,
    };
  }).filter(c=>c.gastosNaFatura>0||c.emAberto>0||c.pagamentosRecebidos>0);

  const contas=accounts.filter(a=>a.kind==="conta").map(a=>({
    nome:a.name,
    entrou: toReal(cur.filter(t=>t.type==="ganho"&&t.acctId===a.id).reduce((s,t)=>s+t.cents,0)),
    saiu: toReal(cur.filter(t=>t.type==="gasto"&&t.acctId===a.id).reduce((s,t)=>s+t.cents,0)),
  })).filter(c=>c.entrou>0||c.saiu>0);

  const trf=cur.filter(t=>t.type==="transferencia");
  const transferencias={
    quantidade: trf.length,
    volume: toReal(trf.reduce((s,t)=>s+t.cents,0)),
    pagamentosDeFatura: trf.filter(t=>accounts.find(a=>a.id===t.toAcctId)?.kind==="cartao")
      .map(t=>({ data:t.date, valor:toReal(t.cents), cartao:nameOf(t.toAcctId), origem:nameOf(t.acctId) })),
  };

  const previstos=txs.filter(t=>!isRealized(t)&&txEffectiveMonth(t,accounts)===mk);
  const aindaNaoPagos=previstos.filter(t=>t.type==="gasto").map(t=>({
    data:t.date, descricao:(t.description||"").trim()||t.category, valor:toReal(t.cents),
  })).sort((a,b)=>a.data<b.data?-1:1).slice(0,8);

  const orcamentos=(budgetRows||[]).filter(r=>r.limit>0).map(r=>({
    categoria:r.cat, limite:toReal(r.limit), gasto:toReal(r.spent), pctUsado:Math.round(r.pct*100),
    situacao: r.status==="over"?"estourado":r.status==="warn"?"perto do limite":"dentro do limite",
  }));

  // média dos 3 meses anteriores, para dizer se o mês foi fora da curva ou só normal
  const ultimos=[];
  for(let i=1;i<=6;i++){
    const d=new Date(monthDate.getFullYear(),monthDate.getMonth()-i,1);
    const b=(monthIndex||{})[mkOf(d)];
    if(b) ultimos.push({ mes:mkOf(d), entradas:toReal(b.entradas), saidas:toReal(b.saidas), investido:toReal(b.investido) });
  }
  const base=ultimos.slice(0,3);
  const mediaSaidas=base.length?base.reduce((s,m)=>s+m.saidas,0)/base.length:0;
  const mediaEntradas=base.length?base.reduce((s,m)=>s+m.entradas,0)/base.length:0;

  const diasNoMes=new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();
  const hojeNoMes=mkOf(new Date())===mk;
  const diasCorridos=hojeNoMes?new Date().getDate():diasNoMes;

  const recorrentes=detectRecurringCandidates(txs,new Date()).slice(0,6);

  return {
    mes: mk,
    mesAnterior: prevMk,
    mesEmAndamento: hojeNoMes,
    diasCorridos, diasNoMes,
    totais: {
      entradas: toReal(curIn), saidas: toReal(curOut), investido: toReal(curInv),
      saldo: toReal(curIn-curOut-curInv),
      taxaDePoupancaPct: curIn>0?Math.round(((curIn-curOut-curInv)/curIn)*100):null,
      gastoMedioPorDia: diasCorridos>0?toReal(Math.round(curOut/diasCorridos)):0,
      quantidadeDeLancamentos: cur.length,
    },
    comparacaoMesAnterior: {
      entradas: toReal(prvIn), saidas: toReal(prvOut), investido: toReal(prvInv),
      variacaoEntradasPct: pctDiff(curIn,prvIn),
      variacaoSaidasPct: pctDiff(curOut,prvOut),
      variacaoInvestidoPct: pctDiff(curInv,prvInv),
    },
    mediaTresMesesAnteriores: { entradas: Number(mediaEntradas.toFixed(2)), saidas: Number(mediaSaidas.toFixed(2)) },
    historicoRecente: ultimos,
    categorias, categoriasQueSumiram, maioresGastos, cartoes, contas, transferencias,
    orcamentos, aindaNaoPagos, recorrentesSuspeitos: recorrentes,
  };
}

/* instruções de estilo compartilhadas por resumo do mês e recaps — é o que separa um parágrafo
   genérico ("seus gastos aumentaram") de uma análise que cita a categoria, o valor e a causa. */
const AI_SUMMARY_STYLE = `Escreva em português do Brasil, na segunda pessoa ("você"), tom direto de quem entende de finanças pessoais e fala como gente — sem jargão, sem motivacional, sem emoji.

REGRAS:
- Use SOMENTE os números do JSON. Nunca invente valor, categoria ou lançamento que não esteja lá.
- Sempre que citar um número, dê o contexto: quanto foi, quanto era antes, quantos por cento mudou.
- Prefira a causa concreta ("Lazer subiu 62% por causa dos R$ 380 do dia 12") ao efeito genérico ("os gastos aumentaram").
- Se o mês ainda está em andamento (mesEmAndamento = true), fale em ritmo e projeção, não em fechamento.
- Se faltar dado para alguma seção, diga isso em uma linha em vez de encher linguiça.
- Valores em reais no formato R$ 1.234,56.

FORMATO DA RESPOSTA (use exatamente estes títulos, com "## " na frente, e "- " nos itens):
## O essencial
Dois ou três períodos com o veredito do mês: sobrou ou faltou, e por quê.
## Para onde foi o dinheiro
3 a 5 itens com as maiores categorias, o quanto representam do total e o lançamento que puxou cada uma.
## O que mudou
3 a 4 itens comparando com o mês anterior e com a média dos últimos meses — só o que mudou de verdade (variação relevante), incluindo o que caiu.
## Pontos de atenção
2 a 4 itens: orçamento estourado, fatura de cartão alta em relação ao limite, conta prevista ainda não paga, assinatura suspeita, gasto fora da curva.
## O que fazer agora
Exatamente 3 ações concretas e específicas, cada uma com o número que a justifica.`;

function Balanco({ grouped, monthLabel, totals, prevTotals, sparkline, plannedTotal, alerts, byCatChart, acctName, txs, view, accounts, onSelectMonth, update, isDesktop, onEditMobile, monthIndex, categoryMemory, hourlyWageCents, budgetRows, aiModel, pendingFilter, onConsumePendingFilter }){
  // Fase 4: busca + filtros combináveis, unificando também os filtros por clique nos gráficos (categoria/tipo).
  // Passam a valer em todos os meses (não só o exibido) — exceto quando um intervalo de datas é definido.
  const [search,setSearch]=useState("");
  const [filters,setFilters]=useState({accounts:[],types:[],categories:[],tags:[],dateFrom:"",dateTo:"",status:"",valueMin:"",valueMax:""});
  const [filterSheetOpen,setFilterSheetOpen]=useState(false);
  // filtro chegado de outra aba (ex: clique numa categoria no Panorama) — aplica uma vez e avisa o
  // App pra descartá-lo, senão reabrir o Balanço do zero reaplicaria o mesmo filtro de novo
  useEffect(()=>{
    if(!pendingFilter) return;
    if(pendingFilter.category) setFilters(f=>({...f,categories:[pendingFilter.category]}));
    else if(pendingFilter.tag) setFilters(f=>({...f,tags:[pendingFilter.tag]}));
    onConsumePendingFilter && onConsumePendingFilter();
  },[pendingFilter]);
  const [aiSummary,setAiSummary]=useState("");
  const [aiSummaryBusy,setAiSummaryBusy]=useState(false);
  const [aiSummaryError,setAiSummaryError]=useState("");
  const [inlineEditTx,setInlineEditTx]=useState(null);
  useEffect(()=>{ setAiSummary(""); setAiSummaryError(""); },[monthLabel]);

  const [inlinePropagateIds,setInlinePropagateIds]=useState([]);
  function requestEdit(t){
    function proceed(propagateIds){
      if(isDesktop){ setInlineEditTx(t); setInlinePropagateIds(propagateIds); window.scrollTo({top:0,behavior:"smooth"}); }
      else onEditMobile(t, propagateIds);
    }
    if(t.seriesId){
      askSeriesScope({ tx:t, txs, action:"editar", onChoice:(ids)=>proceed(ids.filter(id=>id!==t.id)) });
      return;
    }
    proceed([]);
  }

  // exclusão de lançamento: some da tela na hora (linha + totais do mês), com "Desfazer" por 6s antes de gravar de
  // verdade. Suporta excluir vários de uma vez (série de recorrência/parcelamento) com o mesmo mecanismo.
  const [pendingDeleteIds,setPendingDeleteIds]=useState(()=>new Set());
  const pendingTimers=useRef(new Map());
  const pendingTxs=useRef(new Map()); // id -> lançamento, só para recalcular os totais exibidos enquanto pendente
  useEffect(()=>()=>{ pendingTimers.current.forEach(t=>clearTimeout(t)); },[]);
  function doRequestDelete(ids, primaryTx){
    setPendingDeleteIds(prev=>{ const n=new Set(prev); ids.forEach(id=>n.add(id)); return n; });
    ids.forEach(id=>{ const found=txs.find(x=>x.id===id); if(found) pendingTxs.current.set(id, found); });
    const timer=setTimeout(()=>{
      update(d=>({ transactions:d.transactions.filter(x=>!ids.includes(x.id)) }));
      ids.forEach(id=>{ pendingTimers.current.delete(id); pendingTxs.current.delete(id); });
      setPendingDeleteIds(prev=>{ const n=new Set(prev); ids.forEach(id=>n.delete(id)); return n; });
    },6000);
    ids.forEach(id=>pendingTimers.current.set(id, timer));
    if(inlineEditTx&&ids.includes(inlineEditTx.id)) setInlineEditTx(null);
    const label = ids.length>1 ? `${ids.length} lançamentos excluídos.` : `"${primaryTx.description||primaryTx.category||TYPES[primaryTx.type].label}" excluído.`;
    toast(label,"default",{
      duration:6000,
      action:{ label:"Desfazer", onClick:()=>{
        clearTimeout(timer);
        ids.forEach(id=>{ pendingTimers.current.delete(id); pendingTxs.current.delete(id); });
        setPendingDeleteIds(prev=>{ const n=new Set(prev); ids.forEach(id=>n.delete(id)); return n; });
      }},
    });
  }
  function requestDelete(t){
    if(t.seriesId){
      askSeriesScope({ tx:t, txs, action:"excluir", onChoice:(ids)=>doRequestDelete(ids, t) });
      return;
    }
    doRequestDelete([t.id], t);
  }
  function markAsPaid(t){
    update(d=>({transactions:d.transactions.map(x=>x.id===t.id?{...x,status:"realizado"}:x)}));
    toast("Marcado como pago.","success");
  }

  async function generateSummary(){
    setAiSummaryBusy(true); setAiSummaryError(""); setAiSummary("");
    try{
      const briefing=buildMonthlyBriefing({ txs, accounts, monthDate:view, monthIndex, budgetRows });
      const prompt=`Você é o analista financeiro pessoal de quem usa este app. Abaixo está o dossiê COMPLETO do mês de ${monthLabel}, em JSON, já calculado a partir dos lançamentos reais (valores em reais).

${JSON.stringify(briefing)}

${AI_SUMMARY_STYLE}`;
      const text=await callGemini({ prompt, model: aiModelId(aiModel) });
      setAiSummary(text.trim());
    }catch(err){
      setAiSummaryError(err.message||"Não foi possível gerar o resumo.");
    }finally{
      setAiSummaryBusy(false);
    }
  }
  const evo=useMemo(()=>{
    const arr=[];
    for(let i=5;i>=0;i--){
      const d=new Date(view.getFullYear(),view.getMonth()-i,1);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const b=monthIndex[mk]||{entradas:0,saidas:0};
      arr.push({name:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".",""),bars:[{v:b.entradas/100,color:"var(--pos)"},{v:b.saidas/100,color:"var(--neg)"}],date:d});
    }
    return arr;
  },[monthIndex,view]);
  const hasEvo=evo.some(m=>m.bars.some(b=>b.v>0));
  const activeEvoIdx=evo.findIndex(e=>e.date.getFullYear()===view.getFullYear()&&e.date.getMonth()===view.getMonth());
  const typeOrder=["ganho","gasto","investimento"];
  const toggleInArray=(key,value)=>setFilters(f=>({...f,[key]:f[key].includes(value)?f[key].filter(v=>v!==value):[...f[key],value]}));
  const toggleCat=(name)=>toggleInArray("categories",name);
  const toggleType=(i)=>toggleInArray("types",typeOrder[i]);
  // clique no gráfico de barras só acende o destaque quando o filtro de tipo resultante é exatamente aquele
  const typeActiveIdx = filters.types.length===1 ? (typeOrder.indexOf(filters.types[0])===-1?null:typeOrder.indexOf(filters.types[0])) : null;
  const catSelected = filters.categories.length===1 ? filters.categories[0] : null;
  const allCategories = Object.keys(CAT_COLOR);
  const allTags=useMemo(()=>{ const set=new Set(); txs.forEach(t=>extractTags(t.description).forEach(tg=>set.add(tg))); return [...set].sort(); },[txs]);
  const hasActiveFilters = search.trim()!=="" || filters.accounts.length>0 || filters.types.length>0 || filters.categories.length>0 || filters.tags.length>0 || !!filters.dateFrom || !!filters.dateTo || !!filters.status || !!filters.valueMin || !!filters.valueMax;
  const activeFilterCount = filters.accounts.length + filters.types.length + filters.categories.length + filters.tags.length + (filters.dateFrom||filters.dateTo?1:0) + (filters.status?1:0) + (filters.valueMin||filters.valueMax?1:0);
  // busca/filtros valem pra todo o histórico (txs é a lista completa, não só o mês exibido)
  const searchResults=useMemo(()=>{
    if(!hasActiveFilters) return null;
    const q=search.trim().toLowerCase();
    const isTagQ=q.startsWith("#")&&q.length>1;
    const tagQ=isTagQ?q.slice(1):"";
    const minCents=filters.valueMin!==""?Math.round(parseFloat(filters.valueMin.replace(",","."))*100):null;
    const maxCents=filters.valueMax!==""?Math.round(parseFloat(filters.valueMax.replace(",","."))*100):null;
    return txs.filter(t=>{
      if(q){
        const desc=(t.description||"").toLowerCase();
        if(isTagQ){ if(!desc.includes("#"+tagQ)) return false; }
        else if(!desc.includes(q) && !(t.category||"").toLowerCase().includes(q)) return false;
      }
      if(filters.accounts.length && !filters.accounts.includes(t.acctId) && !(t.toAcctId&&filters.accounts.includes(t.toAcctId))) return false;
      if(filters.types.length && !filters.types.includes(t.type)) return false;
      if(filters.categories.length && !filters.categories.includes(t.category)) return false;
      if(filters.tags.length){ const tTags=extractTags(t.description); if(!filters.tags.some(tg=>tTags.includes(tg))) return false; }
      if(filters.dateFrom && t.date<filters.dateFrom) return false;
      if(filters.dateTo && t.date>filters.dateTo) return false;
      if(filters.status && (filters.status==="previsto"?isRealized(t):!isRealized(t))) return false;
      if(minCents!=null && !isNaN(minCents) && t.cents<minCents) return false;
      if(maxCents!=null && !isNaN(maxCents) && t.cents>maxCents) return false;
      return true;
    }).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id.localeCompare(a.id));
  },[hasActiveFilters,search,filters,txs]);
  const searchSummary=useMemo(()=>{
    if(!searchResults) return null;
    let sum=0;
    searchResults.forEach(t=>{ sum+=t.cents*TYPES[t.type].sign; });
    return { count:searchResults.length, sum };
  },[searchResults]);
  const searchGrouped=useMemo(()=>{
    if(!searchResults) return null;
    const g={};
    searchResults.forEach(t=>{(g[t.date]=g[t.date]||[]).push(t);});
    return g;
  },[searchResults]);
  const baseGrouped = hasActiveFilters ? (searchGrouped||{}) : grouped;
  // versão exibida: some da tela imediatamente os lançamentos com exclusão pendente (janela de "Desfazer")
  const displayGrouped=useMemo(()=>{
    if(pendingDeleteIds.size===0) return baseGrouped;
    const out={};
    Object.entries(baseGrouped).forEach(([d,list])=>{
      const f=list.filter(t=>!pendingDeleteIds.has(t.id));
      if(f.length) out[d]=f;
    });
    return out;
  },[baseGrouped,pendingDeleteIds]);
  const displayTotals=useMemo(()=>{
    if(pendingDeleteIds.size===0) return totals;
    let { inc, exp, inv, previstoInc, previstoExp, previstoInv } = totals;
    pendingDeleteIds.forEach(id=>{
      const t=pendingTxs.current.get(id);
      if(!t) return;
      const real=isRealized(t);
      if(t.type==="ganho"){ if(real) inc-=t.cents; else previstoInc-=t.cents; }
      else if(t.type==="gasto"){ if(real) exp-=t.cents; else previstoExp-=t.cents; }
      else if(t.type==="investimento"){ if(real) inv-=t.cents; else previstoInv-=t.cents; }
    });
    return { inc, exp, inv, saldo: inc-exp-inv, previstoInc, previstoExp, previstoInv, previstoSaldo: previstoInc-previstoExp-previstoInv };
  },[totals,pendingDeleteIds]);
  // relatório de #tags dentro da categoria filtrada (soma gasta por tag, extraída da descrição) — só quando
  // exatamente uma categoria está selecionada, sempre com base no mês exibido (o gráfico é do mês)
  const tagBreakdown=useMemo(()=>{
    if(filters.categories.length!==1) return [];
    const catName=filters.categories[0];
    const sums={};
    Object.values(grouped).flat().forEach(t=>{
      if(t.type!=="gasto" || t.category!==catName) return;
      extractTags(t.description).forEach(tg=>{ sums[tg]=(sums[tg]||0)+t.cents; });
    });
    return Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([tag,cents])=>({tag,cents}));
  },[filters.categories,grouped]);
  // chips removíveis: uma entrada por dimensão de filtro ativa (inclusive as vindas de clique no gráfico)
  const activeChips=useMemo(()=>{
    const chips=[];
    if(search.trim()) chips.push({key:"q",label:`Busca: "${search.trim()}"`,onRemove:()=>setSearch("")});
    filters.accounts.forEach(id=>{
      const a=accounts.find(x=>x.id===id);
      chips.push({key:"acc"+id,label:a?a.name:"Conta",onRemove:()=>toggleInArray("accounts",id)});
    });
    filters.types.forEach(ty=>chips.push({key:"ty"+ty,label:TYPES[ty].label,onRemove:()=>toggleInArray("types",ty)}));
    filters.categories.forEach(c=>chips.push({key:"cat"+c,label:c,onRemove:()=>toggleInArray("categories",c)}));
    filters.tags.forEach(tg=>chips.push({key:"tag"+tg,label:"#"+tg,onRemove:()=>toggleInArray("tags",tg)}));
    if(filters.dateFrom||filters.dateTo){
      chips.push({key:"date",label:`${filters.dateFrom?fmtDateBR(filters.dateFrom):"início"} – ${filters.dateTo?fmtDateBR(filters.dateTo):"hoje"}`,onRemove:()=>setFilters(f=>({...f,dateFrom:"",dateTo:""}))});
    }
    if(filters.status) chips.push({key:"status",label:filters.status==="previsto"?"Previsto":"Realizado",onRemove:()=>setFilters(f=>({...f,status:""}))});
    if(filters.valueMin||filters.valueMax){
      chips.push({key:"value",label:`${filters.valueMin?"R$ "+filters.valueMin:"R$ 0"} – ${filters.valueMax?"R$ "+filters.valueMax:"∞"}`,onRemove:()=>setFilters(f=>({...f,valueMin:"",valueMax:""}))});
    }
    return chips;
  },[search,filters,accounts]);
  function clearAllFilters(){ setSearch(""); setFilters({accounts:[],types:[],categories:[],tags:[],dateFrom:"",dateTo:"",status:"",valueMin:"",valueMax:""}); }

  const pctChange = prevTotals.saldo!==0 ? ((displayTotals.saldo-prevTotals.saldo)/Math.abs(prevTotals.saldo))*100 : (displayTotals.saldo>0?100:0);

  return (
    <React.Fragment>
      <div className="dashtop">
        <div className="hero">
          <div className="herotop">
            <div>
              <div className="eyebrow">Saldo do mês</div>
              <div className={"bal num "+(displayTotals.saldo>=0?"pos":"neg")}>{brl(displayTotals.saldo)}</div>
              {(displayTotals.previstoInc!==0||displayTotals.previstoExp!==0||displayTotals.previstoInv!==0) &&
                <div className="num" style={{fontSize:12,color:"var(--text-mut)",marginTop:-12,marginBottom:4}}>
                  previsto: {brl(displayTotals.previstoSaldo)}
                </div>}
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
              <span className={"heropct "+(displayTotals.saldo>=prevTotals.saldo?"up":"down")}>
                <Icon name={displayTotals.saldo>=prevTotals.saldo?"seta-direita":"seta-esquerda"} size={11} style={{transform:displayTotals.saldo>=prevTotals.saldo?"rotate(-90deg)":"rotate(90deg)"}}/>
                {Math.abs(pctChange).toFixed(0)}% vs. mês anterior
              </span>
              <Sparkline data={sparkline}/>
            </div>
          </div>
          <div className="stats">
            <div className="stat"><div className="k"><Icon name="baixar" size={12}/>Entradas</div><div className="v" style={{color:"var(--pos)"}}>{brl(displayTotals.inc)}</div></div>
            <div className="stat"><div className="k"><Icon name="enviar" size={12}/>Saídas</div><div className="v" style={{color:"var(--neg)"}}>{brl(displayTotals.exp)}</div></div>
            <div className="stat"><div className="k"><Icon name="investimentos" size={12}/>Investido</div><div className="v" style={{color:"var(--inv)"}}>{brl(displayTotals.inv)}</div></div>
          </div>
        </div>

        <TransactionForm accounts={accounts} txs={txs} update={update} editTx={inlineEditTx} propagateIds={inlinePropagateIds} onDone={()=>{setInlineEditTx(null);setInlinePropagateIds([]);}} categoryMemory={categoryMemory} key={inlineEditTx?inlineEditTx.id:"new"}/>
      </div>

      {(displayTotals.inc>0||displayTotals.exp>0||displayTotals.inv>0) &&
        <div className="card g-6">
          <h3>Análise do mês <button className="sbtn" onClick={generateSummary} disabled={aiSummaryBusy}><Icon name="brilho" size={14}/>{aiSummaryBusy?"Analisando…":aiSummary?"Refazer":"Gerar com IA"}</button></h3>
          {aiSummaryBusy &&
            <div className="aithink">
              <div className="aiorb"><i/><i/><i/><span className="core"/></div>
              <div className="aibody">
                <div className="aititle"><span>Cruzando os números do mês<span className="aidots"/></span></div>
                <div className="aiphase">Comparando com o mês anterior, categorias, cartões, orçamentos e contas previstas.</div>
                <div className="aibar"><i style={{width:"100%",opacity:.25}}/><span/></div>
              </div>
            </div>}
          {aiSummary && <RichAI text={aiSummary}/>}
          {aiSummaryError && <p className="hint" style={{color:"var(--neg)"}}>{aiSummaryError}</p>}
          {!aiSummary && !aiSummaryBusy && !aiSummaryError && <p className="hint">Uma análise completa do mês: para onde o dinheiro foi, o que mudou em relação ao mês passado, o que merece atenção e três ações concretas — tudo calculado a partir dos seus lançamentos, cartões e orçamentos.</p>}
        </div>}

      {plannedTotal>0 &&
        <div className="card g-6">
          <h3>Planejado × Realizado <span className="num" style={{fontSize:14,fontWeight:500}}>{brl(displayTotals.exp)} / {brl(plannedTotal)}</span></h3>
          <ProgressBar spent={displayTotals.exp} limit={plannedTotal} status={displayTotals.exp>plannedTotal?"over":"ok"}/>
        </div>}

      {alerts.length>0 &&
        <div style={{marginBottom:0,gridColumn:"1/-1"}}>
          {alerts.map(a=>(
            <div key={a.cat} className={"alert "+a.status}>
              <Icon name="alerta" size={16}/>
              <span>{a.status==="over"
                ? <>Você ultrapassou o orçamento de <b>{a.cat}</b> — {brl(a.spent)} de {brl(a.limit)}.</>
                : <>Já usou {Math.round(a.pct*100)}% do orçamento de <b>{a.cat}</b> ({brl(a.spent)} de {brl(a.limit)}).</>}</span>
            </div>
          ))}
        </div>}

      <div className="card g-12">
        <h3>Buscar e filtrar <HelpIcon section="busca-filtros"/></h3>
        <div className="searchbar">
          <div className="searchfield">
            <span className="searchicon"><Icon name="buscar" size={16}/></span>
            <input className="fld" placeholder="Buscar por descrição ou #tag…" value={search} onChange={e=>setSearch(e.target.value)}/>
            {search && <button className="clearbtn" aria-label="Limpar busca" onClick={()=>setSearch("")}><Icon name="fechar" size={14}/></button>}
          </div>
          <button className="sbtn" onClick={()=>setFilterSheetOpen(true)}><Icon name="filtro" size={14}/>Filtros{activeFilterCount>0?` (${activeFilterCount})`:""}</button>
        </div>
        {activeChips.length>0 &&
          <div className="chiprow">
            {activeChips.map(c=>(
              <div className="filterchip" key={c.key}>
                <span>{c.label}</span>
                <button aria-label="Remover filtro" onClick={c.onRemove}><Icon name="fechar" size={12}/></button>
              </div>
            ))}
            <button className="clearall" onClick={clearAllFilters}>Limpar tudo</button>
          </div>}
        {hasActiveFilters && searchSummary &&
          <div className="resultsum">{searchSummary.count} resultado{searchSummary.count!==1?"s":""} encontrado{searchSummary.count!==1?"s":""} · soma: <span className="num">{brl(searchSummary.sum)}</span></div>}
      </div>

      <Sheet open={filterSheetOpen} onClose={()=>setFilterSheetOpen(false)} title="Filtros">
        <div className="sub" style={{marginBottom:8}}>Conta</div>
        <div className="chips" style={{marginBottom:18}}>
          {accounts.map(a=>(
            <button key={a.id} type="button" className={"chip"+(filters.accounts.includes(a.id)?" on":"")} onClick={()=>toggleInArray("accounts",a.id)}>
              <span className="swatch" style={{background:a.color}}/>{a.name}
            </button>
          ))}
        </div>
        <div className="sub" style={{marginBottom:8}}>Tipo</div>
        <div className="chips" style={{marginBottom:18}}>
          {Object.entries(TYPES).map(([k,v])=>(
            <button key={k} type="button" className={"chip"+(filters.types.includes(k)?" on":"")} onClick={()=>toggleInArray("types",k)}>{v.label}</button>
          ))}
        </div>
        <div className="sub" style={{marginBottom:8}}>Categoria</div>
        <div className="chips" style={{marginBottom:18,maxHeight:180,overflowY:"auto"}}>
          {allCategories.map(c=>(
            <button key={c} type="button" className={"chip"+(filters.categories.includes(c)?" on":"")} onClick={()=>toggleInArray("categories",c)}>{c}</button>
          ))}
        </div>
        {allTags.length>0 &&
          <React.Fragment>
            <div className="sub" style={{marginBottom:8}}>Tags</div>
            <div className="chips" style={{marginBottom:18,maxHeight:140,overflowY:"auto"}}>
              {allTags.map(tg=>(
                <button key={tg} type="button" className={"chip"+(filters.tags.includes(tg)?" on":"")} onClick={()=>toggleInArray("tags",tg)}>#{tg}</button>
              ))}
            </div>
          </React.Fragment>}
        <div className="sub" style={{marginBottom:8}}>Status</div>
        <div className="chips" style={{marginBottom:18}}>
          <button type="button" className={"chip"+(filters.status===""?" on":"")} onClick={()=>setFilters(f=>({...f,status:""}))}>Todos</button>
          <button type="button" className={"chip"+(filters.status==="realizado"?" on":"")} onClick={()=>setFilters(f=>({...f,status:"realizado"}))}>Realizado</button>
          <button type="button" className={"chip"+(filters.status==="previsto"?" on":"")} onClick={()=>setFilters(f=>({...f,status:"previsto"}))}>Previsto</button>
        </div>
        <div className="sub" style={{marginBottom:8}}>Intervalo de datas</div>
        <div style={{display:"flex",gap:10,marginBottom:18}}>
          <input className="fld" type="date" value={filters.dateFrom} onChange={e=>setFilters(f=>({...f,dateFrom:e.target.value}))}/>
          <input className="fld" type="date" value={filters.dateTo} onChange={e=>setFilters(f=>({...f,dateTo:e.target.value}))}/>
        </div>
        <div className="sub" style={{marginBottom:8}}>Faixa de valor (R$)</div>
        <div style={{display:"flex",gap:10,marginBottom:20}}>
          <input className="fld" type="number" min="0" step="0.01" placeholder="Mínimo" value={filters.valueMin} onChange={e=>setFilters(f=>({...f,valueMin:e.target.value}))}/>
          <input className="fld" type="number" min="0" step="0.01" placeholder="Máximo" value={filters.valueMax} onChange={e=>setFilters(f=>({...f,valueMax:e.target.value}))}/>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button className="sbtn" style={{flex:1,justifyContent:"center"}} onClick={()=>setFilters({accounts:[],types:[],categories:[],tags:[],dateFrom:"",dateTo:"",status:"",valueMin:"",valueMax:""})}>Limpar filtros</button>
          <button className="sbtn primary" style={{flex:1,justifyContent:"center"}} onClick={()=>setFilterSheetOpen(false)}>Concluído</button>
        </div>
      </Sheet>

      {hasActiveFilters
        ? (Object.keys(displayGrouped).length===0 &&
            <EmptyState icon="filtro" title="Nenhum resultado" text="Nenhum lançamento corresponde à busca ou aos filtros aplicados." action={{label:"Ver no manual",onClick:()=>openHelp("busca-filtros")}}/>)
        : (Object.keys(grouped).length===0 &&
            <EmptyState icon="documento" title={`Nenhum lançamento em ${monthLabel}`}
              text={isDesktop

                onEdit={()=>requestEdit(t)} onDelete={()=>requestDelete(t)} onMarkPaid={()=>markAsPaid(t)} onTagClick={(tg)=>toggleInArray("tags",tg)}/>);})}

      {hasEvo &&
        <div className="card g-6">

          <div className="sub" style={{marginBottom:0}}>Clique em um mês para navegar até ele.</div>

          <BarGroups data={evo} onSelect={onSelectMonth?(i)=>onSelectMonth(evo[i].date):undefined} activeIndex={activeEvoIdx}/>

      {(totals.inc>0||totals.exp>0||totals.inv>0) &&
        <div className="card g-6">
          <h3>Entradas × Saídas × Investido</h3>

          <BarGroups data={[
            {name:"Entradas",bars:[{v:totals.inc/100,color:"var(--pos)"}]},
            {name:"Saídas",bars:[{v:totals.exp/100,color:"var(--neg)"}]},
            {name:"Investido",bars:[{v:totals.inv/100,color:"var(--inv)"}]},
          ]} onSelect={toggleType} activeIndex={typeActiveIdx}/>
        </div>}

      {byCatChart.length>0 &&
        <div className="card g-12">
          <h3>Gastos por categoria</h3>
          <div className="sub" style={{marginBottom:0}}>Clique numa categoria para filtrar os lançamentos do mês.</div>
          <div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap"}}>
            <Donut data={byCatChart} onSelect={toggleCat} selected={catSelected} centerLabel="gastos"/>
            <div style={{flex:1,minWidth:180}}><Legend data={byCatChart} onSelect={toggleCat} selected={catSelected}/></div>
          </div>
          {tagBreakdown.length>0 &&
            <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid var(--surface-2)"}}>
              <div className="sub" style={{marginBottom:6}}>#tags dentro de {filters.categories[0]} em {monthLabel}</div>
              {tagBreakdown.map(tg=>(
                <div className="kv" key={tg.tag}><span className="kk">#{tg.tag}</span><span className="vv">{brl(tg.cents)}</span></div>
              ))}
            </div>}

      {totals.inc>0 &&
        <div className="card g-12">
          <h3>Fluxo do mês</h3>
          <MonthFlow totals={totals} byCatChart={byCatChart} monthLabel={monthLabel}/>
        </div>}
    </React.Fragment>
  );
}

function Sparkline({ data, w=100, h=40 }){
  const gradId="sparkgrad-"+useId(); // id único por instância — duas sparklines na mesma tela não podem colidir
  if(!data || data.length<2) return null;
  const min=Math.min(...data,0), max=Math.max(...data,0);
  const range=(max-min)||1;
  const pts=data.map((v,i)=>[ (i/(data.length-1))*w, h-((v-min)/range)*h ]);
  const line=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+` L${w},${h} L0,${h} Z`;
  const up = data[data.length-1]>=data[0];
  const color = up?"var(--pos)":"var(--neg)";
  return (
    <svg width={w} height={h} className="herospark" viewBox={`0 0 ${w} ${h}`}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gradId})`} stroke="none"/>
      <path d={line} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
