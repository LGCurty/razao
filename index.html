/* ---- indicadores do Banco Central (Selic, CDI, IPCA) via API pública do SGS, com cache diário em
   localStorage (dado de mercado, não é dado do usuário — não precisa ir pro backup/Supabase). Uma falha de
   rede aqui não deve incomodar ninguém: o card some silenciosamente em vez de mostrar erro. ---- */
const BCB_CACHE_KEY="razao_bcb_cache";
async function fetchBcbSeries(code, n){
  const res=await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${code}/dados/ultimos/${n}?formato=json`);
  if(!res.ok) throw new Error("BCB indisponível");
  return res.json();
}
async function fetchBcbIndicators(){
  const today=todayISO();
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem(BCB_CACHE_KEY)||"null"); }catch(_){}
  if(cached && cached.date===today) return cached.data;
  const [selic,cdi,ipca]=await Promise.all([fetchBcbSeries(432,1),fetchBcbSeries(12,1),fetchBcbSeries(433,12)]);
  const num=(v)=>parseFloat(String(v).replace(",","."));
  const data={
    selic: selic[0] ? num(selic[0].valor) : null,
    cdi: cdi[0] ? num(cdi[0].valor) : null,
    ipca12m: ipca.length ? ipca.reduce((s,x)=>s+num(x.valor),0) : null,
  };
  localStorage.setItem(BCB_CACHE_KEY, JSON.stringify({date:today,data}));
  return data;
}
function BcbIndicators(){
  const [state,setState]=useState({status:"loading"});
  useEffect(()=>{
    let alive=true;
    fetchBcbIndicators().then(data=>{ if(alive) setState({status:"ok",data}); }).catch(err=>{ if(alive) setState({status:"err",error:err.message}); });
    return ()=>{ alive=false; };
  },[]);
  if(state.status==="err") return null;
  return (
    <div className="card g-6">
      <h3>Indicadores econômicos</h3>
      <div className="sub" style={{marginBottom:state.status==="loading"?0:14}}>Fonte: Banco Central (SGS) · cache diário.</div>
      {state.status==="loading" && <p className="hint">Carregando…</p>}
      {state.status==="ok" && <React.Fragment>
        {state.data.selic!=null && <div className="kv"><span className="kk">Selic (meta)</span><span className="vv">{state.data.selic.toFixed(2).replace(".",",")}% a.a.</span></div>}
        {state.data.cdi!=null && <div className="kv"><span className="kk">CDI (diário)</span><span className="vv">{state.data.cdi.toFixed(4).replace(".",",")}%</span></div>}
        {state.data.ipca12m!=null && <div className="kv"><span className="kk">IPCA (12 meses)</span><span className="vv">{state.data.ipca12m.toFixed(2).replace(".",",")}%</span></div>}
      </React.Fragment>}
    </div>
  );
}

/* ---------- PANORAMA GERAL (consolidado de todos os meses e todas as contas) ---------- */
function Geral({ txs, accounts, holdings, view, onSelectMonth, monthIndex, update, patrimonyHistory, recaps, aiModel }){
  const EMPTY_BUCKET={entradas:0,saidas:0,investido:0,proventos:0,porCategoria:{},itens:[]};
  const monthBucket=(mk)=>monthIndex[mk]||EMPTY_BUCKET;
  // totais de todos os tempos: soma os baldes do índice em vez de re-varrer txs inteiro
  const totals=useMemo(()=>{
    let inc=0,exp=0,inv=0;
    Object.values(monthIndex).forEach(b=>{ inc+=b.entradas; exp+=b.saidas; inv+=b.investido; });
    return { inc, exp, inv, saldo: inc-exp-inv };
  },[monthIndex]);

  // saldo por conta: transferências são lançamento em par (debita a origem, credita o destino) em vez de usar o sinal fixo do tipo.
  // só o realizado conta (previsto ainda não aconteceu); soma o saldo inicial da conta por cima.
  // (dimensão por conta, não por mês — continua varrendo txs uma única vez, já é O(n) direto)
  const byAccount=useMemo(()=>{
    const m={};
    txs.filter(isRealized).forEach(t=>{
      if(t.type==="transferencia"){
        m[t.acctId]=(m[t.acctId]||0)-t.cents;
        m[t.toAcctId]=(m[t.toAcctId]||0)+t.cents;
      } else {
        m[t.acctId]=(m[t.acctId]||0)+t.cents*TYPES[t.type].sign;
      }
    });
    return accounts.map(a=>({ ...a, balance:(m[a.id]||0)+(a.openingBalance||0) }));
  },[txs,accounts]);

  // limite de cartão comprometido: gastos cuja fatura (fechamento/vencimento) cai no mês atual real,
  // menos transferências recebidas por aquele cartão no mesmo período (pagamento da fatura)
  const todayMk=useMemo(()=>{ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`; },[]);
  const cardCommitted=(acctId)=>cardInvoiceNet(monthBucket(todayMk).itens, acctId);

  const fi=useMemo(()=>financialIndependence(monthIndex,view),[monthIndex,view]);

  const totCur=holdings.reduce((s,h)=>s+h.current,0);
  const contasBalance=byAccount.filter(a=>a.kind==="conta").reduce((s,a)=>s+a.balance,0);
  const patrimonio=contasBalance+totCur;

  // snapshot mensal automático do patrimônio: atualiza o valor do mês corrente sempre que ele mudar (assim o mês
  // fica sempre em dia enquanto está em curso) e nunca mexe nos meses já fechados — isso é o "histórico".
  // Só grava quando o valor realmente muda, pra não gerar um save a cada render.
  const todayMkForSnapshot=useMemo(()=>todayISO().slice(0,7),[]);
  useEffect(()=>{
    if(accounts.length===0 && holdings.length===0) return;
    if((patrimonyHistory||{})[todayMkForSnapshot]===patrimonio) return;
    update(d=>({ patrimonyHistory:{ ...(d.patrimonyHistory||{}), [todayMkForSnapshot]:patrimonio } }));
  },[patrimonio,todayMkForSnapshot,patrimonyHistory,accounts.length,holdings.length]);
  const patrimonyEvo=useMemo(()=>{
    return Object.entries(patrimonyHistory||{}).sort(([a],[b])=>a<b?-1:1).slice(-12).map(([mk,cents])=>{
      const d=new Date(mk+"-01T00:00:00");
      return { name:shortMonthLabel(d), bars:[{v:cents/100,color:cents>=0?"var(--pos)":"var(--neg)"}] };
    });
  },[patrimonyHistory]);

  // contas a pagar / lembretes: lançamentos previstos (ainda não realizados) que vencem nos próximos 7 dias
  // ou já venceram — reaproveita o mesmo campo status:"previsto" já usado no resto do app, sem duplicar dado
  const lembretes=useMemo(()=>{
    const today=todayISO();
    const limitDate=new Date(); limitDate.setDate(limitDate.getDate()+7);
    const limitIso=new Date(limitDate.getTime()-limitDate.getTimezoneOffset()*60000).toISOString().slice(0,10);
    return txs.filter(t=>!isRealized(t) && t.type!=="transferencia" && t.date<=limitIso)
      .sort((a,b)=>a.date<b.date?-1:1);
  },[txs]);
  function marcarLembretePago(t){
    update(d=>({transactions:d.transactions.map(x=>x.id===t.id?{...x,status:"realizado"}:x)}));
    toast("Marcado como pago.","success");
  }

  // recap automático semanal/mensal por IA: ao abrir o Panorama, se a última semana e o último mês já
  // fechados ainda não têm recap gerado (e tiveram movimentação), gera um automaticamente e guarda —
  // não repete depois disso, e uma falha aqui é silenciosa (é um bônus, não deve incomodar ninguém)
  const autoRecapTried=useRef(false);
  useEffect(()=>{
    if(autoRecapTried.current) return;
    autoRecapTried.current=true;
    (async()=>{
      const today=todayISO();
      const lastWeekKey=weekStartISO(new Date(new Date(today+"T00:00:00").getTime()-7*86400000).toISOString().slice(0,10));
      const lastWeekEnd=new Date(new Date(lastWeekKey+"T00:00:00").getTime()+6*86400000).toISOString().slice(0,10);
      if(!(recaps?.weekly||{})[lastWeekKey]){
        const weekTxs=txs.filter(t=>isRealized(t)&&t.date>=lastWeekKey&&t.date<=lastWeekEnd);
        if(weekTxs.length>0){
          const inc=weekTxs.filter(t=>t.type==="ganho").reduce((s,t)=>s+t.cents,0);
          const exp=weekTxs.filter(t=>t.type==="gasto").reduce((s,t)=>s+t.cents,0);
          const inv=weekTxs.filter(t=>t.type==="investimento").reduce((s,t)=>s+t.cents,0);
          try{
            const porCat={}; weekTxs.filter(t=>t.type==="gasto").forEach(t=>{ porCat[t.category]=(porCat[t.category]||0)+t.cents; });
            const briefing={
              periodo:{ de:lastWeekKey, ate:lastWeekEnd },
              totais:{ entradas:toReal(inc), saidas:toReal(exp), investido:toReal(inv), saldo:toReal(inc-exp-inv), lancamentos:weekTxs.length },
              gastoPorCategoria: Object.entries(porCat).sort((a,b)=>b[1]-a[1]).map(([nome,c])=>({nome,valor:toReal(c)})),
              maioresGastos: weekTxs.filter(t=>t.type==="gasto").sort((a,b)=>b.cents-a.cents).slice(0,5)
                .map(t=>({data:t.date,descricao:(t.description||"").trim()||t.category,categoria:t.category,valor:toReal(t.cents)})),
              semanaAnterior: (()=>{
                const ini=new Date(new Date(lastWeekKey+"T00:00:00").getTime()-7*86400000).toISOString().slice(0,10);
                const fim=new Date(new Date(lastWeekKey+"T00:00:00").getTime()-86400000).toISOString().slice(0,10);
                const ant=txs.filter(t=>isRealized(t)&&t.date>=ini&&t.date<=fim);
                return { de:ini, ate:fim, entradas:toReal(ant.filter(t=>t.type==="ganho").reduce((s,t)=>s+t.cents,0)), saidas:toReal(ant.filter(t=>t.type==="gasto").reduce((s,t)=>s+t.cents,0)) };
              })(),
            };
            const prompt=`Dossiê da semana financeira encerrada, em JSON (valores em reais):\n\n${JSON.stringify(briefing)}\n\nEscreva um recap da semana em português do Brasil, na segunda pessoa, tom direto e sem jargão. Use SÓ os números do JSON, sem inventar nada. Estrutura: um primeiro parágrafo de 2 a 3 períodos com o veredito da semana (sobrou ou faltou e por quê, comparando com a semana anterior), seguido de 2 a 3 linhas começando com "- " apontando o que puxou o gasto e o que merece atenção na semana que começa. Cite valores no formato R$ 1.234,56.`;
            const text=(await callGemini({prompt})).trim();
            update(d=>({recaps:{...(d.recaps||{weekly:{},monthly:{}}), weekly:{...(d.recaps?.weekly||{}), [lastWeekKey]:{text,generatedAt:new Date().toISOString(),from:lastWeekKey,to:lastWeekEnd}}}}));
          }catch(_){ /* recap é um bônus automático — sem IA disponível, simplesmente não gera dessa vez */ }
        }
      }
      // referência: mês anterior ao mês corrente do calendário (sempre já fechado)
      const curMonthDate=new Date();
      const prevMk=new Date(curMonthDate.getFullYear(),curMonthDate.getMonth()-1,1);
      const prevMonthKey=`${prevMk.getFullYear()}-${String(prevMk.getMonth()+1).padStart(2,"0")}`;
      if(!(recaps?.monthly||{})[prevMonthKey]){
        const b=monthBucket(prevMonthKey);
        if(b.entradas>0||b.saidas>0||b.investido>0){
          try{
            const briefing=buildMonthlyBriefing({ txs, accounts, monthDate:prevMk, monthIndex });
            const prompt=`Você é o analista financeiro pessoal de quem usa este app. O mês ${prevMonthKey} acabou de fechar. Dossiê completo em JSON (valores em reais):\n\n${JSON.stringify(briefing)}\n\n${AI_SUMMARY_STYLE}`;
            const text=(await callGemini({prompt})).trim();
            update(d=>({recaps:{...(d.recaps||{weekly:{},monthly:{}}), monthly:{...(d.recaps?.monthly||{}), [prevMonthKey]:{text,generatedAt:new Date().toISOString()}}}}));
          }catch(_){ /* idem: sem IA disponível agora, tenta de novo na próxima vez que o Panorama abrir */ }
        }
      }
    })();
  },[]);
  const latestWeeklyRecap=useMemo(()=>{
    const keys=Object.keys(recaps?.weekly||{}).sort();
    return keys.length?{key:keys[keys.length-1],...recaps.weekly[keys[keys.length-1]]}:null;
  },[recaps]);
  const latestMonthlyRecap=useMemo(()=>{
    const keys=Object.keys(recaps?.monthly||{}).sort();
    return keys.length?{key:keys[keys.length-1],...recaps.monthly[keys[keys.length-1]]}:null;
  },[recaps]);

  const byCatAll=useMemo(()=>{
    const m={};
    Object.values(monthIndex).forEach(b=>{
      Object.entries(b.porCategoria).forEach(([cat,cents])=>{ m[cat]=(m[cat]||0)+cents; });
    });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value,color:CAT_COLOR[name]||"var(--text-mut)"}));
  },[monthIndex]);

  // gasto por tag (tags de primeira classe): soma, em todo o histórico realizado, quanto foi gasto em
  // lançamentos marcados com cada #tag na descrição — igual ao "por categoria", só que por tag
  const byTagAll=useMemo(()=>{
    const m={};
    txs.filter(t=>isRealized(t)&&t.type==="gasto").forEach(t=>{
      extractTags(t.description).forEach(tg=>{ m[tg]=(m[tg]||0)+t.cents; });
    });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value],i)=>({name:"#"+name,value,color:QUALITATIVE[i%QUALITATIVE.length]}));
  },[txs]);

  const EVO_CAP=24;
  const evoAll=useMemo(()=>{
    const months=Object.keys(monthIndex).sort();
    if(months.length===0) return { arr:[], truncated:false, total:0 };
    const [fy,fm]=months[0].split("-").map(Number);
    const [ly,lm]=months[months.length-1].split("-").map(Number);
    const total=(ly-fy)*12+(lm-fm)+1;
    const show=Math.min(total,EVO_CAP);
    const start=total-show;
    const arr=[];
    for(let i=start;i<total;i++){
      const d=new Date(fy,fm-1+i,1);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const b=monthBucket(mk);
      arr.push({ name:shortMonthLabel(d), bars:[{v:b.entradas/100,color:"var(--pos)"},{v:b.saidas/100,color:"var(--neg)"}], date:d });
    }
    return { arr, truncated: total>EVO_CAP, total };
  },[monthIndex]);
  const activeEvoIdx=view?evoAll.arr.findIndex(e=>e.date.getFullYear()===view.getFullYear()&&e.date.getMonth()===view.getMonth()):-1;

  const [patternsResult,setPatternsResult]=useState("");
  const [patternsBusy,setPatternsBusy]=useState(false);
  const [patternsError,setPatternsError]=useState("");
  async function analyzePatterns(){
    setPatternsBusy(true); setPatternsError(""); setPatternsResult("");

${JSON.stringify(candidates)}

Escreva uma análise em português do Brasil, na segunda pessoa, tom direto e sem jargão, usando SÓ estes números. Formato (use exatamente estes títulos, com "## " na frente, e "- " nos itens):

function Orcamento({ budgetRows, budgets, budgetExceptions, update, plannedTotal, totalSpent, monthLabel, txs, view, accounts }){
  const [openCat,setOpenCat]=useState(null);
  const [val,setVal]=useState(0);
  const [scope,setScope]=useState("default"); // "default" (todos os meses) | "month" (exceção deste mês)
  const allCats=CATS.gasto.map(c=>c[0]);
  const vKey=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,"0")}`;

  const setBudgetDefault=(c,cents)=>{update(d=>{const b={...d.budgets};if(cents>0)b[c]=cents;else delete b[c];return {budgets:b};});};
  const setBudgetException=(c,cents)=>{
    update(d=>{
      const monthMap={...(d.budgetExceptions[vKey]||{})};
      if(cents>0) monthMap[c]=cents; else delete monthMap[c];
      const next={...d.budgetExceptions};
      if(Object.keys(monthMap).length) next[vKey]=monthMap; else delete next[vKey];
      return {budgetExceptions:next};
    });
  };
  const activeCat=openCat||allCats[0];
  const saveBudget=()=>{ if(scope==="month") setBudgetException(activeCat,val); else setBudgetDefault(activeCat,val); toast("Limite salvo.","success"); };
  const removeBudget=()=>{ if(scope==="month") setBudgetException(activeCat,0); else setBudgetDefault(activeCat,0); setVal(0); };
  const pickCategory=(c)=>{
    setOpenCat(c);
    const hasExc=budgetExceptions[vKey]?.[c]!=null;
    setScope(hasExc?"month":"default");
    setVal(hasExc?budgetExceptions[vKey][c]:(budgets[c]||0));
  };
  const pickScope=(s)=>{
    setScope(s);
    setVal(s==="month"?(budgetExceptions[vKey]?.[activeCat]||0):(budgets[activeCat]||0));
  };

  // mesma base do restante do orçamento: gasto conta no mês da fatura do cartão, não no mês da compra
  const prevSpentByCat=useMemo(()=>{
    const d=new Date(view.getFullYear(),view.getMonth()-1,1);
    const pk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const m={};
    txs.filter(t=>t.type==="gasto"&&txEffectiveMonth(t,accounts)===pk).forEach(t=>{m[t.category]=(m[t.category]||0)+t.cents;});
    return m;
  },[txs,view,accounts]);

  // comprometimento das próximas rendas: quanto do que já está lançado (realizado + previsto) pro mês
  // consome a renda esperada dele — olha os 3 próximos meses (o atual e os dois seguintes)
  const commitment=useMemo(()=>{
    const now=new Date();
    return [0,1,2].map(i=>{
      const d=new Date(now.getFullYear(),now.getMonth()+i,1);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      let ganho=0,gasto=0;
      txs.forEach(t=>{
        if(t.type==="transferencia") return;
        const flowMk = t.type==="gasto" ? txEffectiveMonth(t,accounts) : monthKey(t.date);
        if(flowMk!==mk) return;
        if(t.type==="ganho") ganho+=t.cents; else if(t.type==="gasto") gasto+=t.cents;
      });
      const pct = ganho>0 ? gasto/ganho*100 : (gasto>0?100:0);
      return { mk, label:capFirst(d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})), ganho, gasto, pct, status: ganho===0?"none":pct>=100?"over":pct>=80?"warn":"ok" };
    });
  },[txs,accounts]);

  // simulador "e se" — totalmente local, sem IA: usa a média mensal real dos últimos 6 meses como base
  // e aplica a mudança hipotética na hora, sem gravar nada
  const [simCat,setSimCat]=useState("");
  const [simPct,setSimPct]=useState(0);
  const [simExtraType,setSimExtraType]=useState("gasto");
  const [simExtraValue,setSimExtraValue]=useState(0);
  const avgMonthly=useMemo(()=>{
    const m={};
    txs.filter(isRealized).forEach(t=>{
      if(t.type==="transferencia") return;
      const mk = t.type==="gasto" ? txEffectiveMonth(t,accounts) : monthKey(t.date);
      m[mk]=m[mk]||{ganho:0,gasto:0,inv:0};
      if(t.type==="ganho") m[mk].ganho+=t.cents;
      else if(t.type==="gasto") m[mk].gasto+=t.cents;
      else if(t.type==="investimento") m[mk].inv+=t.cents;
    });
    const keys=Object.keys(m).sort().slice(-6);
    if(keys.length===0) return {ganho:0,gasto:0,inv:0,months:0};
    const sum=keys.reduce((s,k)=>({ganho:s.ganho+m[k].ganho,gasto:s.gasto+m[k].gasto,inv:s.inv+m[k].inv}),{ganho:0,gasto:0,inv:0});
    return { ganho:Math.round(sum.ganho/keys.length), gasto:Math.round(sum.gasto/keys.length), inv:Math.round(sum.inv/keys.length), months:keys.length };
  },[txs,accounts]);
  const avgByCat=useMemo(()=>{
    const m={};
    txs.filter(t=>isRealized(t)&&t.type==="gasto").forEach(t=>{
      const mk=txEffectiveMonth(t,accounts);
      (m[t.category]=m[t.category]||{})[mk]=(m[t.category][mk]||0)+t.cents;
    });
    const out={};
    Object.entries(m).forEach(([cat,byMonth])=>{
      const keys=Object.keys(byMonth).sort().slice(-6);
      out[cat]=Math.round(keys.reduce((s,k)=>s+byMonth[k],0)/Math.max(1,keys.length));
    });
    return out;
  },[txs,accounts]);
  const simResult=useMemo(()=>{
    const catAvg=simCat?(avgByCat[simCat]||0):0;
    const reduction=Math.round(catAvg*(simPct/100));
    const novoGasto=Math.max(0,avgMonthly.gasto-reduction+(simExtraType==="gasto"?simExtraValue:0));
    const novoGanho=avgMonthly.ganho+(simExtraType==="ganho"?simExtraValue:0);
    const saldoAtual=avgMonthly.ganho-avgMonthly.gasto-avgMonthly.inv;
    const novoSaldo=novoGanho-novoGasto-avgMonthly.inv;
    return { reduction, saldoAtual, novoSaldo, delta:novoSaldo-saldoAtual };
  },[avgMonthly,avgByCat,simCat,simPct,simExtraType,simExtraValue]);

  return (
    <React.Fragment>
      <div className="card g-6">
        <h3>Orçamento de {monthLabel} <span className="num" style={{fontSize:14,fontWeight:500,color:totalSpent>plannedTotal&&plannedTotal>0?"var(--neg)":"var(--text)"}}>{brl(totalSpent)} / {brl(plannedTotal)}</span> <HelpIcon section="orcamento-ajuda"/></h3>
        <div className="sub">Defina quanto quer gastar em cada categoria. O histórico ajuda a ser realista. Gastos no cartão contam no mês da fatura, não no mês da compra.</div>
        {budgetRows.length===0 && <p className="hint">Nenhuma categoria com orçamento ou gasto ainda. Use o cartão "Definir orçamento" para escolher uma categoria e um limite — o histórico de quanto você costuma gastar aparece aqui assim que houver lançamentos.</p>}
        {budgetRows.map(r=>{
          const rollover=r.limit>0?r.limit-(prevSpentByCat[r.cat]||0):0;
          return(
          <div className="budrow" key={r.cat}>
            <div className="bh">
              <span className="bname"><Icon name={CAT_ICON[r.cat]||"outros"} size={15}/> {r.cat}
                {r.status==="over" && <span className="tag over">estourou</span>}
                {r.status==="warn" && <span className="tag warn">atenção</span>}
                {r.status==="ok" && <span className="tag ok">no limite</span>}
              </span>
              <span className="bval">{brl(r.spent)}{r.limit>0 && <span style={{color:"var(--text-mut)"}}> / {brl(r.limit)}</span>}</span>
            </div>
            <ProgressBar spent={r.spent} limit={r.limit} status={r.status}/>
            <div className="mm">
              {r.hist?<>Histórico: mín {brl(r.hist.min)} · média {brl(r.hist.avg)} · máx {brl(r.hist.max)}</>:"Sem histórico ainda"}
              {" · "}
              <button style={{border:"none",background:"none",color:"var(--inv)",cursor:"pointer",fontSize:11,textDecoration:"underline",padding:0}} onClick={()=>pickCategory(r.cat)}>{r.limit>0?"editar limite":"definir limite"}</button>
            </div>
            {r.isException &&
              <div className="mm" style={{color:"var(--inv)"}}>
                Limite específico de {monthLabel}
                {" · "}
                <button style={{border:"none",background:"none",color:"var(--inv)",cursor:"pointer",fontSize:11,textDecoration:"underline",padding:0}} onClick={()=>setBudgetException(r.cat,0)}>remover exceção</button>
              </div>}
            {rollover>0 && <div className="mm" style={{color:"var(--pos)"}}>Sobrou {brl(rollover)} do mês passado nesta categoria — dá para remanejar para este mês ou para investimentos.</div>}
          </div>
        );})}
      </div>
      <div className="card g-6">
        <h3>Definir orçamento</h3>
        <div className="sub">Escolha a categoria, o valor e se vale só para {monthLabel} ou todos os meses (planejamento sazonal).</div>
        <select className="fld" value={activeCat} onChange={e=>pickCategory(e.target.value)} style={{marginBottom:10}}>
          {allCats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <div className="seg" style={{marginBottom:12}}>
          <button className={scope==="default"?"on in":""} onClick={()=>pickScope("default")}>Todos os meses</button>
          <button className={scope==="month"?"on inv":""} onClick={()=>pickScope("month")}>Neste mês ({monthLabel})</button>
        </div>
        <Money cents={val} onChange={setVal} small onEnter={saveBudget}/>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button className="sbtn primary" onClick={saveBudget}>Salvar limite</button>
          {val>0 && <button className="sbtn" onClick={removeBudget}>Remover</button>}
        </div>
      </div>

      <div className="card g-12">
        <h3>Comprometimento das próximas rendas</h3>
        <div className="sub" style={{marginBottom:0}}>Quanto do que já está lançado (realizado + previsto) consome a renda esperada em cada mês.</div>
        {commitment.map(c=>(
          <div key={c.mk} style={{marginTop:14}}>
            <div className="bh">
              <span className="bname">{c.label}
                {c.status==="over" && <span className="tag over">comprometido</span>}
                {c.status==="warn" && <span className="tag warn">atenção</span>}
                {c.status==="ok" && <span className="tag ok">tranquilo</span>}
              </span>

function Metas({ goals, update, txs }){
  const [form,setForm]=useState(null);
  const [contribId,setContribId]=useState(null);
  const [contrib,setContrib]=useState(0);
  const blank={name:"",target:0,saved:0,deadline:"",linkedCategory:null};
  // categorias que fazem sentido ligar a uma meta (poupança/investimento) — gasto fica de fora
  const linkedCategoryOptions=useMemo(()=>[...CATS.investimento,...CATS.ganho].map(c=>c[0]).filter((v,i,a)=>a.indexOf(v)===i),[]);
  // meta ligada a uma categoria real: o progresso soma automaticamente todo lançamento realizado daquela
  // categoria, além do valor guardado manualmente — não precisa "avisar" a meta toda vez que investe
  const goalAutoSaved=(g)=>{
    if(!g.linkedCategory) return 0;
    return txs.filter(t=>isRealized(t)&&t.category===g.linkedCategory&&t.type!=="gasto").reduce((s,t)=>s+t.cents,0);
  };
  const save=()=>{if(!form.name.trim()||form.target<=0)return;update(d=>({goals: form.id?d.goals.map(x=>x.id===form.id?form:x):[...d.goals,{...form,id:uid()}]}));setForm(null);toast("Meta salva.","success");};
  const remove=(g)=>askConfirm({title:"Excluir meta?",message:`"${g.name}" será removida.`,onConfirm:()=>{update(d=>({goals:d.goals.filter(x=>x.id!==g.id)}));toast("Meta excluída.","success");}});
  const addContrib=(g)=>{update(d=>({goals:d.goals.map(x=>x.id===g.id?{...x,saved:x.saved+contrib}:x)}));setContribId(null);setContrib(0);toast("Valor guardado.","success");};
  const monthsLeft=(dl)=>{if(!dl)return null;const d=new Date(dl),n=new Date();return Math.max(0,(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth());};
  return (
    <div className="card">
      <h3>Metas e planos <span style={{display:"flex",alignItems:"center",gap:6}}><button className="sbtn" onClick={()=>setForm(blank)}><Icon name="adicionar" size={14}/> Nova</button><HelpIcon section="metas-ajuda"/></span></h3>
      <div className="sub">Pague seus sonhos primeiro: defina valor, prazo e acompanhe o progresso.</div>
      {form &&
        <div className="miniform">

          <div style={{margin:"10px 0"}}><div className="sub" style={{marginBottom:4}}>Valor total</div><Money cents={form.target} onChange={v=>setForm({...form,target:v})} small/></div>
          <div style={{margin:"10px 0"}}><div className="sub" style={{marginBottom:4}}>Já guardado (manual)</div><Money cents={form.saved} onChange={v=>setForm({...form,saved:v})} small/></div>
          <div className="sub" style={{marginBottom:4}}>Prazo</div>
          <input className="fld" type="date" value={form.deadline} onChange={e=>setForm({...form,deadline:e.target.value})} style={{marginBottom:10}}/>
          <div className="sub" style={{marginBottom:4}}>Ligar a uma categoria (opcional)</div>
          <select className="fld" value={form.linkedCategory||""} onChange={e=>setForm({...form,linkedCategory:e.target.value||null})}>
            <option value="">Nenhuma — só o valor guardado manualmente</option>
            {linkedCategoryOptions.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <div className="hint">Ligando a uma categoria, todo lançamento real dessa categoria soma automaticamente no progresso da meta.</div>
          <div style={{display:"flex",gap:8,marginTop:12}}><button className="sbtn primary" onClick={save}>Salvar meta</button><button className="sbtn" onClick={()=>setForm(null)}>Cancelar</button></div>
        </div>}
      {goals.length===0 && !form && <p className="hint">Nenhuma meta ainda. Crie sua primeira, como uma reserva de emergência.</p>}
      {goals.map(g=>{
        const autoSaved=goalAutoSaved(g);
        const totalSaved=g.saved+autoSaved;
        const pct=g.target>0?Math.min(100,totalSaved/g.target*100):0;
        const ml=monthsLeft(g.deadline);
        const need=ml&&ml>0?Math.max(0,Math.ceil((g.target-totalSaved)/ml)):null;
        return (
          <div className="goal" key={g.id}>
            <div className="gh">
              <div>
                <div className="gname"><Icon name="metas" size={16}/> {g.name}</div>

              </div>

                <button className="sbtn iconsbtn" aria-label="Editar" onClick={()=>setForm(g)}><Icon name="editar" size={15}/></button>

              : <div className="gacts"><button className="sbtn" onClick={()=>{setContribId(g.id);setContrib(0);}}><Icon name="adicionar" size={13}/> Guardar dinheiro</button></div>}
          </div>);
      })}
    </div>
  );
}

// parcelado (não "fixo"/recorrente) sempre carrega o sufixo "(i/n)" no fim da descrição, gerado no submit()
// do formulário — é o único jeito de diferenciar os dois sem guardar um campo novo no lançamento
function isInstallmentSeries(t){
  return t.seriesTotal>1 && new RegExp(`\\(${t.seriesIndex+1}\\/${t.seriesTotal}\\)$`).test(t.description||"");
}
const monthsFromToday=(dateIso)=>{ const d=new Date(dateIso+"T00:00:00"),n=new Date(); return Math.max(0,(d.getFullYear()-n.getFullYear())*12+(d.getMonth()-n.getMonth())); };
/* custo real do parcelamento vs. CDI: parcelamento "sem juros" no Brasil não cobra nada a mais no nominal,
   mas segurar o dinheiro por mais tempo (em vez de pagar à vista) tem valor — se investido ao CDI nesse
   meio tempo, esse valor futuro vale menos em termos de hoje. A diferença entre o nominal das parcelas que
   faltam e o valor presente (descontado ao CDI) é a economia real de ter parcelado em vez de pago à vista. */
function Parcelamentos({ txs }){
  const [cdiAnnual,setCdiAnnual]=useState(null);
  useEffect(()=>{
    fetchBcbIndicators().then(d=>{
      // CDI vem como taxa diária (código 12 do SGS) — anualiza por 252 dias úteis, convenção padrão no Brasil.
      // Sem CDI disponível, usa a Selic meta (já anual) como aproximação (historicamente muito próximas).
      if(d.cdi!=null) setCdiAnnual((Math.pow(1+d.cdi/100,252)-1)*100);
      else if(d.selic!=null) setCdiAnnual(d.selic);
    }).catch(()=>{});
  },[]);
  const series=useMemo(()=>{
    const groups={};
    txs.forEach(t=>{ if(isInstallmentSeries(t)) (groups[t.seriesId]=groups[t.seriesId]||[]).push(t); });
    return Object.values(groups).map(items=>{
      const sorted=[...items].sort((a,b)=>a.seriesIndex-b.seriesIndex);
      const remaining=sorted.filter(t=>!isRealized(t));
      if(remaining.length===0) return null;
      return { seriesId:sorted[0].seriesId, baseDesc:(sorted[0].description||"").replace(/\s*\(\d+\/\d+\)$/,"")||sorted[0].category, total:sorted.length, paidCount:sorted.length-remaining.length, remaining };
    }).filter(Boolean);
  },[txs]);
  if(series.length===0) return null;
  const monthlyRate = cdiAnnual!=null ? Math.pow(1+cdiAnnual/100,1/12)-1 : null;
  return (
    <div className="card g-12">
      <h3>Parcelamentos ativos</h3>
      <div className="sub" style={{marginBottom:0}}>{monthlyRate!=null?"Economia real de ter parcelado em vez de pago à vista, descontando as parcelas futuras pela CDI/Selic vigente.":"Parcelas que ainda faltam pagar."}</div>
      {series.map(s=>{
        const nominal=s.remaining.reduce((sum,t)=>sum+t.cents,0);
        const presentValue = monthlyRate!=null ? s.remaining.reduce((sum,t)=>sum+t.cents/Math.pow(1+monthlyRate,monthsFromToday(t.date)+1),0) : null;
        const economia = presentValue!=null ? Math.round(nominal-presentValue) : null;
        return (
          <div className="kv" key={s.seriesId} style={{alignItems:"flex-start"}}>
            <span className="kk">{s.baseDesc} <span style={{color:"var(--text-mut)"}}>· {s.paidCount}/{s.total} pagas</span></span>
            <span className="vv" style={{textAlign:"right"}}>
              {brl(nominal)} restantes
              {economia!=null && <div className="mm" style={{marginTop:2}}>economia real ≈ {brl(economia)}</div>}
            </span>
          </div>);
      })}
    </div>
  );
}
Parcelamentos = React.memo(Parcelamentos);

function Contas({ accounts, update, monthTx, txs }){
  const [form,setForm]=useState(null);
  const [deleteFlow,setDeleteFlow]=useState(null); // {account, linkedCount}
  const [reassignTo,setReassignTo]=useState("");
  // auditoria de fatura: cola o texto da fatura do banco/cartão e compara com o que já está registrado
  // no app pra aquele cartão naquele mês — "bateu" / "na fatura mas não registrado" / "registrado mas não na fatura"
  const [auditAccount,setAuditAccount]=useState(null);
  const [auditMonth,setAuditMonth]=useState(todayISO().slice(0,7));
  const [auditText,setAuditText]=useState("");
  const [auditResult,setAuditResult]=useState(null);
  function openAudit(a){ setAuditAccount(a); setAuditMonth(todayISO().slice(0,7)); setAuditText(""); setAuditResult(null); }
  function runAudit(){
    const parsed=parseExtratoText(auditText).filter(it=>it.type==="gasto");
    const registered=txs.filter(t=>t.type==="gasto"&&t.acctId===auditAccount.id&&txEffectiveMonth(t,accounts)===auditMonth);
    const usedRegIds=new Set(), usedParsedIds=new Set();
    parsed.forEach(p=>{
      const match=registered.find(t=>!usedRegIds.has(t.id)&&t.date===p.date&&t.cents===p.cents);
      if(match){ usedRegIds.add(match.id); usedParsedIds.add(p.id); }
    });
    setAuditResult({

const EXTRATO_LINE_RE=/(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;
function parseExtratoText(text){
  const year=new Date().getFullYear();
  const out=[];
  text.split(/\n+/).forEach(raw=>{
    const line=raw.trim();
    if(!line)return;
    const m=line.match(EXTRATO_LINE_RE);
    if(!m)return;
    const [,dpart,desc,vpart]=m;
    const [dd,mm,yy]=dpart.split("/");
    const yr=yy?(yy.length===2?"20"+yy:yy):String(year);
    const iso=`${yr}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
    const neg=vpart.trim().startsWith("-");
    const num=parseFloat(vpart.replace(/-/g,"").replace(/\./g,"").replace(",","."));
    if(isNaN(num))return;
    const cents=Math.round(num*100);
    const type=neg?"gasto":"ganho";
    out.push({ id:uid(), date:iso, desc:desc.trim(), cents, type, category:CATS[type][0][0], acctId:"" });
  });
  return out;
}
/* ---------- IMPORTAR DO BANCO (importação em lote de extratos e faturas) ----------
   A ideia é chegar o mais perto possível de um "open finance manual": a pessoa joga TODOS os PDFs do mês
   (extratos das contas + faturas dos cartões) de uma vez, e o app cuida do resto — descobre de qual banco
   é cada documento, se é extrato ou fatura, casa com a conta cadastrada e classifica cada linha, separando
   gasto, entrada, investimento, pagamento de fatura e transferência entre bancos. Nada é salvo sem revisão. */

const DOC_PHASES = {
  fila:       { label:"Na fila",                  weight:0    },

  ia:         { label:"IA lendo o documento",     weight:0.15 },

};
const DOC_TIPO_LABEL = { extrato:"Extrato", fatura:"Fatura", nota_corretagem:"Nota de corretagem", recibo:"Recibo", outro:"Documento" };
const MAX_DOC_BYTES = 3 * 1024 * 1024;
// só recusamos o que a IA claramente não consegue ler. Qualquer outra coisa (inclusive arquivo sem
// extensão e sem type, como vem de alguns pickers de nuvem) é aceita e tentada.
const NAO_LEGIVEL = /^(video|audio)\//i;
const NAO_LEGIVEL_EXT = /\.(zip|rar|7z|tar|gz|exe|dmg|apk|mp4|mov|avi|mkv|mp3|wav|m4a|docx?|xlsx?|pptx?|csv|txt)$/i;
const fmtBytes = (b)=>{ if(!b) return ""; if(b<1024) return b+" B"; if(b<1024*1024) return (b/1024).toFixed(0)+" KB"; return (b/1024/1024).toFixed(1)+" MB"; };
// tipo real do arquivo: alguns pickers entregam type vazio — sem isso a IA receberia mime errado
const guessMime = (file)=>{
  if(file.type) return file.type;
  const n=(file.name||"").toLowerCase();
  if(/\.pdf$/.test(n)) return "application/pdf";
  if(/\.(jpg|jpeg)$/.test(n)) return "image/jpeg";
  if(/\.png$/.test(n)) return "image/png";
  if(/\.(heic|heif)$/.test(n)) return "image/heic";
  if(/\.webp$/.test(n)) return "image/webp";
  return "application/pdf"; // sem pista nenhuma, PDF é o palpite mais provável neste app
};
const VALOR_COR = { gasto:"var(--neg)", ganho:"var(--pos)", investimento:"var(--inv)", transferencia:"var(--trf)" };

/* ativos lidos de uma nota de corretagem: além de virarem lançamentos de investimento (o dinheiro que
   saiu da conta), eles podem entrar na carteira em Investimentos. Aqui a pessoa escolhe quais quer levar
   para lá — ativo que já existe na carteira tem o aporte somado em vez de duplicar a linha. */
function AtivosDaNota({ doc, update, onDone }){
  const [sel,setSel]=useState(()=>new Set((doc.meta.ativos||[]).filter(a=>a.selected).map(a=>a.id)));
  const ativos=doc.meta.ativos||[];
  const escolhidos=ativos.filter(a=>sel.has(a.id));
  const toggle=(id)=>setSel(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  function adicionar(){
    if(!escolhidos.length) return;
    update(d=>{
      const holdings=[...(d.holdings||[])];
      escolhidos.forEach(a=>{
        // casa por ticker quando houver, senão pelo nome — evita criar "BTLG11" duas vezes
        const chave=(a.ticker||a.nome).toLowerCase();
        const i=holdings.findIndex(h=>(h.name||"").toLowerCase().includes(chave));
        if(i>=0) holdings[i]={ ...holdings[i], invested:holdings[i].invested+a.cents, current:holdings[i].current+a.cents };
        else holdings.push({ id:uid(), name:a.nome, cls:a.cls, invested:a.cents, current:a.cents });
      });
      return { holdings };
    });
    toast(`${escolhidos.length} ativo${escolhidos.length===1?"":"s"} na carteira.`,"success");
    onDone && onDone();
  }
  return (
    <div className="ativosnota">
      <div className="ativoshead">
        <b>{ativos.length} ativo{ativos.length===1?"":"s"} nesta nota</b>
        <span>Some na sua carteira em Investimentos, além de entrar como aporte no extrato.</span>
      </div>
      {ativos.map(a=>(
        <label className="ativorow" key={a.id}>
          <input type="checkbox" checked={sel.has(a.id)} onChange={()=>toggle(a.id)}/>
          <span className="an">{a.nome}{a.operacao==="venda" && <span className="tag warn" style={{marginLeft:6}}>venda</span>}</span>
          <span className="aq">{a.quantidade>0?`${a.quantidade} × ${brl(Math.round(a.cents/a.quantidade))}`:""}</span>
          <span className="acls">{a.cls}</span>
          <span className="av num">{brl(a.cents)}</span>
        </label>
      ))}
      <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
        <button className="sbtn primary" disabled={!escolhidos.length} onClick={adicionar}>
          <Icon name="investimentos" size={14}/> Adicionar {escolhidos.length} à carteira
        </button>
        <button className="sbtn" onClick={onDone}>Agora não</button>
      </div>
    </div>
  );
}

function Extrato({ accounts, update, txs, aiModel }){
  const [docs,setDocs]=useState([]);      // um por arquivo enviado, com status e progresso próprios

  // sem nunca alcançá-la, para não prometer conclusão antes da resposta chegar. Os saltos de verdade
  // (arquivo aberto, resposta recebida, documento pronto) são os que movem o número para valer.
  useEffect(()=>{
    if(!running) return;
    const t=setInterval(()=>{
      setDocs(ds=>ds.map(d=>d.status==="ia"?{...d,progress:Math.min(0.88,d.progress+(0.9-d.progress)*0.05)}:d));
    },400);
    return ()=>clearInterval(t);
  },[running]);

  const overall=useMemo(()=>{
    if(docs.length===0) return 0;
    return docs.reduce((s,d)=>s+Math.min(1,d.progress),0)/docs.length;
  },[docs]);
  const doneCount=docs.filter(d=>d.status==="pronto"||d.status==="erro").length;
  const errosCount=docs.filter(d=>d.status==="erro").length;
  const lidosCount=docs.filter(d=>d.status==="pronto").length;
  const tudoFalhou=docs.length>0 && errosCount===docs.length;
  const currentDoc=docs.find(d=>d.status!=="pronto"&&d.status!=="erro"&&d.status!=="fila");

  async function processOne(doc){
    patchDoc(doc.id,{status:"lendo",progress:DOC_PHASES.lendo.weight});
    let aiError="";
    try{
      const base64=await fileToBase64(doc.file);
      patchDoc(doc.id,{status:"ia",progress:DOC_PHASES.ia.weight});
      const res=await analyzeDocumentWithAI({
        base64, mimeType:guessMime(doc.file), fileName:doc.name, accounts, model:aiModelId(aiModel),
      });
      patchDoc(doc.id,{status:"conferindo",progress:DOC_PHASES.conferindo.weight});
      const { meta, rows }=mapAiDocument(res,accounts,doc.id);
      if(rows.length===0) throw new Error("A IA não encontrou nenhum lançamento neste arquivo.");
      setItems(prev=>[...prev,...rows]);
      patchDoc(doc.id,{status:"pronto",progress:1,meta,count:rows.length,file:null});
      return;
    }catch(err){
      aiError=err.message||"Falha ao analisar com IA.";
    }
    // rede de segurança: sem IA disponível, ainda dá para extrair o texto do PDF localmente e usar o
    // parser por regex (só reconhece gasto/ganho, sem identificar banco nem transferência)
    if(/pdf/i.test(doc.file?.type||"")||/\.pdf$/i.test(doc.name)){
      try{
        patchDoc(doc.id,{status:"conferindo",progress:DOC_PHASES.conferindo.weight});
        await loadPdfJs();
        const buf=await doc.file.arrayBuffer();
        const pdf=await window.pdfjsLib.getDocument({ data:buf }).promise;
        const extracted=await extractPdfText(pdf);
        const rows=localRowsFromText(extracted,doc.id,accounts);
        if(rows.length===0) throw new Error("Nenhuma linha reconhecida (o PDF pode ser uma imagem escaneada).");
        setItems(prev=>[...prev,...rows]);
        patchDoc(doc.id,{
          status:"pronto", progress:1, count:rows.length, file:null,
          aviso:`IA indisponível (${aiError}) — lido localmente, sem identificar banco nem transferências.`,
          meta:{ tipo:"outro", banco:"", contaId:accounts[0]?.id||"", contaAuto:false, periodoInicio:"", periodoFim:"", vencimento:"", totalDocumento:0, confianca:null, observacao:"", fonte:"local" },
        });
        return;
      }catch(localErr){
        patchDoc(doc.id,{status:"erro",progress:1,error:`${aiError} ${localErr.message||""}`.trim(),file:null});
        return;
      }
    }
    patchDoc(doc.id,{status:"erro",progress:1,error:aiError,file:null});
  }

  async function addFiles(fileList){
    const all=Array.from(fileList||[]);
    if(all.length===0) return;
    // ser tolerante aqui importa: picker de nuvem (Drive, iCloud, WhatsApp) entrega arquivo com type
    // vazio e às vezes sem extensão. Antes isso era recusado em silêncio e a pessoa ficava sem saber
    // por que "não aconteceu nada". Agora só recusamos o que claramente não dá pra ler, e o resto vai.
    const recusados=all.filter(f=>NAO_LEGIVEL.test(f.type)||NAO_LEGIVEL_EXT.test(f.name));
    const accepted=all.filter(f=>!recusados.includes(f));
    if(recusados.length) toast(`${recusados.length===1?"1 arquivo não pode ser lido":`${recusados.length} arquivos não podem ser lidos`}: ${recusados.map(f=>f.name).join(", ")}. Envie PDF, foto ou print.`,"error",{duration:7000});
    if(accepted.length===0) return;
    // o arquivo trafega em base64 (≈ +33%) dentro de um JSON; acima disso a função serverless recusa o corpo
    const grandes=accepted.filter(f=>f.size>MAX_DOC_BYTES);
    if(grandes.length) toast(`${grandes.length} arquivo(s) acima de 3 MB podem falhar na IA — separe em partes menores se der erro.`,"error");
    const novos=accepted.map(f=>({ id:uid(), name:f.name, size:f.size, file:f, status:"fila", progress:0, error:"", aviso:"", meta:null, count:0 }));
    setDocs(ds=>[...ds,...novos]);
    queueRef.current.push(...novos);
    // confirmação imediata de recebimento, antes de qualquer leitura: a pessoa precisa ver que o
    // arquivo chegou no mesmo instante em que escolheu, não só quando a IA terminar
    toast(`${accepted.length} arquivo${accepted.length===1?"":"s"} recebido${accepted.length===1?"":"s"}. Lendo…`,"success");
    setTimeout(()=>{ statusRef.current?.scrollIntoView({behavior:"smooth",block:"nearest"}); },60);
    if(runningRef.current) return; // já tem uma leva rodando: ela vai consumir estes também
    runningRef.current=true; setRunning(true);
    try{
      // um de cada vez: evita estourar a cota gratuita da IA e mantém o progresso legível
      while(queueRef.current.length) await processOne(queueRef.current.shift());
    }finally{
      runningRef.current=false; setRunning(false);
    }
  }

  function onDrop(e){
    e.preventDefault(); setDragOver(false);
    if(e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  }
  function analisarTexto(){
    const rows=localRowsFromText(text,"manual",accounts);
    if(rows.length===0){ toast("Nenhuma linha reconhecida no texto colado.","error"); return; }
    const manualDoc={ id:"manual", name:"Texto colado", size:0, file:null, status:"pronto", progress:1, error:"", aviso:"", count:rows.length,
      meta:{ tipo:"outro", banco:"", contaId:accounts[0]?.id||"", contaAuto:false, periodoInicio:"", periodoFim:"", vencimento:"", totalDocumento:0, confianca:null, observacao:"", fonte:"local" } };
    setDocs(ds=>ds.some(d=>d.id==="manual") ? ds.map(d=>d.id==="manual"?manualDoc:d) : [...ds,manualDoc]);
    setItems(prev=>[...prev.filter(it=>it.docId!=="manual"),...rows]);
  }

  function updateItem(id,patch){ setItems(its=>its.map(it=>it.id===id?{...it,...patch}:it)); }
  function removeItem(id){ setItems(its=>its.filter(it=>it.id!==id)); }
  function removeDoc(id){ setItems(its=>its.filter(it=>it.docId!==id)); setDocs(ds=>ds.filter(d=>d.id!==id)); }
  function limparTudo(){ setItems([]); setDocs([]); setText(""); }

  // trocar a conta do documento reetiqueta todos os lançamentos dele de uma vez — inclusive o outro lado
  // das transferências, quando era o documento que ocupava aquela ponta
  function setDocAccount(docId,newAcct){
    const doc=docs.find(d=>d.id===docId);
    const old=doc?.meta?.contaId||"";
    patchDoc(docId,{meta:{...doc.meta,contaId:newAcct,contaAuto:false}});
    setItems(its=>its.map(it=>it.docId!==docId?it:({
      ...it,
      acctId: (it.acctId===old || (!it.acctId && it.type!=="transferencia")) ? newAcct : it.acctId,
      toAcctId: it.toAcctId===old ? newAcct : it.toAcctId,
    })));
  }

  // duplicata contra o histórico já salvo: mesma data, valor, tipo e descrição
  const dupHistorico=useMemo(()=>{
    const set=new Set();
    items.forEach(it=>{
      const dup=txs.some(t=>t.date===it.date&&t.cents===it.cents&&t.type===it.type&&normDesc(t.description)===normDesc(it.desc));
      if(dup) set.add(it.id);
    });
    return set;
  },[items,txs]);
  // duplicata ENTRE documentos: o caso clássico é o pagamento da fatura, que aparece tanto no extrato da
  // conta quanto na própria fatura do cartão. Mesmo valor, mesmo tipo, datas próximas, documentos diferentes.
  const dupEntreDocs=useMemo(()=>{
    const set=new Set(); const vistos=[];
    items.forEach(it=>{
      const tol=it.type==="transferencia"?3:0;
      const hit=vistos.find(v=>v.docId!==it.docId&&v.cents===it.cents&&v.type===it.type&&daysApart(v.date,it.date)<=tol
        &&(it.type==="transferencia"||normDesc(v.desc)===normDesc(it.desc)));
      if(hit) set.add(it.id); else vistos.push(it);
    });
    return set;
  },[items]);
  const isDup=(id)=>dupHistorico.has(id)||dupEntreDocs.has(id);
  // assim que um item é marcado como duplicata, ele sai da seleção sozinho (mas continua visível e aprovável)
  const dupApplied=useRef(new Set());
  useEffect(()=>{
    const novos=items.filter(it=>isDup(it.id)&&!dupApplied.current.has(it.id)).map(it=>it.id);
    if(novos.length===0) return;
    novos.forEach(id=>dupApplied.current.add(id));
    setItems(its=>its.map(it=>novos.includes(it.id)?{...it,selected:false}:it));
  },[dupHistorico,dupEntreDocs]);

  const itemOk=(it)=>it.acctId&&(it.type!=="transferencia"||(it.toAcctId&&it.toAcctId!==it.acctId));
  // no celular a lista viria com 8 campos por lançamento — uma fatura de 30 linhas viraria um rolo sem fim.
  // Cada item aparece resumido em duas linhas e só abre os campos quando a pessoa toca em "ajustar".
  // O que precisa de decisão (falta conta, falta destino da transferência) já nasce aberto.
  const isDesktop=useIsDesktop();
  const [expanded,setExpanded]=useState(()=>new Set());
  const toggleExpand=(id)=>setExpanded(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const nomeConta=(id)=>accounts.find(a=>a.id===id)?.name||"conta não escolhida";
  const prontos=items.filter(it=>it.selected&&itemOk(it));
  const pendentes=items.filter(it=>it.selected&&!itemOk(it));

  const resumo=useMemo(()=>{
    const s={gasto:0,ganho:0,investimento:0,transferencia:0,nTrf:0};
    items.filter(it=>it.selected).forEach(it=>{ s[it.type]+=it.cents; if(it.type==="transferencia") s.nTrf++; });
    return s;
  },[items]);

  function toTx(it){
    const base={ id:uid(), type:it.type, cents:it.cents, category:it.type==="transferencia"?"":it.category,
      description:it.desc, date:it.date, acctId:it.acctId, status: it.date>todayISO()?"previsto":"realizado" };
    if(it.type==="transferencia") base.toAcctId=it.toAcctId;
    return base;
  }
  function aprovar(lista){
    if(lista.length===0) return;
    const entries=lista.map(toTx);
    // alimenta a memória de categorização com o que foi confirmado aqui: da próxima vez que essa mesma
    // descrição aparecer (na mão ou noutro extrato), a categoria já vem sugerida sem custar chamada de IA
    const memoria={};
    lista.forEach(it=>{ if(it.type!=="transferencia" && it.desc.trim()) memoria[it.desc.trim().toLowerCase()]=it.category; });
    // aprende a impressão digital: o número de conta/cartão do documento fica guardado na conta que a
    // pessoa confirmou, e no mês que vem o mesmo banco casa sozinho, sem depender do apelido bater
    const aprendidos={};
    new Set(lista.map(it=>it.docId)).forEach(docId=>{
      const doc=docs.find(d=>d.id===docId);
      const conta=doc?.meta?.contaId, keys=doc?.meta?.fingerprints||[];
      if(!conta || !keys.length) return;
      aprendidos[conta]=[...(aprendidos[conta]||[]),...keys];
    });
    update(d=>({
      transactions:[...entries,...d.transactions],
      categoryMemory:{...(d.categoryMemory||{}),...memoria},
      accounts: Object.keys(aprendidos).length
        ? d.accounts.map(a=>aprendidos[a.id] ? { ...a, matchKeys:[...new Set([...(a.matchKeys||[]),...aprendidos[a.id]])] } : a)
        : d.accounts,
    }));
    const ids=new Set(lista.map(it=>it.id));
    setItems(its=>its.filter(it=>!ids.has(it.id)));
    toast(`${entries.length} lançamento${entries.length===1?"":"s"} importado${entries.length===1?"":"s"}.`,"success");
  }

  /* ---- ações em massa ----
     Sem isso, um extrato em que a IA não reconheceu a conta obriga a pessoa a abrir item por item e
     escolher a mesma conta dezenas de vezes. Aqui aplica de uma vez em tudo que está marcado,
     atravessando documentos diferentes. */
  const marcados=items.filter(it=>it.selected);
  function aplicarEmMassa(patch){
    const ids=new Set(marcados.map(it=>it.id));
    if(!ids.size) return;
    setItems(its=>its.map(it=>ids.has(it.id)?{...it,...patch(it)}:it));
  }
  function massaConta(acctId){
    if(!acctId) return;
    // em transferência, "a conta do lançamento" é a origem; o destino continua como está
    aplicarEmMassa(()=>({ acctId }));
    toast(`Conta aplicada a ${marcados.length} lançamento${marcados.length===1?"":"s"}.`,"success");
  }
  function massaCategoria(cat){
    if(!cat) return;
    const alvo=marcados.filter(it=>it.type!=="transferencia" && CATS[it.type].some(c=>c[0]===cat));
    if(!alvo.length){ toast("Nenhum item marcado aceita essa categoria.","error"); return; }
    const ids=new Set(alvo.map(it=>it.id));
    setItems(its=>its.map(it=>ids.has(it.id)?{...it,category:cat}:it));
    toast(`Categoria aplicada a ${alvo.length} lançamento${alvo.length===1?"":"s"}.`,"success");
  }

  const docsComItens=docs.filter(d=>items.some(it=>it.docId===d.id));
  // a IA casa o documento com a conta pelo NOME do banco. Enquanto as contas tiverem os nomes
  // genéricos que vêm de fábrica, esse casamento não tem como acontecer e a pessoa acaba
  // escolhendo a conta na mão em todo documento — vale avisar antes de ela perder tempo.
  const contasGenericas=accounts.filter(a=>/^(conta|cartão|cartao|conta principal|cartão de crédito|cartao de credito|carteira|banco)$/i.test((a.name||"").trim()));

  return (
    <React.Fragment>
    <div className="card">
      <h3>Importar do banco <HelpIcon section="extrato-ajuda"/></h3>
      <div className="sub">Jogue aqui tudo do mês de uma vez — extratos, faturas de cartão, notas de corretagem, recibos. Vale PDF, foto ou print de tela do app do banco. A IA descobre de qual banco é cada documento e separa gasto, entrada, investimento, pagamento de fatura e transferência entre os seus bancos. Nada entra no app antes de você revisar.</div>

      {contasGenericas.length>0 &&
        <div className="banner" style={{marginBottom:14,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <span style={{flex:1,minWidth:200}}>
            Antes de importar, vale renomear {contasGenericas.length===1?"a conta":"as contas"} {contasGenericas.map(a=>`"${a.name}"`).join(", ")} com o nome do banco de verdade
            (Nubank, Itaú, Inter, C6…). É por esse nome que a IA descobre sozinha a qual conta cada PDF pertence — com nome genérico, você teria que escolher em cada documento.
          </span>
          <button className="sbtn" onClick={()=>goToTab("contas")}><Icon name="banco" size={14}/> Renomear agora</button>
        </div>}

      {/* o painel de status ocupa o lugar do dropzone assim que os arquivos chegam: o retorno aparece
          exatamente onde a pessoa acabou de clicar, em vez de num cartão mais abaixo da página */}
      <div ref={statusRef}>
        {docs.length===0
          ? <div className={"dropzone"+(dragOver?" over":"")}
              onClick={()=>fileRef.current?.click()}
              onDragOver={e=>{e.preventDefault();setDragOver(true);}}
              onDragLeave={()=>setDragOver(false)}
              onDrop={onDrop}
              role="button" tabIndex={0}
              onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fileRef.current?.click();}}}>
              <Icon name="documento" size={26} style={{opacity:.5}}/>
              <div className="dzt">Arraste os arquivos aqui ou clique para escolher</div>
              <div className="dzs">Pode mandar vários de uma vez: extrato do banco A, do banco B, fatura do cartão C, nota de corretagem…<br/>PDF, foto ou print de tela (JPG/PNG).</div>
            </div>
          : <React.Fragment>
              <div className="uploadpanel">
                <div className="uphead">
                  {running
                    ? <React.Fragment>
                        <div className="aiorb small"><i/><i/><i/><span className="core"/></div>
                        <div className="upheadtxt">
                          <b>Lendo {docs.length} documento{docs.length===1?"":"s"}</b>
                          <span>{doneCount} de {docs.length} concluído{doneCount===1?"":"s"}{currentDoc?` · ${DOC_PHASES[currentDoc.status].label}`:""}</span>
                        </div>
                        <span className="aipct">{Math.round(overall*100)}%</span>
                      </React.Fragment>
                    : tudoFalhou
                      ? <React.Fragment>
                          <span className="upcheck erro"><Icon name="alerta" size={16}/></span>
                          <div className="upheadtxt">
                            <b>Não foi possível ler {docs.length===1?"o documento":`os ${docs.length} documentos`}</b>
                            <span>O motivo aparece abaixo de cada arquivo. Você ainda pode lançar na mão ou tentar de novo.</span>
                          </div>
                        </React.Fragment>
                      : <React.Fragment>
                          <span className="upcheck"><Icon name="check" size={16}/></span>
                          <div className="upheadtxt">
                            <b>{lidosCount} de {docs.length} documento{docs.length===1?"":"s"} lido{lidosCount===1?"":"s"}</b>
                            <span>{items.length>0 ? `${items.length} lançamento${items.length===1?"":"s"} para revisar abaixo` : "Nenhum lançamento reconhecido"}{errosCount>0?` · ${errosCount} falhou`:""}</span>
                          </div>
                          <span className="aipct" style={{color:errosCount>0?"var(--warn)":"var(--pos)"}}>{Math.round((lidosCount/docs.length)*100)}%</span>
                        </React.Fragment>}
                </div>
                {running && <div className="aibar" style={{marginTop:10}}><i style={{width:`${Math.max(2,overall*100)}%`}}/><span/></div>}

                <div className="uplist">
                  {docs.map(d=>{
                    const lendo=["lendo","ia","conferindo"].includes(d.status);
                    return (
                      <div className={"uprow"+(d.status==="erro"?" erro":"")} key={d.id}>
                        <Icon name={d.meta?.tipo==="fatura"?"cartao":d.meta?.tipo==="nota_corretagem"?"investimentos":d.meta?.tipo==="recibo"?"camera":"documento"} size={15}
                          style={{color:d.status==="erro"?"var(--neg)":d.status==="pronto"?"var(--pos)":"var(--text-mut)",flex:"0 0 auto"}}/>
                        <div className="upinfo">
                          <div className="upname">{d.name} {d.size>0 && <span className="upsize">{fmtBytes(d.size)}</span>}</div>
                          {lendo && <div className="uprowbar"><i style={{width:`${Math.max(4,d.progress*100)}%`}}/></div>}
                        </div>
                        {d.status==="pronto" && <span className="dstat" style={{color:"var(--pos)"}}><Icon name="check" size={12}/> {d.count} lançamento{d.count===1?"":"s"}</span>}
                        {d.status==="erro" && <span className="dstat" style={{color:"var(--neg)"}}><Icon name="alerta" size={12}/> falhou</span>}
                        {d.status==="fila" && <span className="dstat">na fila</span>}
                        {lendo && <span className="dstat"><i className="dspin"/> {DOC_PHASES[d.status].label} · {Math.round(d.progress*100)}%</span>}
                        <button className="sbtn iconsbtn" aria-label={"Remover "+d.name} disabled={running} onClick={()=>removeDoc(d.id)}><Icon name="fechar" size={13}/></button>
                      </div>
                    );
                  })}
                </div>
                {docs.filter(d=>d.status==="erro").map(d=>(
                  <p className="hint" key={d.id} style={{color:"var(--neg)",marginTop:6}}>{d.name}: {d.error}</p>
                ))}
                {docs.filter(d=>d.aviso).map(d=>(
                  <p className="hint" key={d.id} style={{color:"var(--warn)",marginTop:6}}>{d.name}: {d.aviso}</p>
                ))}
              </div>
              <div className={"dropzone compact"+(dragOver?" over":"")}
                onClick={()=>fileRef.current?.click()}
                onDragOver={e=>{e.preventDefault();setDragOver(true);}}
                onDragLeave={()=>setDragOver(false)}
                onDrop={onDrop}
                role="button" tabIndex={0}
                onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fileRef.current?.click();}}}>
                <Icon name="adicionar" size={15}/> Adicionar mais arquivos
              </div>
            </React.Fragment>}
      </div>
      <input ref={fileRef} type="file" accept="application/pdf,image/*" multiple style={{display:"none"}}
        onChange={e=>{addFiles(e.target.files); e.target.value="";}}/>
      <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{display:"none"}}
        onChange={e=>{addFiles(e.target.files); e.target.value="";}}/>
      <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
        <button className="sbtn" onClick={()=>cameraRef.current?.click()}><Icon name="camera" size={14}/> Tirar foto</button>
        <button className="sbtn" onClick={()=>setShowText(v=>!v)}><Icon name="editar" size={14}/> {showText?"Esconder":"Colar texto"}</button>
        {(docs.length>0||items.length>0) && <button className="sbtn danger" onClick={limparTudo} disabled={running}>Limpar tudo</button>}
      </div>

      {showText &&
        <div style={{marginTop:12}}>
          <textarea className="fld" rows={5}
            style={{resize:"vertical",fontFamily:"'IBM Plex Mono',monospace",fontSize:13,marginBottom:8}}
            placeholder={"01/07/2026 Compra Mercado XYZ -150,00\n05/07/2026 PIX recebido 500,00"}
            value={text} onChange={e=>setText(e.target.value)}/>
          <button className="sbtn primary" onClick={analisarTexto} disabled={!text.trim()}>Analisar texto colado</button>
          <p className="hint">Leitura local, sem IA: uma linha por lançamento, no formato "DD/MM/AAAA descrição valor". Valor negativo vira gasto, positivo vira ganho.</p>
        </div>}
    </div>



    {items.length>0 &&
      <div className="card" style={{marginTop:14}}>
        <h3>Revisar e importar <span className="aipct">{prontos.length} de {items.length}</span></h3>
        <div className="sub">Confira o que a IA entendeu. Desmarque o que não quiser, ajuste conta, tipo e categoria — e importe tudo de uma vez.</div>
        <div className="stats" style={{marginBottom:14}}>
          <div className="stat"><div className="k"><Icon name="enviar" size={12}/>Gastos</div><div className="v" style={{color:"var(--neg)"}}>{brl(resumo.gasto)}</div></div>
          <div className="stat"><div className="k"><Icon name="baixar" size={12}/>Entradas</div><div className="v" style={{color:"var(--pos)"}}>{brl(resumo.ganho)}</div></div>
          <div className="stat"><div className="k"><Icon name="investimentos" size={12}/>Investido</div><div className="v" style={{color:"var(--inv)"}}>{brl(resumo.investimento)}</div></div>
          <div className="stat"><div className="k"><Icon name="transferencia" size={12}/>Transferências</div><div className="v" style={{color:"var(--trf)"}}>{resumo.nTrf} · {brl(resumo.transferencia)}</div></div>
        </div>
        {(dupHistorico.size>0||dupEntreDocs.size>0) &&
          <p className="hint" style={{color:"var(--warn)",marginTop:0,marginBottom:10}}>
            {dupHistorico.size>0 && <>{dupHistorico.size} item(ns) já existem no seu histórico. </>}
            {dupEntreDocs.size>0 && <>{dupEntreDocs.size} item(ns) aparecem em dois documentos ao mesmo tempo (típico do pagamento da fatura, que sai no extrato e chega na fatura). </>}
            Já vieram desmarcados — marque de novo se forem lançamentos legítimos e diferentes.
          </p>}

const DEMO_ACCOUNTS = DEMO_DATA.accounts.map(a=>{

    } else if(t.acctId===a.id){

  });
  return { ...a, balance };
});

    try{ if(!localStorage.getItem("razao_tour_seen")){ setStep(0); setOpen(true); } }catch(_){}

  },[]);
  function finish(){ setOpen(false); try{ localStorage.setItem("razao_tour_seen","1"); }catch(_){} }
  const s=TOUR_STEPS[step];
  return (
    <Sheet open={open} onClose={finish} title="">
      <div className="tourstep">Passo {step+1} de {TOUR_STEPS.length}</div>
      <h4 style={{fontFamily:"'Sora',sans-serif",fontSize:17,marginBottom:8}}>{s.title}</h4>
      <p style={{fontSize:14,lineHeight:1.6,color:"var(--text-mut)"}}>{s.text}</p>
      <div className="tourdots">{TOUR_STEPS.map((_,i)=><i key={i} className={i===step?"on":""}/>)}</div>
      <div style={{display:"flex",gap:10}}>
        {step<TOUR_STEPS.length-1
          ? <React.Fragment>
              <button className="sbtn" style={{flex:1,justifyContent:"center"}} onClick={finish}>Pular</button>
              <button className="sbtn primary" style={{flex:1,justifyContent:"center"}} onClick={()=>setStep(x=>x+1)}>Próximo</button>
            </React.Fragment>
          : <button className="sbtn primary" style={{flex:1,justifyContent:"center"}} onClick={finish}>Concluir</button>}
      </div>
    </Sheet>
  );
}

<script>window.__RAZAO_APP_LOADED__ = false;</script>
<!-- app.compiled.js é o JSX já pré-compilado (gerado por "node build.js"). Se existir e rodar até o fim,
     ele mesmo marca __RAZAO_APP_LOADED__ = true e o bloco abaixo não faz nada. Se não existir (404) ou
     falhar no meio, o bloco abaixo cai para compilar em tempo de execução — carregando o Babel só agora,
     sob demanda, nunca no boot normal. Isso faz o app funcionar igual com ou sem o passo de build. -->
<script src="app.compiled.js" onerror="window.__RAZAO_COMPILED_MISSING__=true"></script>
<script>
  (function(){
    function showFatalError(detail){
      const root = document.getElementById('root');
      if(root) root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08090D;color:#EDEFF4;font-family:system-ui,sans-serif;text-align:center;padding:24px;">'
        + '<div><h2 style="margin-bottom:8px;">Não foi possível iniciar o Razão</h2>'
        + '<p style="color:#98A0B3;font-size:14px;max-width:360px;margin:0 auto 4px;">Verifique sua conexão e recarregue a página.</p>'
        + '<p style="color:#98A0B3;font-size:11px;opacity:.7;">' + (detail||'') + '</p></div></div>';
    }
    function runtimeCompileFallback(){
      const el = document.getElementById('app-jsx');
      if(!el) return;
      try{
        const code = el.textContent;
        const out = Babel.transform(code, { presets: ['react'], plugins: [['transform-react-jsx', { runtime: 'classic' }]] }).code;
        const s = document.createElement('script'); s.type='text/javascript'; s.text = out; document.body.appendChild(s);
      }catch(err){
        console.error('JSX compile error', err);
        showFatalError(String(err && err.message || err));
      }
    }
    if(window.__RAZAO_APP_LOADED__) return; // app.compiled.js já compilou e renderizou com sucesso
    const s = document.createElement('script');
    s.src = 'vendor/babel.min.js';
    s.onload = runtimeCompileFallback;
    s.onerror = function(){ showFatalError('Não foi possível carregar o compilador (vendor/babel.min.js).'); };
    document.head.appendChild(s);
  })();
</script>
<script>
  // service worker: cache-first pro shell estático, pra abrir mesmo sem internet (ver sw.js).
  // Se o registro falhar por qualquer motivo (file://, navegador sem suporte, etc.), o app
  // continua funcionando normalmente — isso é só uma melhoria de abertura offline, não requisito.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        if(!reg) return;
        // uma versão nova já baixada e esperando: avisa quem está com o site aberto em vez de
        // deixar a pessoa usando a versão antiga até fechar todas as abas
        function vigiar(sw){
          if(!sw) return;
          sw.addEventListener('statechange', function(){
            if(sw.state === 'installed' && navigator.serviceWorker.controller){
              window.__razaoNovaVersao && window.__razaoNovaVersao();
            }
          });
        }
        if(reg.waiting && navigator.serviceWorker.controller) window.__razaoNovaVersao && window.__razaoNovaVersao();
        reg.addEventListener('updatefound', function(){ vigiar(reg.installing); });
        // procura atualização ao voltar para a aba, não só no carregamento
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') reg.update().catch(function(){});
        });
      }).catch(function(){});
    });
  }
</script>
