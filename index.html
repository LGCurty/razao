     pdf.js NÃO é carregado aqui: só entra sob demanda, quando o Extrato Inteligente precisa ler um PDF
     (ver loadPdfJs() no JSX). O Babel também só é buscado se app.compiled.js não existir/falhar. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/supabase.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090D}

/* ===================== tokens ===================== */
.rz{
  --bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#F1F3F7;--hairline:#E4E7EE;
  --text:#0F1218;--text-mut:#5C6577;
  --accent:#E05A2B;--accent-deep:#B8431C;
  --pos:#12805F;--neg:#C2382F;--inv:#3B63C4;--warn:#B87C10;--trf:#2E93A3;
  --pos-bg:color-mix(in srgb, var(--pos) 10%, transparent);
  --neg-bg:color-mix(in srgb, var(--neg) 10%, transparent);
  --inv-bg:color-mix(in srgb, var(--inv) 10%, transparent);
  --warn-bg:color-mix(in srgb, var(--warn) 10%, transparent);
  --trf-bg:color-mix(in srgb, var(--trf) 10%, transparent);
  --accent-bg:color-mix(in srgb, var(--accent) 10%, transparent);
  --grad-accent:linear-gradient(120deg,var(--accent),var(--accent-deep));
  --r-field:10px;--r-card:16px;--r-sheet:20px;--r-pill:999px;
  --shadow-card:0 1px 2px rgba(15,18,24,.04),0 10px 24px -16px rgba(15,18,24,.14);
  font-family:'Inter',system-ui,sans-serif;color:var(--text);background:var(--bg);
  min-height:100vh;width:100%;-webkit-font-smoothing:antialiased;
}
.rz.dark{
  --bg:#08090D;--surface:#0F1117;--surface-2:#151821;--hairline:#1E222C;
  --text:#EDEFF4;--text-mut:#98A0B3;
  --accent:#F76B3C;--accent-deep:#C74E24;
  --pos:#2FB98A;--neg:#E2564D;--inv:#5A8DEE;--warn:#E8B23C;--trf:#46B7C7;
  --pos-bg:color-mix(in srgb, var(--pos) 8%, transparent);
  --neg-bg:color-mix(in srgb, var(--neg) 8%, transparent);
  --inv-bg:color-mix(in srgb, var(--inv) 8%, transparent);
  --warn-bg:color-mix(in srgb, var(--warn) 8%, transparent);
  --trf-bg:color-mix(in srgb, var(--trf) 8%, transparent);
  --accent-bg:color-mix(in srgb, var(--accent) 8%, transparent);
  --shadow-card:0 12px 32px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.04);
}
.rz.dark ::-webkit-scrollbar{width:10px;height:10px}
.rz.dark ::-webkit-scrollbar-track{background:transparent}
.rz.dark ::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:99px}
.rz.dark ::-webkit-scrollbar-thumb:hover{background:var(--text-mut)}

.rz .num,.rz .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.rz .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mut);font-weight:600}
.rz :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.rz button{font-family:inherit}

.rz .wrap{max-width:1400px;margin:0 auto;padding:0 24px 40px}
@media (max-width:1023px){.rz .wrap{padding:0 14px calc(96px + env(safe-area-inset-bottom))}}

/* ===================== topbar ===================== */
.rz .topbar{position:sticky;top:0;z-index:40;padding:14px 24px;display:flex;justify-content:center;
  background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;transition:border-color .15s}
.rz .topbar.scrolled{border-bottom-color:var(--hairline)}
@media (max-width:1023px){.rz .topbar{padding:12px 14px}}
.rz .topbar-in{width:100%;max-width:1400px;display:flex;align-items:center;gap:14px}
.rz .brandmark{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.rz .brandmark svg{flex:0 0 auto}
.rz .brandtext{display:flex;flex-direction:column;line-height:1.1}
.rz .brandtext b{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--text)}
.rz .brandtext span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mut)}
@media (max-width:1023px){.rz .brandtext span{display:none}}
@media (max-width:400px){
  .rz .topbar-in{gap:6px}
  .rz .brandtext{display:none}
  .rz .monthlabel{min-width:84px;font-size:12px}
  .rz .mbtn{width:24px;height:24px}
}

.rz .monthpill{position:relative;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:3px;margin:0 auto;box-shadow:var(--shadow-card)}
.rz .mbtn{border:none;background:transparent;width:28px;height:28px;border-radius:999px;cursor:pointer;color:var(--text);display:grid;place-items:center;transition:background .15s}
.rz .mbtn:hover{background:var(--surface-2)}
.rz .monthlabel{border:none;background:transparent;cursor:pointer;color:var(--text);font-size:13px;font-weight:600;padding:0 8px;min-width:118px;height:28px;text-align:center;text-transform:capitalize;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;transition:background .15s}
.rz .monthlabel:hover{background:var(--surface-2)}
.rz .monthpop{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:14px;box-shadow:0 24px 48px -16px rgba(0,0,0,.4);z-index:45;width:260px;max-width:88vw}
.rz .mpyear{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rz .mpyear b{font-size:14px;font-weight:700;font-family:'Sora',sans-serif}
.rz .mpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rz .mpm{border:1px solid var(--hairline);background:var(--bg);border-radius:9px;padding:9px 4px;font-size:13px;color:var(--text);cursor:pointer;text-transform:capitalize;transition:all .12s}
.rz .mpm:hover{border-color:var(--accent)}
.rz .mpm.on{background:var(--grad-accent);color:#fff;border-color:transparent}
.rz .mptoday{width:100%;border:1px dashed var(--hairline);background:transparent;color:var(--text-mut);border-radius:9px;padding:9px;margin-top:10px;font-size:12px;cursor:pointer}
.rz .mptoday:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:560px){.rz .monthpop{position:fixed;left:50%;top:68px;transform:translateX(-50%);width:calc(100vw - 32px)}}

.rz .topr{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.rz .saveind{font-size:11px;color:var(--text-mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
.rz .saveind i{width:6px;height:6px;border-radius:50%;background:var(--pos);display:inline-block}
.rz .saveind.err{color:var(--neg)}
.rz .saveind.err i{background:var(--neg)}
.rz .saveretry{border:none;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:11px;padding:0;margin-left:2px}
@media (max-width:640px){.rz .saveind span:not(.saveretry){display:none}.rz .saveind.err span:not(.saveretry){display:inline}}
.rz .iconbtn{border:1px solid var(--hairline);background:var(--surface);width:38px;height:38px;border-radius:11px;cursor:pointer;display:grid;place-items:center;color:var(--text);transition:all .15s;box-shadow:var(--shadow-card);flex:0 0 auto}
.rz .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.rz .menu{position:relative}
.rz .menupop{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--hairline);border-radius:12px;padding:6px;box-shadow:0 24px 48px -16px rgba(0,0,0,.4);z-index:45;min-width:210px}
.rz .menupop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:transparent;padding:10px 12px;border-radius:8px;font-size:13px;color:var(--text);cursor:pointer}
.rz .menupop button:hover{background:var(--surface-2)}
.rz .menupop .who{font-size:11px;color:var(--text-mut);padding:6px 12px 8px;border-bottom:1px solid var(--hairline);margin-bottom:4px;word-break:break-all}
@media (max-width:1023px){.rz .menu{display:none}}

/* ===================== shell / sidebar / grid ===================== */
.rz .shell{display:flex;gap:28px;align-items:flex-start;padding-top:20px}
.rz .sidebar{display:none}
@media (min-width:1024px){
  .rz .sidebar{
    display:flex;flex-direction:column;flex:0 0 68px;width:68px;position:sticky;top:78px;
    background:var(--surface);border:1px solid var(--hairline);border-radius:16px;padding:10px 8px;
    max-height:calc(100vh - 98px);overflow-y:auto;overflow-x:hidden;box-shadow:var(--shadow-card);
  }
  .rz .navgrouplabel{display:none}
  .rz .navitem{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:var(--text-mut);cursor:pointer;padding:9px;border-radius:10px;margin-bottom:2px;font-size:13px;font-weight:500;white-space:nowrap}
  .rz .navitem:hover{background:var(--surface-2);color:var(--text)}
  .rz .navitem.on{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
  .rz .navic{flex:0 0 auto;display:grid;place-items:center}
  .rz .navlbl{display:none}
  .rz .navitem:hover::after{content:attr(data-tip);position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:10px;background:var(--surface);border:1px solid var(--hairline);padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;box-shadow:0 12px 28px -14px rgba(0,0,0,.6);z-index:10;font-weight:500;color:var(--text)}
  .rz .navfooter{display:flex;align-items:center;gap:9px;margin-top:8px;padding-top:9px;border-top:1px solid var(--hairline)}
  .rz .navavatar{flex:0 0 30px;height:30px;border-radius:9px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .rz .navlbl2{display:none}
  .rz .tabcontent{flex:1;min-width:0}
}
@media (min-width:1280px){
  .rz .sidebar{flex:0 0 240px;width:240px;padding:14px 12px;align-items:stretch}
  .rz .navgrouplabel{display:block;padding:14px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mut)}
  .rz .navgroup:first-child .navgrouplabel{padding-top:2px}
  .rz .navitem{padding:9px 10px}
  .rz .navitem:hover::after{display:none}
  .rz .navlbl{display:flex;flex-direction:column}
  .rz .navfooter{padding:10px}
  .rz .navavatar{flex:0 0 30px}
  .rz .navlbl2{display:flex;flex-direction:column;overflow:hidden}
  .rz .navlbl2 b{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rz .navlbl2 small{font-size:10px;color:var(--text-mut)}
}

.rz .tabcontent{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;width:100%}
.rz .tabcontent>*{grid-column:span 12}
.rz .tabcontent>.g-6{grid-column:span 6}
.rz .tabcontent>.g-4{grid-column:span 4}
@media (max-width:767px){.rz .tabcontent{gap:14px}.rz .tabcontent>.g-6,.rz .tabcontent>.g-4{grid-column:span 12}}
.rz .dashtop{display:none}
@media (min-width:1024px){
  .rz .dashtop{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;grid-column:1/-1;margin-bottom:20px}
  .rz .dashtop>.hero{grid-column:span 5;margin-bottom:0}
  .rz .dashtop>.add{grid-column:span 7;margin-bottom:0}
}
.rz .banner{background:var(--warn-bg);color:var(--warn);border-radius:11px;padding:10px 13px;font-size:12px;margin-bottom:16px;line-height:1.5;grid-column:1/-1}
.rz .banner.err{background:var(--neg-bg);color:var(--neg)}

/* ===================== hero (signature element) ===================== */
.rz .hero{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.rz .hero::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--grad-accent)}
.rz .hero .herotop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rz .hero .bal{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:32px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:4px 0 16px}
@media (min-width:1024px){.rz .hero .bal{font-size:40px}}
.rz .hero .bal.pos{color:var(--pos)}.rz .hero .bal.neg{color:var(--neg)}
.rz .heropct{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.rz .heropct.up{background:var(--pos-bg);color:var(--pos)}
.rz .heropct.down{background:var(--neg-bg);color:var(--neg)}
.rz .herospark{flex:0 0 auto}
.rz .stats{display:flex;gap:0;border-top:1px solid var(--hairline);margin-top:2px;padding-top:14px;flex-wrap:wrap}
.rz .stat{flex:1 1 100px;padding:0 14px;border-left:1px solid var(--hairline)}
.rz .stat:first-child{border-left:none;padding-left:0}
.rz .stat .k{font-size:11px;color:var(--text-mut);display:flex;align-items:center;gap:6px}
.rz .stat .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;margin-top:4px}

/* ===================== add / form ===================== */
.rz .add{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-card)}
.rz .seg{display:flex;gap:6px;margin-bottom:14px;position:relative}
.rz .seg button{flex:1;border:1px solid var(--hairline);background:var(--bg);border-radius:11px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--text-mut);cursor:pointer;transition:all .15s}
.rz .seg button.on.out{background:var(--neg-bg);color:var(--neg);border-color:var(--neg)}
.rz .seg button.on.in{background:var(--pos-bg);color:var(--pos);border-color:var(--pos)}
.rz .seg button.on.inv{background:var(--inv-bg);color:var(--inv);border-color:var(--inv)}
.rz .seg button.on.trf{background:var(--trf-bg);color:var(--trf);border-color:var(--trf)}

.rz .amount{display:flex;align-items:center;gap:8px;border:1px solid var(--hairline);border-radius:12px;padding:0 14px;height:58px;margin-bottom:12px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
.rz .amount.small{height:46px}
.rz .amount:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.rz .amount .cur{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--text-mut)}
.rz .amount input{flex:1;border:none;outline:none;background:transparent;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:28px;font-weight:500;color:var(--text);width:100%;letter-spacing:-.01em}
.rz .amount.small input{font-size:19px}
.rz .amount input::placeholder{color:var(--text-mut);opacity:.5}

.rz .row2{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.rz .row2>*{flex:1;min-width:130px}
.rz .fld{border:1px solid var(--hairline);border-radius:var(--r-field);padding:11px 12px;font-size:14px;color:var(--text);background:var(--surface);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.rz .fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.rz select.fld{cursor:pointer}

.rz .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;position:relative}
.rz .chip{border:1px solid var(--hairline);background:var(--bg);border-radius:999px;padding:7px 12px 7px 8px;font-size:13px;cursor:pointer;color:var(--text);transition:all .12s;display:flex;align-items:center;gap:6px}
.rz .chip:hover{border-color:var(--accent)}
.rz .chip.on{background:var(--grad-accent);color:#fff;border-color:transparent}
.rz .chip .swatch{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto}
.rz .chip.on .swatch{background:rgba(255,255,255,.2)!important}
.rz .aichip{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--accent);background:var(--accent-bg);padding:5px 10px;border-radius:999px;font-weight:600}
.rz .aichip .shimmer{width:60px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent-bg) 25%,var(--accent) 50%,var(--accent-bg) 75%);background-size:200% 100%;animation:shimmer 1.4s ease infinite}

.rz .submit{width:100%;border:none;border-radius:12px;background:var(--grad-accent);color:#fff;padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;box-shadow:0 10px 24px -10px var(--accent-bg)}
.rz .submit:hover{opacity:.92}.rz .submit:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.rz .editing{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-mut);margin-bottom:10px}
.rz .editing button{border:none;background:none;color:var(--neg);cursor:pointer;font-size:12px;text-decoration:underline}

/* pdf.js é pesado (~1,4 MB com o worker) e só serve pro Extrato Inteligente — carregado sob demanda,
   só na primeira vez que a pessoa realmente tenta ler um PDF, não no carregamento do app inteiro. */
let pdfJsLoadPromise = null;
function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "vendor/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";

/* =======================================================================
   IA (Google Gemini) — usada em vários pontos do app: leitura de PDF/foto
   de extrato e recibo, categorização automática, resumo mensal, detecção
   de assinaturas e o assistente de perguntas.
   As chamadas passam por /api/gemini (função serverless da Vercel), que
   guarda a chave no servidor via variável de ambiente GEMINI_API_KEY —
   ela nunca fica exposta neste arquivo nem chega ao navegador de quem
   visita o site. Configure a env var no painel do projeto na Vercel
   (Settings > Environment Variables) e faça um novo deploy.
   Rodando localmente via file:// (sem o endpoint /api disponível), os
   recursos de IA falham de forma controlada e, quando possível, caem
   para uma alternativa sem IA (ex: leitura de PDF por regex).
   ======================================================================= */
const fileToBase64 = (file)=> new Promise((resolve,reject)=>{
  const r = new FileReader();
  r.onload = ()=> resolve(String(r.result).split(",")[1]);
  r.onerror = reject;
  r.readAsDataURL(file);
});

/* chama o proxy /api/gemini; devolve o texto cru da resposta (JSON.parse se usar schema) */
async function callGemini({ prompt, inlineData, schema, model }){
  let res;
  try{
    res = await fetch("/api/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, inlineData, schema, model }),
    });
  }catch(networkErr){
    throw new Error("Não foi possível falar com a IA (sem conexão com o servidor).");
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || `Erro na IA (${res.status}).`);
  if(!data.text) throw new Error("A IA não retornou dados.");
  return data.text;
}

/* pede à IA para ler o PDF do extrato inteiro e devolver os lançamentos já estruturados e categorizados */
async function analyzeStatementWithAI(file){

  const prompt = `Você é um assistente financeiro que lê extratos bancários e faturas de cartão de crédito em PDF e extrai cada lançamento individual.

Para cada lançamento, retorne:
- date: data no formato ISO (AAAA-MM-DD). Se o ano não estiver explícito na linha, use o ano do período do extrato.
- description: descrição curta e limpa (sem códigos internos do banco).
- amount: valor em reais, número positivo (ex: 150.5).
- type: "gasto" para saídas/débitos/compras, "ganho" para entradas/depósitos/créditos, "investimento" somente para aportes/aplicações claramente de investimento.
- category: a categoria que melhor descreve o lançamento, escolhida EXATAMENTE entre as opções abaixo para o "type" escolhido:
${categoryList}

Ignore linhas que não são lançamentos individuais (cabeçalhos, saldo anterior, saldo final, totais, rodapés, número de página).
Retorne todos os lançamentos encontrados no documento, na ordem em que aparecem.`;

  const schema = {
    type: "OBJECT",
    properties: {
      transactions: {
        type: "ARRAY",
        items: {
          type: "OBJECT",
          properties: {
            date: { type: "STRING" },
            description: { type: "STRING" },
            amount: { type: "NUMBER" },
            type: { type: "STRING", enum: ["gasto","ganho","investimento"] },

          },

        },
      },
    },
    required: ["transactions"],
  };

  const text = await callGemini({ prompt, inlineData: { mimeType: file.type||"application/pdf", data: base64 }, schema });

/* valida e converte os lançamentos vindos da IA para o formato usado pela lista de revisão do Extrato Inteligente */
function sanitizeAiTransactions(list, accounts){
  const defAcct = accounts[0]?.id || "";
  return list.map(t=>{
    const type = ["gasto","ganho","investimento"].includes(t.type) ? t.type : "gasto";
    const validCats = CATS[type].map(c=>c[0]);
    const match = validCats.find(c=>c.toLowerCase()===String(t.category||"").trim().toLowerCase());
    const category = match || validCats[validCats.length-1];
    const cents = Math.max(0, Math.round((Number(t.amount)||0)*100));
    const date = /^\d{4}-\d{2}-\d{2}$/.test(t.date||"") ? t.date : todayISO();
    return { id: uid(), date, desc: String(t.description||"").trim(), cents, type, category, acctId: defAcct };
  }).filter(it=>it.cents>0);
}

/* memória de categorização: mapa descrição normalizada → categoria escolhida da última vez, alimentado a
   cada lançamento salvo. Consultada antes de chamar a IA — evita gasto de rede/latência quando a pessoa já
   categorizou essa mesma descrição (ou uma bem parecida) antes. */
function lookupCategoryMemory(memory, description){
  const norm = (description||"").trim().toLowerCase();
  if(!norm || !memory) return null;
  if(memory[norm]) return memory[norm];
  // variação comum: a descrição atual tem algo a mais (data, número da loja) mas contém uma já conhecida
  const key = Object.keys(memory).filter(k=>k.length>=3).find(k=>norm.includes(k));
  return key ? memory[key] : null;
}
/* sugere a categoria (dentro do type já escolhido) a partir da descrição digitada no formulário principal */

Qual das categorias abaixo melhor descreve esse lançamento? Responda com o nome exato de uma delas.
Opções: ${cats.join(", ")}`;
  const schema = { type:"OBJECT", properties:{ category:{ type:"STRING", enum:cats } }, required:["category"] };
  const text = await callGemini({ prompt, schema });
  const parsed = JSON.parse(text);
  return cats.includes(parsed.category) ? parsed.category : null;
}

/* detecção puramente local (sem IA) de gastos recorrentes: agrupa por descrição, identifica cadência ~mensal
   e sinaliza candidatos que sumiram há muito tempo ou tiveram o valor mais recente muito fora do padrão */
function detectRecurringCandidates(txs, today){
  const groups={};
  txs.filter(t=>t.type==="gasto").forEach(t=>{
    const key=(t.description.trim()||t.category).toLowerCase();
    (groups[key]=groups[key]||{ label:t.description.trim()||t.category, category:t.category, items:[] }).items.push(t);
  });
  const candidates=[];
  Object.values(groups).forEach(g=>{
    if(g.items.length<2) return;
    const sorted=[...g.items].sort((a,b)=>a.date<b.date?-1:1);
    let monthlyGaps=0;
    for(let i=1;i<sorted.length;i++){
      const days=(new Date(sorted[i].date+"T00:00:00")-new Date(sorted[i-1].date+"T00:00:00"))/86400000;
      if(days>=24 && days<=40) monthlyGaps++;
    }
    if(monthlyGaps<Math.max(1,sorted.length-2)) return; // não parece ter cadência mensal consistente
    const last=sorted[sorted.length-1];
    const daysSinceLast=Math.round((today-new Date(last.date+"T00:00:00"))/86400000);
    const prevAvg=sorted.slice(0,-1).reduce((s,t)=>s+t.cents,0)/Math.max(1,sorted.length-1);
    const anomalyPct=prevAvg>0?Math.round(((last.cents-prevAvg)/prevAvg)*100):0;
    if(daysSinceLast>=45 || Math.abs(anomalyPct)>=25){
      candidates.push({
        descricao:g.label, categoria:g.category, ocorrencias:sorted.length,
        ultimoValor:(last.cents/100).toFixed(2), valorMedioAnterior:(prevAvg/100).toFixed(2),
        diasDesdeUltimaVez:daysSinceLast, variacaoPercentual:anomalyPct,
      });
    }
  });
  return candidates;
}

/* extrai o texto de um PDF (extrato bancário), linha a linha, agrupando itens pela posição vertical */
async function extractPdfText(pdf){
  let fullText = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const lines = {};
    content.items.forEach(item => {
      const y = Math.round(item.transform[5] / 2) * 2;
      (lines[y] = lines[y] || []).push(item);
    });
    Object.keys(lines).map(Number).sort((a, b) => b - a).forEach(y => {
      const row = lines[y].sort((a, b) => a.transform[4] - b.transform[4]);
      fullText += row.map(i => i.str).join(" ") + "\n";
    });
  }
  return fullText;
}

/* ---- helpers ---- */
const brl = (c)=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brlNum = (c)=>(c/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
// preço em horas de trabalho (opcional, configurável em "Mais"): converte um valor pro tempo de trabalho
// que ele equivale, dado o valor da hora configurado. hourlyWageCents=0 (padrão) desliga o recurso inteiro.
const formatHours = (cents, hourlyWageCents)=>{ if(!hourlyWageCents) return null; const h=cents/hourlyWageCents; return h<10 ? h.toFixed(1).replace(".",",")+"h" : Math.round(h)+"h"; };
const abbrevBRL = (cents)=>{
  const v=Math.abs(cents/100);
  if(v>=1000000) return (cents<0?"-":"")+(v/1000000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";
  if(v>=1000) return (cents<0?"-":"")+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";
  return (cents<0?"-":"")+v.toLocaleString("pt-BR",{maximumFractionDigits:0});
};
const todayISO = ()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const monthKey = (d)=>d.slice(0,7);
// segunda-feira da semana que contém essa data ISO — usada como chave de "semana" pro recap automático
// (não é o número de semana ISO-8601 oficial, só um agrupamento estável de 7 em 7 dias, mais simples de calcular)
const weekStartISO = (iso)=>{ const d=new Date(iso+"T00:00:00"); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// tags de primeira classe: extraídas da descrição (#tag), únicas e em minúsculas — usada por chips na
// linha, filtro (Fase 4), visão "gasto por tag" e autocompletar no formulário
const extractTags = (description)=>{ const m=(description||"").match(/#(\w+)/g); return m ? [...new Set(m.map(s=>s.slice(1).toLowerCase()))] : []; };
const fmtDateBR = (iso)=>new Date(iso+"T00:00:00").toLocaleDateString("pt-BR");
// soma n meses a uma data ISO, ajustando o dia se o mês de destino for mais curto (ex: 31/01 + 1 mês = 28 ou 29/02)
const addMonthsISO = (iso, n)=>{
  const [y,m,d] = iso.split("-").map(Number);
  const first = new Date(y, m-1+n, 1);
  const lastDay = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const dt = new Date(first.getFullYear(), first.getMonth(), Math.min(d, lastDay));
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
};
// divide um total em n parcelas inteiras (centavos) sem perder nem sobrar 1 centavo no arredondamento
const splitCents = (total, n)=>{
  const base = Math.floor(total/n);
  const remainder = total - base*n;
  return Array.from({length:n}, (_,i)=> base + (i<remainder?1:0));
};
// para gastos em cartão com dia de fechamento/vencimento configurados, devolve o mês da fatura em que o gasto pesa no fluxo de caixa
const txEffectiveMonth = (t, accounts)=>{
  if(t.type==="gasto"){
    const acc=accounts.find(a=>a.id===t.acctId);
    if(acc && acc.kind==="cartao" && acc.closingDay && acc.dueDay){
      const d=new Date(t.date+"T00:00:00");
      let y=d.getFullYear(), m=d.getMonth();
      if(d.getDate()>acc.closingDay) m+=1;
      if(acc.dueDay<=acc.closingDay) m+=1;
      y+=Math.floor(m/12); m=((m%12)+12)%12;
      return `${y}-${String(m+1).padStart(2,"0")}`;
    }
  }
  return monthKey(t.date);
};
// grau de independência financeira: média de proventos ÷ média de gastos totais, nos últimos 6 meses até "view".
// a média divide só pelos meses que realmente têm algum lançamento (não pelos 6 fixos), pra não subestimar
// o indicador logo no começo do uso do app, quando ainda não há 6 meses de histórico.
// recebe o índice único por mês (App) em vez de txs cru — evita re-varrer todo o histórico a cada chamada
const financialIndependence = (monthIndex, view)=>{
  let provSum=0, gastoSum=0, monthsWithData=0;
  for(let i=0;i<6;i++){
    const d=new Date(view.getFullYear(), view.getMonth()-i, 1);
    const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const b=monthIndex[mk];
    if(b && (b.entradas||b.saidas||b.investido)){
      provSum+=b.proventos;
      gastoSum+=b.saidas;
      monthsWithData++;
    }
  }
  const n = monthsWithData||1;
  const avgProv=provSum/n, avgGasto=gastoSum/n;
  const pct = avgGasto>0 ? (avgProv/avgGasto)*100 : (avgProv>0 ? 100 : 0);
  return { pct, avgProv, avgGasto, monthsWithData };
};
// fatura líquida de um cartão num período: gastos do período menos transferências recebidas por ele no
// mesmo período (pagamento da fatura) — nunca fica negativa; o excedente vira crédito restante.
// "items" já deve vir filtrado para o período certo (ex: flowTx do mês, que respeita txEffectiveMonth).
// previsto não entra: um gasto ou pagamento que ainda não aconteceu não compromete a fatura de verdade ainda.
const cardInvoiceNet = (items, acctId)=>{
  const gasto = items.filter(t=>t.type==="gasto" && t.acctId===acctId && isRealized(t)).reduce((s,t)=>s+t.cents,0);
  const paid = items.filter(t=>t.type==="transferencia" && t.toAcctId===acctId && isRealized(t)).reduce((s,t)=>s+t.cents,0);
  return { gasto, paid, net: Math.max(0, gasto-paid), credit: Math.max(0, paid-gasto) };
};

const SEED = {
  schemaVersion:4, theme:"dark", transactions:[],
  accounts:[{id:"a1",name:"Conta principal",kind:"conta",color:"#3B63C4"},{id:"c1",name:"Cartão de crédito",kind:"cartao",color:"#A57BE0"}],
  budgets:{}, budgetExceptions:{}, goals:[], holdings:[],
  categoryMemory:{}, patrimonyHistory:{}, recaps:{weekly:{},monthly:{}},
  settings:{hourlyWageCents:0},
};
const SCHEMA_VERSION = 4;
/* migrate() é idempotente: leva qualquer versão anterior (inclusive dados sem o campo schemaVersion,
   como um backup .json exportado antes desta mudança) até a atual. Nenhum campo existente é renomeado
   ou removido — só acrescentado, com um padrão seguro, só onde ainda não existir. Rodar duas vezes
   sobre o mesmo dado não muda nada (é seguro chamar tanto no carregamento quanto na importação). */
function migrate(data){
  const d = { ...SEED, ...data };
  // 2.3 — previsto × realizado: lançamentos antigos, sem o campo, sempre foram tratados como já ocorridos
  d.transactions = (d.transactions||[]).map(t=>({ status:"realizado", ...t }));
  // 2.2 — saldo inicial por conta
  d.accounts = (d.accounts||[]).map(a=>({ openingBalance:0, openingDate:"", ...a }));
  // 3.0 — memória de categorização, histórico de patrimônio e recaps automáticos (Fase 5)
  d.categoryMemory = d.categoryMemory || {};
  d.patrimonyHistory = d.patrimonyHistory || {};
  d.recaps = { weekly:{}, monthly:{}, ...(d.recaps||{}) };
  // 3.0 — meta pode opcionalmente ser ligada a uma categoria real, contando lançamentos daquela categoria
  d.goals = (d.goals||[]).map(g=>({ linkedCategory:null, ...g }));
  // 4.0 — preço em horas de trabalho (opcional): 0 = recurso desligado, não aparece em lugar nenhum
  d.settings = { hourlyWageCents:0, ...(d.settings||{}) };
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}

/* ---- persistência ----
   loadData nunca cai silenciosamente em SEED por falha: falha de rede ou JSON corrompido
   sempre lança, para o chamador (App) mostrar uma tela de erro em vez de sobrescrever dados reais. */
async function loadData(userId){
  if (sb && userId){
    const { data, error } = await sb.from("finance_data").select("data,updated_at").eq("user_id",userId).maybeSingle();
    if (error) throw error;
    if (data && data.data) return { data: migrate(data.data), updatedAt: data.updated_at };
    const nowIso = new Date().toISOString();
    const { error: insErr } = await sb.from("finance_data").insert({ user_id:userId, data:SEED, updated_at:nowIso });
    if (insErr) throw insErr;
    return { data: SEED, updatedAt: nowIso };
  }
  const raw = localStorage.getItem("razao");
  if (!raw) return { data: SEED, updatedAt: null };
  let parsed;
  try { parsed = JSON.parse(raw); }
  catch(e){ throw new Error("Os dados salvos neste aparelho estão corrompidos e não puderam ser lidos: "+e.message); }
  return { data: migrate(parsed), updatedAt: null };
}
// compara dois timestamps pelo instante real (epoch), não pela string: o Postgres/PostgREST costuma
// devolver o mesmo instante num formato de texto diferente do que enviamos (ex: "+00:00" em vez de "Z"),
// então comparar string com "!==" gera falso conflito a cada gravação.
const sameInstant = (a, b) => {
  if (a===b) return true;
  if (!a || !b) return false;
  const ta = Date.parse(a), tb = Date.parse(b);
  return !isNaN(ta) && !isNaN(tb) && ta===tb;
};
/* saveData verifica conflito (updated_at mais novo no servidor do que o esperado) antes de gravar,
   a menos que force=true. Lança em qualquer falha real, para o chamador tratar/tentar de novo. */
async function saveData(userId, data, expectedUpdatedAt, force){
  if (sb && userId){
    if (expectedUpdatedAt && !force){
      const { data: row, error: checkErr } = await sb.from("finance_data").select("updated_at").eq("user_id",userId).maybeSingle();
      if (checkErr) throw checkErr;
      if (row && row.updated_at && !sameInstant(row.updated_at, expectedUpdatedAt)){
        return { conflict:true };
      }
    }
    const nowIso = new Date().toISOString();
    // pede de volta o updated_at tal como o Postgres o armazenou, para as próximas comparações
    // partirem do mesmo formato (evita o falso conflito descrito acima já na origem)
    const { data: saved, error } = await sb.from("finance_data").upsert({ user_id:userId, data, updated_at:nowIso }).select("updated_at").maybeSingle();
    if (error) throw error;
    return { conflict:false, updatedAt: (saved && saved.updated_at) || nowIso };
  }
  localStorage.setItem("razao", JSON.stringify(data));
  return { conflict:false, updatedAt: null };
}
/* checagem leve, só do carimbo de tempo — usada ao voltar o foco na aba, sem baixar os dados inteiros */
async function fetchServerUpdatedAt(userId){
  if (!sb || !userId) return null;
  const { data, error } = await sb.from("finance_data").select("updated_at").eq("user_id",userId).maybeSingle();
  if (error) throw error;
  return data ? data.updated_at : null;
}

/* hook simples de breakpoint: só usado onde o comportamento (não só o visual) muda entre mobile e desktop */
function useIsDesktop(){
  const [d,setD]=useState(()=> typeof window!=="undefined" && window.matchMedia("(min-width:1024px)").matches);
  useEffect(()=>{
    const mq=window.matchMedia("(min-width:1024px)");
    const fn=()=>setD(mq.matches);
    mq.addEventListener("change",fn);
    return ()=>mq.removeEventListener("change",fn);
  },[]);
  return d;
}

/* ---- bottom sheet / modal genérico: forms, menus e diálogo de confirmação ---- */
function Sheet({ open, onClose, title, children, returnFocusRef }){
  const ref=useRef(null);
  useEffect(()=>{
    if(!open) return;
    const prevOverflow=document.body.style.overflow;
    document.body.style.overflow="hidden";
    const onKey=(e)=>{ if(e.key==="Escape") onClose(); };
    document.addEventListener("keydown",onKey);
    const t=setTimeout(()=>{ ref.current?.querySelector("input,button,select,textarea")?.focus(); },50);
    return ()=>{
      document.body.style.overflow=prevOverflow;
      document.removeEventListener("keydown",onKey);
      clearTimeout(t);
      if(returnFocusRef && returnFocusRef.current) returnFocusRef.current.focus();
    };
  },[open]);
  if(!open) return null;
  return (
    <div className="sheetbackdrop" onClick={onClose}>
      <div className="sheet" ref={ref} role="dialog" aria-modal="true" aria-label={title||"Diálogo"} onClick={e=>e.stopPropagation()}>
        <div className="sheethandle"/>
        {title &&
          <div className="sheettitle">
            {title}
            <button className="sheetclose" aria-label="Fechar" onClick={onClose}><Icon name="fechar" size={16}/></button>
          </div>}
        <div className="sheetbody">{children}</div>
      </div>
    </div>
  );
}

// ids afetados por uma escolha de escopo numa série (recorrência/parcelamento): só este / este e os
// próximos (pelo índice na série) / todos. Sem seriesId, só o próprio item conta.
function seriesScopeIds(t, txs, choice){
  if(!t.seriesId || choice==="only") return [t.id];
  if(choice==="future") return txs.filter(x=>x.seriesId===t.seriesId && x.seriesIndex>=t.seriesIndex).map(x=>x.id);
  if(choice==="all") return txs.filter(x=>x.seriesId===t.seriesId).map(x=>x.id);
  return [t.id];
}
let seriesScopeListener=null;
function askSeriesScope(opts){ seriesScopeListener && seriesScopeListener(opts); } // opts: {tx, txs, action:"editar"|"excluir", onChoice(ids)}
function SeriesScopeHost(){
  const [state,setState]=useState(null);
  useEffect(()=>{ seriesScopeListener=setState; return ()=>{ seriesScopeListener=null; }; },[]);
  const close=()=>setState(null);

  return (
    <Sheet open={!!state} onClose={close} title={state?`${state.action==="excluir"?"Excluir":"Editar"} lançamento recorrente`:""}>

        <React.Fragment>

/* ---- barra de progresso: excedente em hachura + marcador no ponto de 100% ---- */
function ProgressBar({ spent, limit, status }){
  if(!(limit>0)) return null;
  const color = status==="over"?"var(--neg)":status==="warn"?"var(--warn)":"var(--pos)";
  if(spent<=limit){
    const pct=Math.min(100, spent/limit*100);
    return <div className="bar"><i style={{ width:pct+"%", background:color }}/></div>;
  }
  const markerPct = limit/spent*100;
  return (
    <div className="bar">
      <i style={{ width:markerPct+"%", background:"var(--pos)" }}/>
      <i className="bar-excess" style={{ left:markerPct+"%", width:(100-markerPct)+"%" }}/>
      <span className="bar-marker" style={{ left:markerPct+"%" }}/>
    </div>
  );
}

/* ---- componentes de gráfico (SVG/CSS, sem dependências) ---- */
function Donut({ data, size=160, thickness=22, onSelect, selected, centerLabel }){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const r=(size-thickness)/2, c=2*Math.PI*r, cx=size/2;
  let acc=0;
  return (
    <div className="donutwrap" style={{ width:size, height:size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <g transform={`rotate(-90 ${cx} ${cx})`}>
          {data.map((d,i)=>{
            const frac=d.value/total, dash=frac*c;
            const dim=selected && selected!==d.name;
            const el=<circle key={i} cx={cx} cy={cx} r={r} fill="none" stroke={d.color}
              strokeWidth={thickness} strokeLinecap="round" strokeDasharray={`${Math.max(0,dash-2)} ${c-dash+2}`} strokeDashoffset={-acc*c}
              style={{opacity:dim?.28:1,cursor:onSelect?"pointer":"default",transition:"opacity .15s"}}
              onClick={onSelect?()=>onSelect(d.name):undefined}>
              <title>{d.name}: {brl(d.value)} ({(frac*100).toFixed(0)}%)</title>
            </circle>;
            acc+=frac; return el;
          })}
        </g>
      </svg>
      <div className="donutcenter">
        <b className="num">{brlNum(total)}</b>
        <span>{centerLabel||"total"}</span>
      </div>
    </div>
  );
}

                  onMouseEnter={e=>setTip({ x:e.clientX, y:e.clientY, name:g.name, value:b.v })}

function Auth(){

  async function go(){
    setErr(""); setOk(""); setBusy(true);
    try{
      if(signup){
        const { error } = await sb.auth.signUp({ email, password:pass, options:{ emailRedirectTo: window.location.origin+window.location.pathname } });
        if(error) throw error;
        setOk("Conta criada. Se pedirem confirmação, verifique seu e-mail — o link te traz de volta aqui já conectado.");

      } else {

        if(error) throw error;
      }

    finally{ setBusy(false); }
  }
  async function sendRecovery(){
    setErr(""); setBusy(true);
    try{
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin+window.location.pathname });
      if(error) throw error;
      setRecoverSent(true);
    }catch(e){ setErr(e.message||"Não foi possível enviar o link de redefinição."); }

                <React.Fragment>
                  <div className="fieldok" style={{marginBottom:16}}>Enviamos um link de redefinição para {email}. Abra-o neste aparelho para definir uma nova senha.</div>
                  <button className="sbtn" onClick={backToLogin}>Voltar para entrar</button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <p style={{fontSize:13,color:"var(--text-mut)",marginBottom:14}}>Informe seu e-mail — enviaremos um link para você criar uma nova senha.</p>

                  <button className="submit" onClick={sendRecovery} disabled={busy||!email}>{busy?"Enviando…":"Enviar link de redefinição"}</button>
                  {err && <div className="fielderr">{err}</div>}
                  <div className="authswitch"><button onClick={backToLogin}>Voltar para entrar</button></div>
                </React.Fragment>
              )}
            </div>
          ) : (
            <div className="authformcard">
              <h2>{signup?"Criar conta":"Entrar"}</h2>

                <input id="authemail" className="fld floating" type="email" placeholder=" " value={email} onChange={e=>setEmail(e.target.value)} />
                <label htmlFor="authemail">E-mail</label>
              </div>
              <div className="field">
                <input id="authpass" className="fld floating" type={showPass?"text":"password"} placeholder=" " value={pass}
                  onChange={e=>setPass(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")go();}} />
