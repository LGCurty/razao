function Sparkline({ data, w=100, h=40 }){
  const gradId="sparkgrad-"+useId(); // id único por instância — duas sparklines na mesma tela não podem colidir
  if(!data || data.length<2) return null;
  const min=Math.min(...data,0), max=Math.max(...data,0);
  const range=(max-min)||1;
  const pts=data.map((v,i)=>[ (i/(data.length-1))*w, h-((v-min)/range)*h ]);
  const line=pts.map((p,i)=>(i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+` L${w},${h} L0,${h} Z`;
  const up = data[data.length-1]>=data[0];
  const color = up?"var(--pos)":"var(--neg)";
  return (
    <svg width={w} height={h} className="herospark" viewBox={`0 0 ${w} ${h}`}>
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gradId})`} stroke="none"/>
      <path d={line} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function TxRow({ t, cls, acc, isTrf, shifted, flowLabel, acctName, onEdit, onDelete, onMarkPaid, onTagClick, hourlyWageCents }){
  const [swiped,setSwiped]=useState(false);
  const startX=useRef(null);
  function onTouchStart(e){ startX.current=e.touches[0].clientX; }
  function onTouchEnd(e){
    if(startX.current==null) return;
    const dx=e.changedTouches[0].clientX-startX.current;
    if(dx<-40) setSwiped(true); else if(dx>40) setSwiped(false);
    startX.current=null;
  }
  const previsto = !isRealized(t);
  const inSeries = t.seriesTotal>1;
  const tags = useMemo(()=>extractTags(t.description),[t.description]);
  return (
    <div className={"tx"+(swiped?" swiped":"")+(previsto?" previsto":"")} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <div className={"emo "+cls}><Icon name={isTrf?"transferencia":(CAT_ICON[t.category]||"outros")} size={17}/></div>
      <div className="info">
        <div className="t1">{t.description||(isTrf?"Transferência":t.category)}{previsto && <span className="tag warn" style={{marginLeft:6}}>previsto</span>}</div>
        <div className="t2">
          {isTrf
            ? <span>De {acctName(t.acctId)?.name||"?"} → {acctName(t.toAcctId)?.name||"?"}</span>
            : <><span>{t.description?t.category:TYPES[t.type].label}</span>{acc && <span className="acc"><i className="dot" style={{background:acc.color}}/>{acc.name}</span>}{shifted && <span style={{color:"var(--warn)"}}>· fatura {flowLabel}</span>}{inSeries && <span>· {t.seriesIndex+1}/{t.seriesTotal}</span>}</>}
        </div>
        {tags.length>0 &&
          <div className="tagrow">
            {tags.map(tg=>onTagClick
              ? <button type="button" className="tagchip clickable" key={tg} onClick={(e)=>{e.stopPropagation();onTagClick(tg);}}>#{tg}</button>
              : <span className="tagchip" key={tg}>#{tg}</span>)}
          </div>}
      </div>
      <div className={"val "+cls}>
        {isTrf?<>↔ {brlNum(t.cents)}</>:<>{TYPES[t.type].sign>0?"+":"−"} {brlNum(t.cents)}</>}
        {formatHours(t.cents,hourlyWageCents) && <div className="mm" style={{marginTop:2,textAlign:"right"}}>≈ {formatHours(t.cents,hourlyWageCents)}</div>}
      </div>
      <div className="acts">
        {previsto && <button aria-label="Marcar como pago" onClick={onMarkPaid}><Icon name="check" size={16}/></button>}
        <button aria-label="Editar" onClick={onEdit}><Icon name="editar" size={16}/></button>
        <button aria-label="Excluir" onClick={onDelete}><Icon name="excluir" size={16}/></button>
      </div>
    </div>
  );
}

/* ---- indicadores do Banco Central (Selic, CDI, IPCA) via API pública do SGS, com cache diário em
   localStorage (dado de mercado, não é dado do usuário — não precisa ir pro backup/Supabase). Uma falha de
   rede aqui não deve incomodar ninguém: o card some silenciosamente em vez de mostrar erro. ---- */
const BCB_CACHE_KEY="razao_bcb_cache";
async function fetchBcbSeries(code, n){
  const res=await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${code}/dados/ultimos/${n}?formato=json`);
  if(!res.ok) throw new Error("BCB indisponível");
  return res.json();
}
async function fetchBcbIndicators(){
  const today=todayISO();
  let cached=null;
  try{ cached=JSON.parse(localStorage.getItem(BCB_CACHE_KEY)||"null"); }catch(_){}
  if(cached && cached.date===today) return cached.data;
  const [selic,cdi,ipca]=await Promise.all([fetchBcbSeries(432,1),fetchBcbSeries(12,1),fetchBcbSeries(433,12)]);
  const num=(v)=>parseFloat(String(v).replace(",","."));
  const data={
    selic: selic[0] ? num(selic[0].valor) : null,
    cdi: cdi[0] ? num(cdi[0].valor) : null,
    ipca12m: ipca.length ? ipca.reduce((s,x)=>s+num(x.valor),0) : null,
  };
  localStorage.setItem(BCB_CACHE_KEY, JSON.stringify({date:today,data}));
  return data;
}
function BcbIndicators(){
  const [state,setState]=useState({status:"loading"});
  useEffect(()=>{
    let alive=true;
    fetchBcbIndicators().then(data=>{ if(alive) setState({status:"ok",data}); }).catch(err=>{ if(alive) setState({status:"err",error:err.message}); });
    return ()=>{ alive=false; };
  },[]);
  if(state.status==="err") return null;
  return (
    <div className="card g-6">
      <h3>Indicadores econômicos</h3>
      <div className="sub" style={{marginBottom:state.status==="loading"?0:14}}>Fonte: Banco Central (SGS) · cache diário.</div>
      {state.status==="loading" && <p className="hint">Carregando…</p>}
      {state.status==="ok" && <React.Fragment>
        {state.data.selic!=null && <div className="kv"><span className="kk">Selic (meta)</span><span className="vv">{state.data.selic.toFixed(2).replace(".",",")}% a.a.</span></div>}
        {state.data.cdi!=null && <div className="kv"><span className="kk">CDI (diário)</span><span className="vv">{state.data.cdi.toFixed(4).replace(".",",")}%</span></div>}
        {state.data.ipca12m!=null && <div className="kv"><span className="kk">IPCA (12 meses)</span><span className="vv">{state.data.ipca12m.toFixed(2).replace(".",",")}%</span></div>}
      </React.Fragment>}
    </div>
  );
}

/* ---------- PANORAMA GERAL (consolidado de todos os meses e todas as contas) ---------- */
function Geral({ txs, accounts, holdings, view, onSelectMonth, monthIndex, update, patrimonyHistory, recaps }){
  const EMPTY_BUCKET={entradas:0,saidas:0,investido:0,proventos:0,porCategoria:{},itens:[]};
  const monthBucket=(mk)=>monthIndex[mk]||EMPTY_BUCKET;
  // totais de todos os tempos: soma os baldes do índice em vez de re-varrer txs inteiro
  const totals=useMemo(()=>{
    let inc=0,exp=0,inv=0;
    Object.values(monthIndex).forEach(b=>{ inc+=b.entradas; exp+=b.saidas; inv+=b.investido; });
    return { inc, exp, inv, saldo: inc-exp-inv };
  },[monthIndex]);

  // saldo por conta: transferências são lançamento em par (debita a origem, credita o destino) em vez de usar o sinal fixo do tipo.
  // só o realizado conta (previsto ainda não aconteceu); soma o saldo inicial da conta por cima.
  // (dimensão por conta, não por mês — continua varrendo txs uma única vez, já é O(n) direto)
  const byAccount=useMemo(()=>{
    const m={};
    txs.filter(isRealized).forEach(t=>{
      if(t.type==="transferencia"){
        m[t.acctId]=(m[t.acctId]||0)-t.cents;
        m[t.toAcctId]=(m[t.toAcctId]||0)+t.cents;
      } else {
        m[t.acctId]=(m[t.acctId]||0)+t.cents*TYPES[t.type].sign;
      }
    });
    return accounts.map(a=>({ ...a, balance:(m[a.id]||0)+(a.openingBalance||0) }));
  },[txs,accounts]);

  // limite de cartão comprometido: gastos cuja fatura (fechamento/vencimento) cai no mês atual real,
  // menos transferências recebidas por aquele cartão no mesmo período (pagamento da fatura)
  const todayMk=useMemo(()=>{ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`; },[]);
  const cardCommitted=(acctId)=>cardInvoiceNet(monthBucket(todayMk).itens, acctId);

  const fi=useMemo(()=>financialIndependence(monthIndex,view),[monthIndex,view]);

  const totCur=holdings.reduce((s,h)=>s+h.current,0);
  const contasBalance=byAccount.filter(a=>a.kind==="conta").reduce((s,a)=>s+a.balance,0);
  const patrimonio=contasBalance+totCur;

  // snapshot mensal automático do patrimônio: atualiza o valor do mês corrente sempre que ele mudar (assim o mês
  // fica sempre em dia enquanto está em curso) e nunca mexe nos meses já fechados — isso é o "histórico".
  // Só grava quando o valor realmente muda, pra não gerar um save a cada render.
  const todayMkForSnapshot=useMemo(()=>todayISO().slice(0,7),[]);
  useEffect(()=>{
    if(accounts.length===0 && holdings.length===0) return;
    if((patrimonyHistory||{})[todayMkForSnapshot]===patrimonio) return;
    update(d=>({ patrimonyHistory:{ ...(d.patrimonyHistory||{}), [todayMkForSnapshot]:patrimonio } }));
  },[patrimonio,todayMkForSnapshot,patrimonyHistory,accounts.length,holdings.length]);
  const patrimonyEvo=useMemo(()=>{
    return Object.entries(patrimonyHistory||{}).sort(([a],[b])=>a<b?-1:1).slice(-12).map(([mk,cents])=>{
      const d=new Date(mk+"-01T00:00:00");
      return { name:d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}).replace(".",""), bars:[{v:cents/100,color:cents>=0?"var(--pos)":"var(--neg)"}] };
    });
  },[patrimonyHistory]);

  // contas a pagar / lembretes: lançamentos previstos (ainda não realizados) que vencem nos próximos 7 dias
  // ou já venceram — reaproveita o mesmo campo status:"previsto" já usado no resto do app, sem duplicar dado
  const lembretes=useMemo(()=>{
    const today=todayISO();
    const limitDate=new Date(); limitDate.setDate(limitDate.getDate()+7);
    const limitIso=new Date(limitDate.getTime()-limitDate.getTimezoneOffset()*60000).toISOString().slice(0,10);
    return txs.filter(t=>!isRealized(t) && t.type!=="transferencia" && t.date<=limitIso)
      .sort((a,b)=>a.date<b.date?-1:1);
  },[txs]);
  function marcarLembretePago(t){
    update(d=>({transactions:d.transactions.map(x=>x.id===t.id?{...x,status:"realizado"}:x)}));
    toast("Marcado como pago.","success");
  }

  // recap automático semanal/mensal por IA: ao abrir o Panorama, se a última semana e o último mês já
  // fechados ainda não têm recap gerado (e tiveram movimentação), gera um automaticamente e guarda —
  // não repete depois disso, e uma falha aqui é silenciosa (é um bônus, não deve incomodar ninguém)
  const autoRecapTried=useRef(false);
  useEffect(()=>{
    if(autoRecapTried.current) return;
    autoRecapTried.current=true;
    (async()=>{
      const today=todayISO();
      const lastWeekKey=weekStartISO(new Date(new Date(today+"T00:00:00").getTime()-7*86400000).toISOString().slice(0,10));
      const lastWeekEnd=new Date(new Date(lastWeekKey+"T00:00:00").getTime()+6*86400000).toISOString().slice(0,10);
      if(!(recaps?.weekly||{})[lastWeekKey]){
        const weekTxs=txs.filter(t=>isRealized(t)&&t.date>=lastWeekKey&&t.date<=lastWeekEnd);
        if(weekTxs.length>0){
          const inc=weekTxs.filter(t=>t.type==="ganho").reduce((s,t)=>s+t.cents,0);
          const exp=weekTxs.filter(t=>t.type==="gasto").reduce((s,t)=>s+t.cents,0);
          const inv=weekTxs.filter(t=>t.type==="investimento").reduce((s,t)=>s+t.cents,0);
          try{
            const prompt=`Dados financeiros da semana de ${fmtDateBR(lastWeekKey)} a ${fmtDateBR(lastWeekEnd)}:\nEntradas: R$ ${(inc/100).toFixed(2)}\nSaídas: R$ ${(exp/100).toFixed(2)}\nInvestido: R$ ${(inv/100).toFixed(2)}\nSaldo: R$ ${((inc-exp-inv)/100).toFixed(2)}\n\nEscreva um recap curto (2 a 3 frases, português do Brasil, tom direto) sobre essa semana financeira.`;
            const text=(await callGemini({prompt})).trim();
            update(d=>({recaps:{...(d.recaps||{weekly:{},monthly:{}}), weekly:{...(d.recaps?.weekly||{}), [lastWeekKey]:{text,generatedAt:new Date().toISOString(),from:lastWeekKey,to:lastWeekEnd}}}}));
          }catch(_){ /* recap é um bônus automático — sem IA disponível, simplesmente não gera dessa vez */ }
        }
      }
      // referência: mês anterior ao mês corrente do calendário (sempre já fechado)
      const curMonthDate=new Date();
      const prevMk=new Date(curMonthDate.getFullYear(),curMonthDate.getMonth()-1,1);
      const prevMonthKey=`${prevMk.getFullYear()}-${String(prevMk.getMonth()+1).padStart(2,"0")}`;
      if(!(recaps?.monthly||{})[prevMonthKey]){
        const b=monthBucket(prevMonthKey);
        if(b.entradas>0||b.saidas>0||b.investido>0){
          try{
            const catData=Object.entries(b.porCategoria).sort((a,b2)=>b2[1]-a[1]).slice(0,5).map(([n,c])=>({categoria:n,valor:(c/100).toFixed(2)}));
            const prompt=`Dados financeiros do mês ${prevMonthKey}:\nEntradas: R$ ${(b.entradas/100).toFixed(2)}\nSaídas: R$ ${(b.saidas/100).toFixed(2)}\nInvestido: R$ ${(b.investido/100).toFixed(2)}\nSaldo: R$ ${((b.entradas-b.saidas-b.investido)/100).toFixed(2)}\nMaiores categorias de gasto: ${JSON.stringify(catData)}\n\nEscreva um recap curto (2 a 3 frases, português do Brasil, tom direto) sobre esse mês financeiro, destacando o principal ponto de atenção ou destaque positivo.`;
            const text=(await callGemini({prompt})).trim();
            update(d=>({recaps:{...(d.recaps||{weekly:{},monthly:{}}), monthly:{...(d.recaps?.monthly||{}), [prevMonthKey]:{text,generatedAt:new Date().toISOString()}}}}));
          }catch(_){ /* idem: sem IA disponível agora, tenta de novo na próxima vez que o Panorama abrir */ }
        }
      }
    })();
  },[]);
  const latestWeeklyRecap=useMemo(()=>{
    const keys=Object.keys(recaps?.weekly||{}).sort();
    return keys.length?{key:keys[keys.length-1],...recaps.weekly[keys[keys.length-1]]}:null;
  },[recaps]);
  const latestMonthlyRecap=useMemo(()=>{
    const keys=Object.keys(recaps?.monthly||{}).sort();
    return keys.length?{key:keys[keys.length-1],...recaps.monthly[keys[keys.length-1]]}:null;
  },[recaps]);

  const byCatAll=useMemo(()=>{
    const m={};
    Object.values(monthIndex).forEach(b=>{
      Object.entries(b.porCategoria).forEach(([cat,cents])=>{ m[cat]=(m[cat]||0)+cents; });
    });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value,color:CAT_COLOR[name]||"var(--text-mut)"}));
  },[monthIndex]);

  // gasto por tag (tags de primeira classe): soma, em todo o histórico realizado, quanto foi gasto em
  // lançamentos marcados com cada #tag na descrição — igual ao "por categoria", só que por tag
  const byTagAll=useMemo(()=>{
    const m={};
    txs.filter(t=>isRealized(t)&&t.type==="gasto").forEach(t=>{
      extractTags(t.description).forEach(tg=>{ m[tg]=(m[tg]||0)+t.cents; });
    });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value],i)=>({name:"#"+name,value,color:QUALITATIVE[i%QUALITATIVE.length]}));
  },[txs]);

  const EVO_CAP=24;
  const evoAll=useMemo(()=>{
    const months=Object.keys(monthIndex).sort();
    if(months.length===0) return { arr:[], truncated:false, total:0 };
    const [fy,fm]=months[0].split("-").map(Number);
    const [ly,lm]=months[months.length-1].split("-").map(Number);
    const total=(ly-fy)*12+(lm-fm)+1;
    const show=Math.min(total,EVO_CAP);
    const start=total-show;
    const arr=[];
    for(let i=start;i<total;i++){
      const d=new Date(fy,fm-1+i,1);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const b=monthBucket(mk);
      arr.push({ name:d.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"}).replace(".",""), bars:[{v:b.entradas/100,color:"var(--pos)"},{v:b.saidas/100,color:"var(--neg)"}], date:d });
    }
    return { arr, truncated: total>EVO_CAP, total };
  },[monthIndex]);
  const activeEvoIdx=view?evoAll.arr.findIndex(e=>e.date.getFullYear()===view.getFullYear()&&e.date.getMonth()===view.getMonth()):-1;

  const [patternsResult,setPatternsResult]=useState("");
  const [patternsBusy,setPatternsBusy]=useState(false);
  const [patternsError,setPatternsError]=useState("");
  async function analyzePatterns(){
    setPatternsBusy(true); setPatternsError(""); setPatternsResult("");
    try{
      const candidates=detectRecurringCandidates(txs, new Date());
      if(candidates.length===0){
        setPatternsResult("Nenhum padrão fora do comum encontrado — seus gastos recorrentes estão regulares.");
        return;
      }
      const prompt=`Aqui estão padrões de gastos recorrentes detectados no histórico financeiro do usuário (JSON): ${JSON.stringify(candidates)}

Escreva um resumo curto e direto em português do Brasil (até 4 frases) destacando o que for mais relevante: assinaturas que pararam de aparecer há muito tempo (podem ter sido esquecidas ou já canceladas) e valores que subiram ou baixaram muito em relação ao normal. Seja direto e útil, sem listar todos os números de novo.`;
      const text=await callGemini({ prompt });
      setPatternsResult(text.trim());
    }catch(err){
      setPatternsError(err.message||"Não foi possível analisar os padrões.");
    }finally{
      setPatternsBusy(false);
    }
  }

  if(txs.length===0){
    return <EmptyState icon="panorama" title="Nenhum lançamento registrado ainda" text="Adicione algo pelo botão de lançamento para ver o panorama geral." action={{label:"Ver no manual",onClick:()=>openHelp("registrar-lancamentos")}}/>;
  }

  return (
    <React.Fragment>
      <div className="hero">
        <div className="herotop">
          <div>
            <div className="eyebrow">Saldo total acumulado (todos os meses)</div>
            <div className={"bal num "+(totals.saldo>=0?"pos":"neg")}>{brl(totals.saldo)}</div>
          </div>
        </div>
        <div className="stats">
          <div className="stat"><div className="k"><Icon name="baixar" size={12}/>Entradas</div><div className="v" style={{color:"var(--pos)"}}>{brl(totals.inc)}</div></div>
          <div className="stat"><div className="k"><Icon name="enviar" size={12}/>Saídas</div><div className="v" style={{color:"var(--neg)"}}>{brl(totals.exp)}</div></div>
          <div className="stat"><div className="k"><Icon name="investimentos" size={12}/>Investido</div><div className="v" style={{color:"var(--inv)"}}>{brl(totals.inv)}</div></div>
        </div>
      </div>

      {(latestWeeklyRecap||latestMonthlyRecap) &&
        <div className="card g-12">
          <h3>Recap automático <Icon name="brilho" size={14} style={{color:"var(--accent)"}}/></h3>
          <div className="sub" style={{marginBottom:latestWeeklyRecap&&latestMonthlyRecap?10:0}}>Gerado por IA sozinho quando a semana ou o mês fecham — nenhum clique necessário.</div>
          {latestMonthlyRecap &&
            <div style={{marginBottom:latestWeeklyRecap?14:0}}>
              <div className="sub" style={{marginBottom:4}}>Mês de {latestMonthlyRecap.key}</div>
              <p style={{fontSize:14,lineHeight:1.6}}>{latestMonthlyRecap.text}</p>
            </div>}
          {latestWeeklyRecap &&
            <div>
              <div className="sub" style={{marginBottom:4}}>Semana de {fmtDateBR(latestWeeklyRecap.from)} a {fmtDateBR(latestWeeklyRecap.to)}</div>
              <p style={{fontSize:14,lineHeight:1.6}}>{latestWeeklyRecap.text}</p>
            </div>}
        </div>}

      <div className="card g-6">
        <h3>Saldo por conta <HelpIcon section="contas-cartoes"/></h3>
        <div className="sub">Soma de todos os lançamentos já registrados em cada conta, desde o início.</div>
        {byAccount.map(a=>{
          const committed=a.kind==="cartao"?cardCommitted(a.id):null;
          return (
          <div className="acct" key={a.id} style={{flexDirection:"column",alignItems:"stretch",gap:0}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div className="adot" style={{background:a.color}}><Icon name={a.kind==="cartao"?"cartao":"banco"} size={16}/></div>
              <div style={{flex:1}}>
                <div className="aname">{a.name}</div>
                <div className="akind">{a.kind==="cartao"?"Cartão":"Conta"}</div>
              </div>
              <span className="num" style={{fontSize:15,fontWeight:500,color:a.balance>=0?"var(--pos)":"var(--neg)"}}>{brl(a.balance)}</span>
            </div>
            {a.kind==="cartao" && a.limit>0 &&
              <div style={{marginTop:8,marginLeft:48}}>
                <ProgressBar spent={committed.net} limit={a.limit} status={committed.net>=a.limit?"over":committed.net/a.limit>=0.8?"warn":"ok"}/>
                <div className="mm">{Math.min(100,committed.net/a.limit*100).toFixed(0)}% do limite comprometido · {brl(committed.net)} de {brl(a.limit)}{committed.credit>0?` · crédito de ${brl(committed.credit)}`:""}</div>
              </div>}
          </div>);})}
      </div>

      <div className="card g-6">
        <h3>Independência Financeira</h3>
        <div className="sub">Quanto os proventos médios dos últimos 6 meses cobririam dos seus gastos médios.</div>
        <div className="bal num" style={{fontSize:32,fontWeight:500,margin:"2px 0 4px",color:fi.pct>=100?"var(--pos)":"var(--text)"}}>{fi.pct.toFixed(1)}%</div>
        <ProgressBar spent={Math.min(fi.pct,100)} limit={100} status={fi.pct>=100?"ok":fi.pct>=50?"warn":"none"}/>
        <div className="mm">Meta: 100% · Proventos médios {brl(Math.round(fi.avgProv))}/mês · Gastos médios {brl(Math.round(fi.avgGasto))}/mês · calculado com base em {fi.monthsWithData} {fi.monthsWithData===1?"mês":"meses"}</div>
      </div>

      <div className="card g-6">
        <h3>Patrimônio estimado <HelpIcon section="panorama-ajuda"/></h3>
        <div className="sub">Saldo das contas (sem cartões) + valor atual da carteira de investimentos.</div>
        <div className="kv"><span className="kk">Em contas</span><span className="vv">{brl(contasBalance)}</span></div>
        <div className="kv"><span className="kk">Em investimentos</span><span className="vv" style={{color:"var(--inv)"}}>{brl(totCur)}</span></div>
        <div className="kv"><span className="kk"><b>Total</b></span><span className="vv" style={{fontSize:18,fontWeight:600}}>{brl(patrimonio)}</span></div>
      </div>

      {lembretes.length>0 &&
        <div className="card g-6">
          <h3>Contas a pagar e lembretes</h3>
          <div className="sub">Lançamentos previstos que vencem nos próximos 7 dias ou já passaram do prazo.</div>
          {lembretes.map(t=>{
            const today=todayISO();
            const overdue=t.date<today;
            const days=Math.round((new Date(t.date+"T00:00:00")-new Date(today+"T00:00:00"))/86400000);
            return (
              <div className="kv" key={t.id}>
                <span className="kk">
                  {t.description||t.category||TYPES[t.type].label}
                  <span className={"tag "+(overdue?"over":days===0?"warn":"ok")} style={{marginLeft:8}}>
                    {overdue?`atrasado ${Math.abs(days)}d`:days===0?"hoje":`em ${days}d`}
                  </span>
                </span>
                <span style={{display:"flex",alignItems:"center",gap:8}}>
                  <span className="vv" style={{color:t.type==="ganho"?"var(--pos)":"var(--neg)"}}>{brl(t.cents)}</span>
                  <button className="sbtn iconsbtn" aria-label="Marcar como pago" onClick={()=>marcarLembretePago(t)}><Icon name="check" size={14}/></button>
                </span>
              </div>);
          })}
        </div>}

      {patrimonyEvo.length>=2 &&
        <div className="card g-6">
          <h3>Histórico de patrimônio</h3>
          <div className="sub" style={{marginBottom:0}}>Snapshot automático do patrimônio total ao final de cada mês.</div>
          <BarGroups data={patrimonyEvo}/>
        </div>}

      <BcbIndicators/>

      <div className="card g-6">
        <h3>Assinaturas e recorrências <button className="sbtn" onClick={analyzePatterns} disabled={patternsBusy}><Icon name="brilho" size={14}/>{patternsBusy?"Analisando…":"Analisar com IA"}</button></h3>
        <div className="sub">Detecta gastos recorrentes que sumiram ou vieram com valor fora do padrão.</div>
        {patternsResult && <p style={{fontSize:14,lineHeight:1.6}}>{patternsResult}</p>}
        {patternsError && <p className="hint" style={{color:"var(--neg)"}}>{patternsError}</p>}
        {!patternsResult && !patternsBusy && !patternsError && <p className="hint">Peça pra IA revisar suas assinaturas e gastos recorrentes em busca de esquecimentos ou cobranças fora do padrão.</p>}
      </div>

      {evoAll.arr.length>0 &&
        <div className="card g-12">
          <h3>Evolução completa</h3>
          <div className="sub" style={{marginBottom:0}}>
            {evoAll.truncated?`Mostrando os últimos ${EVO_CAP} de ${evoAll.total} meses. `:""}Clique em um mês para navegar até ele.
          </div>
          <div className="chlegend"><span><i style={{background:"var(--pos)"}}/>Entradas</span><span><i style={{background:"var(--neg)"}}/>Saídas</span></div>
          <BarGroups data={evoAll.arr} onSelect={onSelectMonth?(i)=>onSelectMonth(evoAll.arr[i].date):undefined} activeIndex={activeEvoIdx}/>
        </div>}

      {byCatAll.length>0 &&
        <div className="card g-12">
          <h3>Gastos por categoria (todo o período)</h3>
          <div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap"}}>
            <Donut data={byCatAll} centerLabel="gastos"/>
            <div style={{flex:1,minWidth:180}}><Legend data={byCatAll}/></div>
          </div>
        </div>}

      {byTagAll.length>0 &&
        <div className="card g-12">
          <h3>Gasto por tag (todo o período)</h3>
          <div className="sub" style={{marginBottom:0}}>Somado a partir das #tags usadas na descrição dos lançamentos.</div>
          <div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap"}}>
            <Donut data={byTagAll} centerLabel="gasto"/>
            <div style={{flex:1,minWidth:180}}><Legend data={byTagAll}/></div>
          </div>
        </div>}
    </React.Fragment>
  );
}
Geral = React.memo(Geral);

/* ---------- ORÇAMENTO ---------- */
function Orcamento({ budgetRows, budgets, budgetExceptions, update, plannedTotal, totalSpent, monthLabel, txs, view, accounts }){
  const [openCat,setOpenCat]=useState(null);
  const [val,setVal]=useState(0);
  const [scope,setScope]=useState("default"); // "default" (todos os meses) | "month" (exceção deste mês)
  const allCats=CATS.gasto.map(c=>c[0]);
  const vKey=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,"0")}`;

  const setBudgetDefault=(c,cents)=>{update(d=>{const b={...d.budgets};if(cents>0)b[c]=cents;else delete b[c];return {budgets:b};});};
  const setBudgetException=(c,cents)=>{
    update(d=>{
      const monthMap={...(d.budgetExceptions[vKey]||{})};
      if(cents>0) monthMap[c]=cents; else delete monthMap[c];
      const next={...d.budgetExceptions};
      if(Object.keys(monthMap).length) next[vKey]=monthMap; else delete next[vKey];
      return {budgetExceptions:next};
    });
  };
  const activeCat=openCat||allCats[0];
  const saveBudget=()=>{ if(scope==="month") setBudgetException(activeCat,val); else setBudgetDefault(activeCat,val); toast("Limite salvo.","success"); };
  const removeBudget=()=>{ if(scope==="month") setBudgetException(activeCat,0); else setBudgetDefault(activeCat,0); setVal(0); };
  const pickCategory=(c)=>{
    setOpenCat(c);
    const hasExc=budgetExceptions[vKey]?.[c]!=null;
    setScope(hasExc?"month":"default");
    setVal(hasExc?budgetExceptions[vKey][c]:(budgets[c]||0));
  };
  const pickScope=(s)=>{
    setScope(s);
    setVal(s==="month"?(budgetExceptions[vKey]?.[activeCat]||0):(budgets[activeCat]||0));
  };

  // mesma base do restante do orçamento: gasto conta no mês da fatura do cartão, não no mês da compra
  const prevSpentByCat=useMemo(()=>{
    const d=new Date(view.getFullYear(),view.getMonth()-1,1);
    const pk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const m={};
    txs.filter(t=>t.type==="gasto"&&txEffectiveMonth(t,accounts)===pk).forEach(t=>{m[t.category]=(m[t.category]||0)+t.cents;});
    return m;
  },[txs,view,accounts]);

  // comprometimento das próximas rendas: quanto do que já está lançado (realizado + previsto) pro mês
  // consome a renda esperada dele — olha os 3 próximos meses (o atual e os dois seguintes)
  const commitment=useMemo(()=>{
    const now=new Date();
    return [0,1,2].map(i=>{
      const d=new Date(now.getFullYear(),now.getMonth()+i,1);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      let ganho=0,gasto=0;
      txs.forEach(t=>{
        if(t.type==="transferencia") return;
        const flowMk = t.type==="gasto" ? txEffectiveMonth(t,accounts) : monthKey(t.date);
        if(flowMk!==mk) return;
        if(t.type==="ganho") ganho+=t.cents; else if(t.type==="gasto") gasto+=t.cents;
      });
      const pct = ganho>0 ? gasto/ganho*100 : (gasto>0?100:0);
      return { mk, label:d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}), ganho, gasto, pct, status: ganho===0?"none":pct>=100?"over":pct>=80?"warn":"ok" };
    });
  },[txs,accounts]);

  // simulador "e se" — totalmente local, sem IA: usa a média mensal real dos últimos 6 meses como base
  // e aplica a mudança hipotética na hora, sem gravar nada
  const [simCat,setSimCat]=useState("");
  const [simPct,setSimPct]=useState(0);
  const [simExtraType,setSimExtraType]=useState("gasto");
  const [simExtraValue,setSimExtraValue]=useState(0);
  const avgMonthly=useMemo(()=>{
    const m={};
    txs.filter(isRealized).forEach(t=>{
      if(t.type==="transferencia") return;
      const mk = t.type==="gasto" ? txEffectiveMonth(t,accounts) : monthKey(t.date);
      m[mk]=m[mk]||{ganho:0,gasto:0,inv:0};
      if(t.type==="ganho") m[mk].ganho+=t.cents;
      else if(t.type==="gasto") m[mk].gasto+=t.cents;
      else if(t.type==="investimento") m[mk].inv+=t.cents;
    });
    const keys=Object.keys(m).sort().slice(-6);
    if(keys.length===0) return {ganho:0,gasto:0,inv:0,months:0};
    const sum=keys.reduce((s,k)=>({ganho:s.ganho+m[k].ganho,gasto:s.gasto+m[k].gasto,inv:s.inv+m[k].inv}),{ganho:0,gasto:0,inv:0});
    return { ganho:Math.round(sum.ganho/keys.length), gasto:Math.round(sum.gasto/keys.length), inv:Math.round(sum.inv/keys.length), months:keys.length };
  },[txs,accounts]);
  const avgByCat=useMemo(()=>{
    const m={};
    txs.filter(t=>isRealized(t)&&t.type==="gasto").forEach(t=>{
      const mk=txEffectiveMonth(t,accounts);
      (m[t.category]=m[t.category]||{})[mk]=(m[t.category][mk]||0)+t.cents;
    });
    const out={};
    Object.entries(m).forEach(([cat,byMonth])=>{
      const keys=Object.keys(byMonth).sort().slice(-6);
      out[cat]=Math.round(keys.reduce((s,k)=>s+byMonth[k],0)/Math.max(1,keys.length));
    });
    return out;
  },[txs,accounts]);
  const simResult=useMemo(()=>{
    const catAvg=simCat?(avgByCat[simCat]||0):0;
    const reduction=Math.round(catAvg*(simPct/100));
    const novoGasto=Math.max(0,avgMonthly.gasto-reduction+(simExtraType==="gasto"?simExtraValue:0));
    const novoGanho=avgMonthly.ganho+(simExtraType==="ganho"?simExtraValue:0);
    const saldoAtual=avgMonthly.ganho-avgMonthly.gasto-avgMonthly.inv;
    const novoSaldo=novoGanho-novoGasto-avgMonthly.inv;
    return { reduction, saldoAtual, novoSaldo, delta:novoSaldo-saldoAtual };
  },[avgMonthly,avgByCat,simCat,simPct,simExtraType,simExtraValue]);

  return (
    <React.Fragment>
      <div className="card g-6">
        <h3>Orçamento de {monthLabel} <span className="num" style={{fontSize:14,fontWeight:500,color:totalSpent>plannedTotal&&plannedTotal>0?"var(--neg)":"var(--text)"}}>{brl(totalSpent)} / {brl(plannedTotal)}</span> <HelpIcon section="orcamento-ajuda"/></h3>
        <div className="sub">Defina quanto quer gastar em cada categoria. O histórico ajuda a ser realista. Gastos no cartão contam no mês da fatura, não no mês da compra.</div>
        {budgetRows.length===0 && <p className="hint">Nenhuma categoria com orçamento ou gasto ainda. Adicione um orçamento ao lado.</p>}
        {budgetRows.map(r=>{
          const rollover=r.limit>0?r.limit-(prevSpentByCat[r.cat]||0):0;
          return(
          <div className="budrow" key={r.cat}>
            <div className="bh">
              <span className="bname"><Icon name={CAT_ICON[r.cat]||"outros"} size={15}/> {r.cat}
                {r.status==="over" && <span className="tag over">estourou</span>}
                {r.status==="warn" && <span className="tag warn">atenção</span>}
                {r.status==="ok" && <span className="tag ok">no limite</span>}
              </span>
              <span className="bval">{brl(r.spent)}{r.limit>0 && <span style={{color:"var(--text-mut)"}}> / {brl(r.limit)}</span>}</span>
            </div>
            <ProgressBar spent={r.spent} limit={r.limit} status={r.status}/>
            <div className="mm">
              {r.hist?<>Histórico: mín {brl(r.hist.min)} · média {brl(r.hist.avg)} · máx {brl(r.hist.max)}</>:"Sem histórico ainda"}
              {" · "}
              <button style={{border:"none",background:"none",color:"var(--inv)",cursor:"pointer",fontSize:11,textDecoration:"underline",padding:0}} onClick={()=>pickCategory(r.cat)}>{r.limit>0?"editar limite":"definir limite"}</button>
            </div>
            {r.isException &&
              <div className="mm" style={{color:"var(--inv)"}}>
                Limite específico de {monthLabel}
                {" · "}
                <button style={{border:"none",background:"none",color:"var(--inv)",cursor:"pointer",fontSize:11,textDecoration:"underline",padding:0}} onClick={()=>setBudgetException(r.cat,0)}>remover exceção</button>
              </div>}
            {rollover>0 && <div className="mm" style={{color:"var(--pos)"}}>Sobrou {brl(rollover)} do mês passado nesta categoria — dá para remanejar para este mês ou para investimentos.</div>}
          </div>
        );})}
      </div>
      <div className="card g-6">
        <h3>Definir orçamento</h3>
        <div className="sub">Escolha a categoria, o valor e se vale só para {monthLabel} ou todos os meses (planejamento sazonal).</div>
        <select className="fld" value={activeCat} onChange={e=>pickCategory(e.target.value)} style={{marginBottom:10}}>
          {allCats.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <div className="seg" style={{marginBottom:12}}>
          <button className={scope==="default"?"on in":""} onClick={()=>pickScope("default")}>Todos os meses</button>
          <button className={scope==="month"?"on inv":""} onClick={()=>pickScope("month")}>Neste mês ({monthLabel})</button>
        </div>
        <Money cents={val} onChange={setVal} small onEnter={saveBudget}/>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <button className="sbtn primary" onClick={saveBudget}>Salvar limite</button>
          {val>0 && <button className="sbtn" onClick={removeBudget}>Remover</button>}
        </div>
      </div>

      <div className="card g-12">
        <h3>Comprometimento das próximas rendas</h3>
        <div className="sub" style={{marginBottom:0}}>Quanto do que já está lançado (realizado + previsto) consome a renda esperada em cada mês.</div>
        {commitment.map(c=>(
          <div key={c.mk} style={{marginTop:14}}>
            <div className="bh">
              <span className="bname" style={{textTransform:"capitalize"}}>{c.label}
                {c.status==="over" && <span className="tag over">comprometido</span>}
                {c.status==="warn" && <span className="tag warn">atenção</span>}
                {c.status==="ok" && <span className="tag ok">tranquilo</span>}
              </span>
              <span className="bval">{brl(c.gasto)}{c.ganho>0 && <span style={{color:"var(--text-mut)"}}> / {brl(c.ganho)}</span>}</span>
            </div>
            {c.ganho>0
              ? <ProgressBar spent={c.gasto} limit={c.ganho} status={c.status}/>
              : <p className="hint" style={{marginTop:4}}>{c.gasto>0?"Gastos lançados sem nenhuma renda prevista para o mês.":"Nada lançado ainda para este mês."}</p>}
          </div>
        ))}
      </div>

      <div className="card g-12">
        <h3>Simulador "e se"</h3>
        <div className="sub">Local, sem IA — usa a média real dos últimos {avgMonthly.months||0} meses como base e recalcula na hora.</div>
        {avgMonthly.months===0
          ? <p className="hint">Sem histórico suficiente ainda para simular.</p>
          : <React.Fragment>
              <div className="row2">
                <select className="fld" value={simCat} onChange={e=>setSimCat(e.target.value)}>
                  <option value="">Reduzir uma categoria (opcional)…</option>
                  {allCats.map(c=><option key={c} value={c}>{c} (média {brl(avgByCat[c]||0)}/mês)</option>)}
                </select>
                <input className="fld" type="number" min="0" max="100" placeholder="% de redução" value={simPct||""} onChange={e=>setSimPct(Math.min(100,Math.max(0,parseInt(e.target.value,10)||0)))} disabled={!simCat} style={{flex:"0 0 auto",maxWidth:160}}/>
              </div>
              <div className="row2">
                <select className="fld" value={simExtraType} onChange={e=>setSimExtraType(e.target.value)} style={{flex:"0 0 auto",maxWidth:200}}>
                  <option value="gasto">Novo gasto mensal (opcional)</option>
                  <option value="ganho">Novo ganho mensal (opcional)</option>
                </select>
                <Money cents={simExtraValue} onChange={setSimExtraValue} small/>
              </div>
              <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid var(--surface-2)"}}>
                <div className="kv"><span className="kk">Saldo médio mensal atual</span><span className="vv">{brl(simResult.saldoAtual)}</span></div>
                <div className="kv"><span className="kk"><b>Saldo médio mensal projetado</b></span><span className="vv" style={{fontSize:16,fontWeight:600,color:simResult.novoSaldo>=simResult.saldoAtual?"var(--pos)":"var(--neg)"}}>{brl(simResult.novoSaldo)}</span></div>
                <div className="mm">{simResult.delta>=0?"+":""}{brl(simResult.delta)} por mês em relação ao atual{simResult.reduction>0?` (redução de ${brl(simResult.reduction)} em ${simCat})`:""}</div>
              </div>
            </React.Fragment>}
      </div>
    </React.Fragment>
  );
}
Orcamento = React.memo(Orcamento);

/* ---------- METAS ---------- */
function Metas({ goals, update, txs }){
  const [form,setForm]=useState(null);
  const [contribId,setContribId]=useState(null);
  const [contrib,setContrib]=useState(0);
  const blank={name:"",target:0,saved:0,deadline:"",linkedCategory:null};
  // categorias que fazem sentido ligar a uma meta (poupança/investimento) — gasto fica de fora
  const linkedCategoryOptions=useMemo(()=>[...CATS.investimento,...CATS.ganho].map(c=>c[0]).filter((v,i,a)=>a.indexOf(v)===i),[]);
  // meta ligada a uma categoria real: o progresso soma automaticamente todo lançamento realizado daquela
  // categoria, além do valor guardado manualmente — não precisa "avisar" a meta toda vez que investe
  const goalAutoSaved=(g)=>{
    if(!g.linkedCategory) return 0;
    return txs.filter(t=>isRealized(t)&&t.category===g.linkedCategory&&t.type!=="gasto").reduce((s,t)=>s+t.cents,0);
  };
  const save=()=>{if(!form.name.trim()||form.target<=0)return;update(d=>({goals: form.id?d.goals.map(x=>x.id===form.id?form:x):[...d.goals,{...form,id:uid()}]}));setForm(null);toast("Meta salva.","success");};
  const remove=(g)=>askConfirm({title:"Excluir meta?",message:`"${g.name}" será removida.`,onConfirm:()=>{update(d=>({goals:d.goals.filter(x=>x.id!==g.id)}));toast("Meta excluída.","success");}});
  const addContrib=(g)=>{update(d=>({goals:d.goals.map(x=>x.id===g.id?{...x,saved:x.saved+contrib}:x)}));setContribId(null);setContrib(0);toast("Valor guardado.","success");};
  const monthsLeft=(dl)=>{if(!dl)return null;const d=new Date(dl),n=new Date();return Math.max(0,(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth());};
  return (
    <div className="card">
      <h3>Metas e planos <span style={{display:"flex",alignItems:"center",gap:6}}><button className="sbtn" onClick={()=>setForm(blank)}><Icon name="adicionar" size={14}/> Nova</button><HelpIcon section="metas-ajuda"/></span></h3>
      <div className="sub">Pague seus sonhos primeiro: defina valor, prazo e acompanhe o progresso.</div>
      {form &&
        <div className="miniform">
          <input className="fld" placeholder="Nome (ex: Viagem, Reserva)" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} style={{marginBottom:10}}/>
          <div style={{margin:"10px 0"}}><div className="sub" style={{marginBottom:4}}>Valor total</div><Money cents={form.target} onChange={v=>setForm({...form,target:v})} small/></div>
          <div style={{margin:"10px 0"}}><div className="sub" style={{marginBottom:4}}>Já guardado (manual)</div><Money cents={form.saved} onChange={v=>setForm({...form,saved:v})} small/></div>
          <div className="sub" style={{marginBottom:4}}>Prazo</div>
          <input className="fld" type="date" value={form.deadline} onChange={e=>setForm({...form,deadline:e.target.value})} style={{marginBottom:10}}/>
          <div className="sub" style={{marginBottom:4}}>Ligar a uma categoria (opcional)</div>
          <select className="fld" value={form.linkedCategory||""} onChange={e=>setForm({...form,linkedCategory:e.target.value||null})}>
            <option value="">Nenhuma — só o valor guardado manualmente</option>
            {linkedCategoryOptions.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <div className="hint">Ligando a uma categoria, todo lançamento real dessa categoria soma automaticamente no progresso da meta.</div>
          <div style={{display:"flex",gap:8,marginTop:12}}><button className="sbtn primary" onClick={save}>Salvar meta</button><button className="sbtn" onClick={()=>setForm(null)}>Cancelar</button></div>
        </div>}
      {goals.length===0 && !form && <p className="hint">Nenhuma meta ainda. Crie sua primeira, como uma reserva de emergência.</p>}
      {goals.map(g=>{
        const autoSaved=goalAutoSaved(g);
        const totalSaved=g.saved+autoSaved;
        const pct=g.target>0?Math.min(100,totalSaved/g.target*100):0;
        const ml=monthsLeft(g.deadline);
        const need=ml&&ml>0?Math.max(0,Math.ceil((g.target-totalSaved)/ml)):null;
        return (
          <div className="goal" key={g.id}>
            <div className="gh">
              <div>
                <div className="gname"><Icon name="metas" size={16}/> {g.name}</div>
                <div className="gsub">{pct.toFixed(0)}% concluído{g.deadline && <> · prazo {new Date(g.deadline+"T00:00:00").toLocaleDateString("pt-BR",{month:"short",year:"numeric"})}</>}{need!=null && <> · guardar {brl(need)}/mês</>}</div>
              </div>
              <div style={{display:"flex",gap:2}}>
                <button className="sbtn iconsbtn" aria-label="Editar" onClick={()=>setForm(g)}><Icon name="editar" size={15}/></button>
                <button className="sbtn iconsbtn" aria-label="Excluir" onClick={()=>remove(g)}><Icon name="excluir" size={15}/></button>
              </div>
            </div>
            <div className="bar"><i style={{width:pct+"%",background:pct>=100?"var(--pos)":"var(--inv)"}}/></div>
            <div className="gv"><span className="num">{brl(totalSaved)}</span><span className="num" style={{color:"var(--text-mut)"}}>{brl(g.target)}</span></div>
            {g.linkedCategory && <div className="mm">Ligada à categoria "{g.linkedCategory}" · {brl(autoSaved)} de lançamentos reais + {brl(g.saved)} guardados manualmente</div>}
            {contribId===g.id
              ? <div style={{marginTop:12}}><Money cents={contrib} onChange={setContrib} small onEnter={()=>addContrib(g)} autoFocus/><div style={{display:"flex",gap:8,marginTop:8}}><button className="sbtn primary" onClick={()=>addContrib(g)}>Guardar</button><button className="sbtn" onClick={()=>setContribId(null)}>Cancelar</button></div></div>
              : <div className="gacts"><button className="sbtn" onClick={()=>{setContribId(g.id);setContrib(0);}}><Icon name="adicionar" size={13}/> Guardar dinheiro</button></div>}
          </div>);
      })}
    </div>
  );
}
Metas = React.memo(Metas);

/* ---------- INVESTIMENTOS ---------- */
function Investimentos({ holdings, update, monthIndex, monthLabel, txs, view, onSelectMonth }){
  const [form,setForm]=useState(null);
  const [classFilter,setClassFilter]=useState(null);
  const EMPTY_BUCKET={entradas:0,saidas:0,investido:0,proventos:0,porCategoria:{},itens:[]};
  const monthBucket=(mk)=>monthIndex[mk]||EMPTY_BUCKET;
  const vKey=`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,"0")}`;
  const blank={name:"",cls:CLASSES[0],invested:0,current:0};
  const save=()=>{if(!form.name.trim())return;update(d=>({holdings: form.id?d.holdings.map(x=>x.id===form.id?form:x):[...d.holdings,{...form,id:uid()}]}));setForm(null);toast("Ativo salvo.","success");};
  const remove=(h)=>askConfirm({title:"Excluir ativo?",message:`"${h.name}" será removido da sua carteira.`,onConfirm:()=>{update(d=>({holdings:d.holdings.filter(x=>x.id!==h.id)}));toast("Ativo excluído.","success");}});
  const totInv=holdings.reduce((s,h)=>s+h.invested,0);
  const totCur=holdings.reduce((s,h)=>s+h.current,0);
  const rend=totCur-totInv;
  const byClass=useMemo(()=>{const m={};holdings.forEach(h=>{m[h.cls]=(m[h.cls]||0)+h.current;});return Object.entries(m).filter(([,v])=>v>0).map(([name,value])=>({name,value,color:CLASS_COLOR[name]||"var(--text-mut)"}));},[holdings]);
  const aportesMes=monthBucket(vKey).investido;
  const proventosMes=monthBucket(vKey).proventos;
  const proventosTotal=useMemo(()=>Object.values(monthIndex).reduce((s,b)=>s+b.proventos,0),[monthIndex]);
  const proventosEvo=useMemo(()=>{
    const arr=[];
    for(let i=5;i>=0;i--){
      const d=new Date(view.getFullYear(),view.getMonth()-i,1);
      const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      const b=monthBucket(mk);
      arr.push({name:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".",""),bars:[{v:b.investido/100,color:"var(--inv)"},{v:b.proventos/100,color:"var(--pos)"}],date:d});
    }
    return arr;
  },[monthIndex,view]);
  const hasProventosEvo=proventosEvo.some(m=>m.bars.some(b=>b.v>0));
  const activeProvIdx=proventosEvo.findIndex(e=>e.date.getFullYear()===view.getFullYear()&&e.date.getMonth()===view.getMonth());
  const fi=useMemo(()=>financialIndependence(monthIndex,view),[monthIndex,view]);
  const toggleClass=(name)=>setClassFilter(f=>f===name?null:name);
  const visibleHoldings=classFilter?holdings.filter(h=>h.cls===classFilter):holdings;
  return (
    <React.Fragment>
      <div className="card g-6">
        <h3>Carteira consolidada <HelpIcon section="investimentos-ajuda"/></h3>
        <div className="kv"><span className="kk">Total aplicado</span><span className="vv" style={{color:"var(--inv)"}}>{brl(totInv)}</span></div>
        <div className="kv"><span className="kk">Valor atual</span><span className="vv">{brl(totCur)}</span></div>
        <div className="kv"><span className="kk">Rendimento</span><span className="vv" style={{color:rend>=0?"var(--pos)":"var(--neg)"}}>{rend>=0?"+":"−"} {brlNum(Math.abs(rend))}{totInv>0 && <span style={{fontSize:13,opacity:.8}}>{"  ("}{(rend/totInv*100).toFixed(1)}%{")"}</span>}</span></div>
        <div className="kv"><span className="kk">Aportes em {monthLabel}</span><span className="vv" style={{color:"var(--inv)"}}>{brl(aportesMes)}</span></div>
      </div>
      <div className="card g-6">
        <h3>Proventos recebidos</h3>
        <div className="sub">Dividendos e renda passiva, separados do capital aportado.</div>
        <div className="kv"><span className="kk">Recebido em {monthLabel}</span><span className="vv" style={{color:"var(--pos)"}}>{brl(proventosMes)}</span></div>
        <div className="kv"><span className="kk">Total acumulado</span><span className="vv" style={{color:"var(--pos)"}}>{brl(proventosTotal)}</span></div>
        {hasProventosEvo &&
          <React.Fragment>
            <div className="chlegend" style={{marginTop:8}}><span><i style={{background:"var(--inv)"}}/>Aportes</span><span><i style={{background:"var(--pos)"}}/>Proventos</span></div>
            <BarGroups data={proventosEvo} onSelect={onSelectMonth?(i)=>onSelectMonth(proventosEvo[i].date):undefined} activeIndex={activeProvIdx}/>
          </React.Fragment>}
      </div>

      <div className="card g-6">
        <h3>Independência Financeira</h3>
        <div className="sub">Quanto os proventos médios dos últimos 6 meses cobririam dos seus gastos médios.</div>
        <div className="bal num" style={{fontSize:32,fontWeight:500,margin:"2px 0 4px",color:fi.pct>=100?"var(--pos)":"var(--text)"}}>{fi.pct.toFixed(1)}%</div>
        <ProgressBar spent={Math.min(fi.pct,100)} limit={100} status={fi.pct>=100?"ok":fi.pct>=50?"warn":"none"}/>
        <div className="mm">Meta: 100% · Proventos médios {brl(Math.round(fi.avgProv))}/mês · Gastos médios {brl(Math.round(fi.avgGasto))}/mês · calculado com base em {fi.monthsWithData} {fi.monthsWithData===1?"mês":"meses"}</div>
      </div>

      {byClass.length>0 &&
        <div className="card g-6">
          <h3>Composição por classe</h3>
          <div className="sub" style={{marginBottom:0}}>Clique numa classe para filtrar seus ativos.</div>
          <div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap"}}>
            <Donut data={byClass} size={150} onSelect={toggleClass} selected={classFilter} centerLabel="carteira"/>
            <div style={{flex:1,minWidth:160}}><Legend data={byClass} onSelect={toggleClass} selected={classFilter}/></div>
          </div>
        </div>}
      <div className="card g-12">
        <h3>Seus ativos <button className="sbtn" onClick={()=>setForm(blank)}><Icon name="adicionar" size={14}/> Adicionar</button></h3>
        {classFilter &&
          <div className="filterchip">
            <span>Filtrando: {classFilter}</span>
            <button aria-label="Limpar filtro" onClick={()=>setClassFilter(null)}><Icon name="fechar" size={12}/></button>
          </div>}

// parcelado (não "fixo"/recorrente) sempre carrega o sufixo "(i/n)" no fim da descrição, gerado no submit()
// do formulário — é o único jeito de diferenciar os dois sem guardar um campo novo no lançamento
function isInstallmentSeries(t){
  return t.seriesTotal>1 && new RegExp(`\\(${t.seriesIndex+1}\\/${t.seriesTotal}\\)$`).test(t.description||"");
}
const monthsFromToday=(dateIso)=>{ const d=new Date(dateIso+"T00:00:00"),n=new Date(); return Math.max(0,(d.getFullYear()-n.getFullYear())*12+(d.getMonth()-n.getMonth())); };
/* custo real do parcelamento vs. CDI: parcelamento "sem juros" no Brasil não cobra nada a mais no nominal,
   mas segurar o dinheiro por mais tempo (em vez de pagar à vista) tem valor — se investido ao CDI nesse
   meio tempo, esse valor futuro vale menos em termos de hoje. A diferença entre o nominal das parcelas que
   faltam e o valor presente (descontado ao CDI) é a economia real de ter parcelado em vez de pago à vista. */
function Parcelamentos({ txs }){
  const [cdiAnnual,setCdiAnnual]=useState(null);
  useEffect(()=>{
    fetchBcbIndicators().then(d=>{
      // CDI vem como taxa diária (código 12 do SGS) — anualiza por 252 dias úteis, convenção padrão no Brasil.
      // Sem CDI disponível, usa a Selic meta (já anual) como aproximação (historicamente muito próximas).
      if(d.cdi!=null) setCdiAnnual((Math.pow(1+d.cdi/100,252)-1)*100);
      else if(d.selic!=null) setCdiAnnual(d.selic);
    }).catch(()=>{});
  },[]);
  const series=useMemo(()=>{
    const groups={};
    txs.forEach(t=>{ if(isInstallmentSeries(t)) (groups[t.seriesId]=groups[t.seriesId]||[]).push(t); });
    return Object.values(groups).map(items=>{
      const sorted=[...items].sort((a,b)=>a.seriesIndex-b.seriesIndex);
      const remaining=sorted.filter(t=>!isRealized(t));
      if(remaining.length===0) return null;
      return { seriesId:sorted[0].seriesId, baseDesc:(sorted[0].description||"").replace(/\s*\(\d+\/\d+\)$/,"")||sorted[0].category, total:sorted.length, paidCount:sorted.length-remaining.length, remaining };
    }).filter(Boolean);
  },[txs]);
  if(series.length===0) return null;
  const monthlyRate = cdiAnnual!=null ? Math.pow(1+cdiAnnual/100,1/12)-1 : null;
  return (
    <div className="card g-12">
      <h3>Parcelamentos ativos</h3>
      <div className="sub" style={{marginBottom:0}}>{monthlyRate!=null?"Economia real de ter parcelado em vez de pago à vista, descontando as parcelas futuras pela CDI/Selic vigente.":"Parcelas que ainda faltam pagar."}</div>
      {series.map(s=>{
        const nominal=s.remaining.reduce((sum,t)=>sum+t.cents,0);
        const presentValue = monthlyRate!=null ? s.remaining.reduce((sum,t)=>sum+t.cents/Math.pow(1+monthlyRate,monthsFromToday(t.date)+1),0) : null;
        const economia = presentValue!=null ? Math.round(nominal-presentValue) : null;
        return (
          <div className="kv" key={s.seriesId} style={{alignItems:"flex-start"}}>
            <span className="kk">{s.baseDesc} <span style={{color:"var(--text-mut)"}}>· {s.paidCount}/{s.total} pagas</span></span>
            <span className="vv" style={{textAlign:"right"}}>
              {brl(nominal)} restantes
              {economia!=null && <div className="mm" style={{marginTop:2}}>economia real ≈ {brl(economia)}</div>}
            </span>
          </div>);
      })}
    </div>
  );
}

const EXTRATO_LINE_RE=/(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+(.+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;
function parseExtratoText(text){
  const year=new Date().getFullYear();
  const out=[];
  text.split(/\n+/).forEach(raw=>{
    const line=raw.trim();
    if(!line)return;
    const m=line.match(EXTRATO_LINE_RE);
    if(!m)return;
    const [,dpart,desc,vpart]=m;
    const [dd,mm,yy]=dpart.split("/");
    const yr=yy?(yy.length===2?"20"+yy:yy):String(year);
    const iso=`${yr}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;
    const neg=vpart.trim().startsWith("-");
    const num=parseFloat(vpart.replace(/-/g,"").replace(/\./g,"").replace(",","."));
    if(isNaN(num))return;
    const cents=Math.round(num*100);
    const type=neg?"gasto":"ganho";
    out.push({ id:uid(), date:iso, desc:desc.trim(), cents, type, category:CATS[type][0][0], acctId:"" });
  });
  return out;
}

  const [pdfError,setPdfError]=useState("");
  const [photoBusy,setPhotoBusy]=useState(false);
  const [photoError,setPhotoError]=useState("");
  const pdfRef=useRef(null);
  const photoRef=useRef(null);

  // conta padrão pré-selecionada para cada item reconhecido, assim "Aprovar" já fica liberado sem passo extra
  function withDefaultAccount(arr){
    const def=accounts[0]?.id||"";
    return arr.map(it=>({ ...it, acctId:def }));
  }
  function parse(){ setItems(withDefaultAccount(parseExtratoText(text))); }

  async function handlePhoto(e){
    const f=e.target.files?.[0];
    if(!f) return;
    setPhotoError(""); setPhotoBusy(true);
    try{
      const receipt=await analyzeReceiptWithAI(f);
      const item=sanitizeAiReceipt(receipt,accounts);
      setItems(prev=>[item,...prev]);
    }catch(err){
      setPhotoError(err.message||"Não foi possível ler este recibo.");
    }finally{
      setPhotoBusy(false);
      if(photoRef.current) photoRef.current.value="";
    }
  }

  async function readPdfLocally(f){
    await loadPdfJs();
    const buf=await f.arrayBuffer();
    const pdf=await window.pdfjsLib.getDocument({ data:buf }).promise;
    const extracted=await extractPdfText(pdf);
    if(!extracted.trim()) throw new Error("Nenhum texto encontrado no PDF (pode ser uma imagem escaneada).");
    setText(extracted);
    setItems(withDefaultAccount(parseExtratoText(extracted)));
  }

  async function handlePdf(e){
    const f=e.target.files?.[0];
    if(!f) return;
    setPdfError(""); setPdfBusy(true);
    try{
      try{
        const aiTx=await analyzeStatementWithAI(f);
        if(aiTx.length===0) throw new Error("A IA não encontrou lançamentos neste PDF.");
        setItems(sanitizeAiTransactions(aiTx,accounts));
        try{ // popula o texto bruto também, só como referência para conferência manual
          await loadPdfJs();
          const buf=await f.arrayBuffer();
          const pdf=await window.pdfjsLib.getDocument({ data:buf }).promise;
          setText(await extractPdfText(pdf));
        }catch(_){}
        return;
      }catch(aiErr){
        console.error("IA indisponível, caindo para leitura local:", aiErr);
        setPdfError(`IA indisponível (${aiErr.message}) — lendo localmente.`);
        await readPdfLocally(f);
        return;
      }
    }catch(err){
      setPdfError(err.message||"Não foi possível ler este PDF.");
    }finally{
      setPdfBusy(false);
      if(pdfRef.current) pdfRef.current.value="";
    }
  }

  function updateItem(id,patch){ setItems(items.map(it=>it.id===id?{...it,...patch}:it)); }
  function removeItem(id){ setItems(items.filter(it=>it.id!==id)); }
  // anti-duplicata: mesma data + mesmo valor + mesmo tipo + mesma descrição já existe no histórico. Não bloqueia
  // (pode ser um gasto legítimo repetido), só avisa e deixa de fora do "Aprovar todos" por padrão — quem quiser
  // importar mesmo assim aprova aquele item individualmente.
  const dupIds=useMemo(()=>{
    const set=new Set();
    items.forEach(it=>{
      const dup=txs.some(t=>t.date===it.date && t.cents===it.cents && t.type===it.type && (t.description||"").trim().toLowerCase()===(it.desc||"").trim().toLowerCase());
      if(dup) set.add(it.id);
    });
    return set;
  },[items,txs]);
  function approveOne(it){
    update(d=>({transactions:[{id:uid(),type:it.type,cents:it.cents,category:it.category,description:it.desc,date:it.date,acctId:it.acctId,status:it.date>todayISO()?"previsto":"realizado"},...d.transactions]}));
    removeItem(it.id);
    toast("Lançamento aprovado.","success");
  }
  function approveAll(){
    const ready=items.filter(it=>it.acctId && !dupIds.has(it.id));
    if(ready.length===0)return;
    const today=todayISO();
    const entries=ready.map(it=>({id:uid(),type:it.type,cents:it.cents,category:it.category,description:it.desc,date:it.date,acctId:it.acctId,status:it.date>today?"previsto":"realizado"}));
    update(d=>({transactions:[...entries,...d.transactions]}));
    const readyIds=new Set(ready.map(it=>it.id));
    setItems(items.filter(it=>!readyIds.has(it.id)));
    toast(`${entries.length} lançamentos aprovados.`,"success");
  }

  return (
    <div className="card">
      <h3>Extrato Inteligente <HelpIcon section="extrato-ajuda"/></h3>
      <div className="sub">Cole o texto copiado do extrato do banco, importe o PDF ou uma foto de recibo — a IA lê e já sugere tipo, categoria e conta de cada lançamento.</div>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <button className="sbtn" onClick={()=>pdfRef.current?.click()} disabled={pdfBusy||photoBusy}>
          <Icon name="brilho" size={14}/>{pdfBusy?"Analisando com IA…":"Importar PDF do extrato"}
        </button>
        <input ref={pdfRef} type="file" accept="application/pdf" style={{display:"none"}} onChange={handlePdf}/>
        <button className="sbtn" onClick={()=>photoRef.current?.click()} disabled={pdfBusy||photoBusy}>
          <Icon name="camera" size={14}/>{photoBusy?"Lendo recibo…":"Ler recibo (foto)"}
        </button>
        <input ref={photoRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handlePhoto}/>
      </div>
      {pdfError && <div style={{color:"var(--neg)",fontSize:12,marginBottom:12}}>{pdfError}</div>}
      {photoError && <div style={{color:"var(--neg)",fontSize:12,marginBottom:12}}>{photoError}</div>}
      <textarea className="fld" rows={6}
        style={{resize:"vertical",fontFamily:"'IBM Plex Mono',monospace",fontSize:13,marginBottom:10}}
        placeholder={"01/07/2026 Compra Mercado XYZ -150,00\n05/07/2026 PIX recebido 500,00"}
        value={text} onChange={e=>setText(e.target.value)} />
      <div style={{display:"flex",gap:8}}>
        <button className="sbtn primary" onClick={parse} disabled={!text.trim()}>Analisar texto</button>
        {items.length>0 && <button className="sbtn" onClick={()=>{setItems([]);setText("");}}>Limpar</button>}
      </div>

      {items.length>0 &&
        <div style={{marginTop:16}}>
          {dupIds.size>0 &&
            <p className="hint" style={{color:"var(--warn)"}}>{dupIds.size} possível{dupIds.size!==1?"eis":""} duplicata{dupIds.size!==1?"s":""} encontrada{dupIds.size!==1?"s":""} (já existe lançamento igual) — deixadas de fora de "Aprovar todos", mas podem ser aprovadas individualmente se for intencional.</p>}
          {items.map(it=>(
            <div key={it.id} className="miniform">
              <div className="row2" style={{marginBottom:8,alignItems:"center"}}>
                <span className="num" style={{fontSize:13,color:"var(--text-mut)",flex:"0 0 auto"}}>{new Date(it.date+"T00:00:00").toLocaleDateString("pt-BR")}</span>
                <span style={{fontSize:13}}>{it.desc||"—"}{dupIds.has(it.id) && <span className="tag warn" style={{marginLeft:8}}>possível duplicata</span>}</span>
                <div style={{flex:"0 0 150px",minWidth:130}}><Money cents={it.cents} onChange={v=>updateItem(it.id,{cents:v})} small/></div>
              </div>
              <div className="row2">
                <select className="fld" value={it.type} onChange={e=>{const type=e.target.value;updateItem(it.id,{type,category:CATS[type][0][0]});}}>
                  {Object.entries(TYPES).filter(([k])=>k!=="transferencia").map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                </select>
                <select className="fld" value={it.category} onChange={e=>updateItem(it.id,{category:e.target.value})}>
                  {CATS[it.type].map(([name])=><option key={name} value={name}>{name}</option>)}
                </select>
                <select className="fld" value={it.acctId} onChange={e=>updateItem(it.id,{acctId:e.target.value})}>
                  <option value="">Conta…</option>
                  {accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button className="sbtn primary" disabled={!it.acctId} onClick={()=>approveOne(it)}><Icon name="check" size={14}/> Aprovar</button>
                <button className="sbtn" onClick={()=>removeItem(it.id)}>Descartar</button>
              </div>
            </div>
          ))}
          <button className="submit" onClick={approveAll}>Aprovar todos selecionados ({items.filter(it=>it.acctId && !dupIds.has(it.id)).length})</button>
        </div>}
      {items.length===0 && <p className="hint">Dica: cole linhas no formato "DD/MM/AAAA descrição valor", ex: 01/07/2026 Compra Mercado -150,00. Valores negativos viram gasto, positivos viram ganho.</p>}
    </div>
  );
}

  });

});

<script>window.__RAZAO_APP_LOADED__ = false;</script>
<!-- app.compiled.js é o JSX já pré-compilado (gerado por "node build.js"). Se existir e rodar até o fim,
     ele mesmo marca __RAZAO_APP_LOADED__ = true e o bloco abaixo não faz nada. Se não existir (404) ou
     falhar no meio, o bloco abaixo cai para compilar em tempo de execução — carregando o Babel só agora,
     sob demanda, nunca no boot normal. Isso faz o app funcionar igual com ou sem o passo de build. -->
<script src="app.compiled.js" onerror="window.__RAZAO_COMPILED_MISSING__=true"></script>
<script>
  (function(){
    function showFatalError(detail){
      const root = document.getElementById('root');
      if(root) root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08090D;color:#EDEFF4;font-family:system-ui,sans-serif;text-align:center;padding:24px;">'
        + '<div><h2 style="margin-bottom:8px;">Não foi possível iniciar o Razão</h2>'
        + '<p style="color:#98A0B3;font-size:14px;max-width:360px;margin:0 auto 4px;">Verifique sua conexão e recarregue a página.</p>'
        + '<p style="color:#98A0B3;font-size:11px;opacity:.7;">' + (detail||'') + '</p></div></div>';
    }
    function runtimeCompileFallback(){
      const el = document.getElementById('app-jsx');
      if(!el) return;
      try{
        const code = el.textContent;
        const out = Babel.transform(code, { presets: ['react'], plugins: [['transform-react-jsx', { runtime: 'classic' }]] }).code;
        const s = document.createElement('script'); s.type='text/javascript'; s.text = out; document.body.appendChild(s);
      }catch(err){
        console.error('JSX compile error', err);
        showFatalError(String(err && err.message || err));
      }
    }
    if(window.__RAZAO_APP_LOADED__) return; // app.compiled.js já compilou e renderizou com sucesso
    const s = document.createElement('script');
    s.src = 'vendor/babel.min.js';
    s.onload = runtimeCompileFallback;
    s.onerror = function(){ showFatalError('Não foi possível carregar o compilador (vendor/babel.min.js).'); };
    document.head.appendChild(s);
  })();
</script>
<script>
  // service worker: cache-first pro shell estático, pra abrir mesmo sem internet (ver sw.js).
  // Se o registro falhar por qualquer motivo (file://, navegador sem suporte, etc.), o app
  // continua funcionando normalmente — isso é só uma melhoria de abertura offline, não requisito.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
